name: 编译 ShizukuVolumePanel APK

# 触发方式：
#  1) 上传/更新 ShizukuVolumePanel.zip 或本文件后 push
#  2) Actions 页面手动点 "Run workflow"
on:
  push:
    paths:
      - 'ShizukuVolumePanel.zip'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'ShizukuVolumePanel.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 压缩包里套了一层 ShizukuVolumePanel/ 文件夹，
      # 这里解压后自动找含 settings.gradle.kts 的目录，套几层都不怕。
      - name: 定位并解压源码包
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'ShizukuVolumePanel.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::仓库根目录找不到 ShizukuVolumePanel.zip"
            exit 1
          fi
          echo "使用压缩包: $ZIP"
          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"

          SETTINGS="$(find "$RUNNER_TEMP/src" -type f -name 'settings.gradle.kts' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::解压后找不到 settings.gradle.kts，压缩包结构可能不对"
            find "$RUNNER_TEMP/src" -maxdepth 3 -print
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "工程目录: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ===== 关键修复 =====
      # setup-android@v3 默认 packages 为 "tools platform-tools"，
      # 但 legacy 的 "tools" 包已被 Google 从 SDK 仓库下架。
      # 新版 cmdline-tools 下执行 `sdkmanager tools` 会报
      #   Warning: Failed to find package 'tools'
      # 并以 exit code 1 结束，导致任务在编译还没开始前就挂掉。
      # 这里显式只装 platform-tools，跳过已下架的 tools。
      - name: Android SDK 环境
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 用 sdkmanager 装 compileSdk 35 对应的平台与构建工具。
      # 自动定位可执行文件：兼容 runner 预装的 cmdline-tools 20.0
      # 和 setup-android 下载的 16.0，避免写死路径。
      - name: 安装编译所需 SDK 组件
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit || true)"
          if [ -z "$SM" ]; then
            SM="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SM" ]; then
            echo "::error::找不到 sdkmanager，请检查 Android SDK 路径: $SDK"
            find "$SDK" -maxdepth 3 -print || true
            exit 1
          fi
          chmod +x "$SM"
          echo "sdkmanager: $SM"
          # setup-android 已接受过 license，这里再跑一次只是兜底；
          # 该命令即使无新许可也可能返回非零，用 || true 吞掉。
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 工程不带 gradle-wrapper.jar，显式安装 Gradle 8.9。
      # AGP 8.7.3 最低要求 Gradle 8.9；不使用 gradle/actions/setup-gradle，
      # 因为它面向 wrapper 工程，且 gradle-version 不是它的有效输入。
      - name: 安装 Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          fi

      - name: 校验工具链
        shell: bash
        run: |
          java -version
          gradle --version

      - name: 编译 Debug APK
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.unpack.outputs.project_dir }}"
          APK="$(find "$PROJECT_DIR" -path '*/app/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::没找到 debug APK"
            find "$PROJECT_DIR/app/build" -maxdepth 6 -type f | head -60 || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/ShizukuVolumePanel-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/output/ShizukuVolumePanel-debug.apk"

      - name: 上传 APK（在运行页底部下载）
        uses: actions/upload-artifact@v4
        with:
          name: ShizukuVolumePanel-debug
          path: output/ShizukuVolumePanel-debug.apk
          if-no-files-found: error
          retention-days: 30
