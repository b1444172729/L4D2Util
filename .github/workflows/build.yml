# Github的源码编译成APK的脚本
name: Build APK-from-zip
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压source.zip源码包
        run: unzip -o source.zip

      - name: 自动检测子文件夹并移动到根目录
        run: |
          set -e
          # 循环处理，兼容包了两层目录的情况；最多 3 轮防止死循环
          for i in 1 2 3; do
            if [ -f gradlew ]; then
              echo "gradlew 已在根目录"
              break
            fi
            SUBDIR=$(find . -name "gradlew" -printf "%h\n" | sort | head -1)
            if [ -z "$SUBDIR" ]; then
              break
            fi
            echo "检测到子文件夹: $SUBDIR，移动到根目录"
            # 两条 glob 分别匹配普通文件和隐藏文件（.gradle、.gitignore 等），兼容 sh/bash
            for f in "$SUBDIR"/* "$SUBDIR"/.[!.]*; do
              [ -e "$f" ] && mv "$f" .
            done
            rmdir "$SUBDIR" 2>/dev/null || rm -rf "$SUBDIR"
          done
          # 校验：确保后续步骤能找到 gradlew，失败时在 Actions 面板标红
          if [ ! -f gradlew ]; then
            echo "::error::解压后仍未找到 gradlew，请检查 source.zip 的结构"
            exit 1
          fi
          ls -la

      - name: （可选）Gradle 下载地址替换为腾讯云镜像
        run: |
          # 只换域名，保留项目原本声明的 Gradle 版本（兼容 https\:// 与 https:// 两种写法）
          sed -i 's|services\.gradle\.org/distributions/|mirrors.cloud.tencent.com/gradle/|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 设置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Android SDK（自动处理环境变量冲突）
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platform-tools
            platforms;android-33
            build-tools;33.0.2

      - name: 给gradlew可执行权限
        run: chmod +x gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug

      - name: 输出APK产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
