# 放到仓库的 .github/workflows/build.yml（替换旧文件）
# 仓库根目录只需要：
#   Xuanmen.zip                    ← 源码压缩包（内部可套一层文件夹，脚本自动识别）
#   .github/workflows/build.yml    ← 本文件
#
# 本次修复：旧脚本用 android-actions/setup-android@v3，它默认安装已不存在的
# "tools" 包，在新版 sdkmanager / ubuntu-26.04 镜像上直接 exit 1，导致编译步骤
# 根本没跑到。现在改为直接调用 runner 预装的 sdkmanager，只装真正需要的包。

name: 编译 Xuanmen APK

on:
  push:
    branches: [main, master]
    paths:
      - "Xuanmen.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      zip:
        description: "仓库内源码压缩包路径"
        required: false
        default: "Xuanmen.zip"

jobs:
  build:
    # 固定成熟镜像：ubuntu-latest 现指向 26.04，预装组件变动较大（日志里就是
    # cmdline-tools 20 / Node 24）。24.04 的 Android SDK 布局稳定。
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 必须先解压：zip 里可能直接是 app/ + settings.gradle，也可能还套一层
      # Xuanmen/ 之类的文件夹，用 settings.gradle 反查项目根并摊平到 project/。
      - name: 解压 Xuanmen.zip 并定位项目根目录
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ inputs.zip || 'Xuanmen.zip' }}"
          if [ ! -f "$ZIP" ]; then
            echo "::error::找不到 $ZIP，请把源码压缩包放在仓库根目录"
            exit 1
          fi
          rm -rf extracted project
          mkdir -p extracted project
          # 某些环境下 unzip 因无法还原文件时间戳返回非 0，但文件已解出；
          # 后面用 settings.gradle 是否存在做真正的校验。
          unzip -q -o "$ZIP" -d extracted || true
          HIT=$(find extracted -maxdepth 4 -name settings.gradle -print -quit)
          if [ -z "$HIT" ]; then
            echo "::error::压缩包里找不到 settings.gradle，无法定位 Android 项目根目录"
            find extracted -maxdepth 3 -print
            exit 1
          fi
          ROOT=$(dirname "$HIT")
          echo "项目根目录 = $ROOT"
          cp -r "$ROOT/." project/
          test -f project/settings.gradle && test -f project/app/build.gradle
          ls -la project

      - name: JDK 17（AGP 8.5.2 要求）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.12（Chaquopy buildPython "python3"）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不再使用 android-actions/setup-android：它默认要装 "tools" 包，
      # 新版 sdkmanager 返回 "Failed to find package 'tools'" 并 exit 1。
      # 直接复用 runner 镜像自带的 SDK，只装 compileSdk 35 需要的三个包。
      - name: 配置 Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::找不到 Android SDK 目录：$SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMGR=""
          for c in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                   "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
                   "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SDKMGR="$c"; break; fi
          done
          if [ -z "$SDKMGR" ]; then
            SDKMGR=$(find "$SDK_ROOT" -path '*/bin/sdkmanager' -type f | sort | tail -n 1 || true)
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager = $SDKMGR"

          # 接受许可（yes 管道可能因 SIGPIPE 返回非 0，用 || true 放行）
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          "$SDKMGR" --sdk_root="$SDK_ROOT" --list_installed || true

      - name: Gradle 8.9（源码没有 gradlew，直接装 Gradle）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 源码已把 cryptography / pycryptodome 的硬依赖改成可降级导入，
      # 这里只做静态自检，不再改文件，保证打进 APK 的就是仓库里的源码。
      - name: 校验源码结构
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path("project")
          py = root / "app/src/main/python"
          core = py / "core"
          must = ["settings.gradle", "build.gradle", "gradle.properties",
                  "release.jks", "app/build.gradle", "app/src/main/AndroidManifest.xml",
                  "app/src/main/python/iapp_app.py", "app/src/main/python/iapp_reverse.py"]
          for rel in must:
              if not (root / rel).is_file():
                  raise SystemExit(f"[X] 缺少文件: {rel}")

          bad = []
          for f in sorted(py.rglob("*.py")):
              try:
                  compile(f.read_text(encoding="utf-8"), str(f), "exec")
              except Exception as e:
                  bad.append((str(f), str(e)))
          if bad:
              raise SystemExit(f"[X] Python 语法错误: {bad}")

          sys.path[:0] = [str(py), str(core)]
          for name in ("config", "crypto.aes", "algorithms.common",
                       "algorithms.legacy4", "algorithms.current",
                       "algorithms.factory", "algorithms.transitional",
                       "services.altmode", "services.apk_extract",
                       "services.decrypt", "iapp_reverse", "iapp_app"):
              __import__(name)
          print("[OK] 结构、语法与导入链全部通过")
          PY

      - name: 编译并签名 Release APK
        working-directory: project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp project/app/build/outputs/apk/release/*.apk out/
          if [ -f out/app-release.apk ]; then mv out/app-release.apk out/Xuanmen-v2.0.apk; fi
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Xuanmen-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
