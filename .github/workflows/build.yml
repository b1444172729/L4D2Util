# 放到仓库的 .github/workflows/build.yml
# 仓库根目录只需要两个东西：
#   Xuanmen.zip                    ← 源码压缩包（内部可套一层文件夹，脚本会自动识别）
#   .github/workflows/build.yml    ← 本文件
#
# 流程：解压 zip → 定位 Android 项目根 → 补运行环境 → gradle assembleRelease → 上传 APK

name: 编译 Xuanmen APK

on:
  push:
    branches: [main, master]
    paths:
      - "Xuanmen.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      zip:
        description: "仓库内源码压缩包路径"
        required: false
        default: "Xuanmen.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 核心：先解压压缩包。zip 里可能直接是 app/ + settings.gradle，
      # 也可能还套着一层 Xuanmen/ 之类文件夹，用 settings.gradle 反查项目根，
      # 统一摊平到 project/，后续步骤不用关心压缩包里的层级。
      - name: 解压 Xuanmen.zip 并定位项目根目录
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ inputs.zip || 'Xuanmen.zip' }}"
          if [ ! -f "$ZIP" ]; then
            echo "::error::找不到 $ZIP，请把源码压缩包放在仓库根目录"
            exit 1
          fi
          rm -rf extracted project
          mkdir -p extracted project
          # unzip 在部分环境会因无法还原文件时间戳返回非 0，但文件其实已解出，
          # 故用 || true 放行，后面靠 settings.gradle 存在与否做真正的校验。
          unzip -q -o "$ZIP" -d extracted || true
          HIT=$(find extracted -maxdepth 4 -name settings.gradle -print -quit)
          if [ -z "$HIT" ]; then
            echo "::error::压缩包里找不到 settings.gradle，无法定位 Android 项目根目录"
            find extracted -maxdepth 3 -print
            exit 1
          fi
          ROOT=$(dirname "$HIT")
          echo "项目根目录 = $ROOT"
          cp -r "$ROOT/." project/
          test -f project/settings.gradle && test -f project/app/build.gradle
          ls -la project

      - name: JDK 17（AGP 8.5.2 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.12（Chaquopy buildPython "python3"）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 compileSdk 35 所需平台
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Gradle 8.9（源码没有 gradlew，直接装 Gradle）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 可选但建议：源码里 apk_extract.py / legacy4.py 顶层硬依赖
      # cryptography 与 pycryptodome，而 Chaquopy 的 python{} 没声明 pip 依赖。
      # 这里做幂等兼容补丁，让缺库时降级到包内自带的纯 Python AES，
      # 避免编出来的 APK 一运行就 ImportError。若你已在 Chaquopy 里装好
      # 这两个库，可直接删掉本步骤。
      - name: 补齐运行时兼容补丁（幂等）
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import py_compile, sys

          root = Path("project")

          def patch(rel, old, new, marker):
              p = root / rel
              s = p.read_text(encoding="utf-8")
              if marker in s:
                  print("[skip]", rel, "已打过补丁")
                  return
              if old not in s:
                  print("[warn]", rel, "锚点未命中，跳过")
                  return
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print("[ok]  ", rel)

          patch(
              "app/src/main/python/core/services/apk_extract.py",
              "from cryptography.hazmat.primitives.serialization import Encoding, pkcs7",
              "try:\n    from cryptography.hazmat.primitives.serialization import Encoding, pkcs7\nexcept Exception:\n    Encoding = None\n    pkcs7 = None",
              "Encoding = None",
          )
          patch(
              "app/src/main/python/core/algorithms/legacy4.py",
              "from Crypto.Cipher import AES",
              "try:\n    from Crypto.Cipher import AES\nexcept Exception:\n    from crypto.aes_pure import AESModule as AES",
              "AESModule as AES",
          )

          sfile = root / "settings.gradle"
          s = sfile.read_text(encoding="utf-8")
          old = "dependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}"
          new = "dependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url \"https://chaquo.com/maven\" }\n    }\n}"
          if new in s:
              print("[skip] settings.gradle 已含 chaquo 仓库")
          elif old in s:
              sfile.write_text(s.replace(old, new, 1), encoding="utf-8")
              print("[ok]   settings.gradle 补上 chaquo 仓库")
          else:
              print("[warn] settings.gradle 结构不同，跳过")

          bad = []
          for f in root.rglob("*.py"):
              try:
                  py_compile.compile(str(f), doraise=True)
              except Exception as e:
                  bad.append((str(f), str(e)))
          print("py_compile:", "全部通过" if not bad else bad)
          if bad:
              sys.exit(1)
          PY

      - name: 编译并签名 Release APK
        working-directory: project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp project/app/build/outputs/apk/release/*.apk out/
          if [ -f out/app-release.apk ]; then mv out/app-release.apk out/Xuanmen-v2.0.apk; fi
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Xuanmen-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
