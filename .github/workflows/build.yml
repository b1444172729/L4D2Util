name: Build APK-from-zip
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压仓库根目录source.zip
        run: unzip -o source.zip

      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装Android SDK android‑33
        uses: amondnet/androidsdk@v2
        with:
          api-level: 33
          build-tools: "33.0.2"

      - name: 给gradlew执行权限
        run: chmod +x gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug

      - name: 上传生成APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
