# 聚合网关 · GitHub Actions 编译脚本
#
# 放置位置（硬性要求）：仓库根目录的 .github/workflows/build.yml
#   ⚠️ 不能塞进 dsh_free_model_app.zip —— GitHub 只识别「已提交的明文 YAML」，
#      压缩包里的 workflow 永远不会被触发。
#
# 仓库预期结构：
#   repo/
#   ├── .github/workflows/build.yml      ← 本文件，明文提交
#   └── dsh_free_model_app.zip           ← 完整工程压缩包（里面套一层文件夹）
#
# 触发方式：
#   1. 推送/更新 dsh_free_model_app.zip 或本文件 → 自动构建
#   2. Actions 页面手动 Run workflow（可改构建类型、跳过 bundle、指定 libnode URL）
#
# 产出：Artifacts 里的 AggregateGateway-*.apk（默认 debug，已用 debug keystore 签名，可直接安装）

name: 构建聚合网关 APK

on:
  push:
    paths:
      - 'dsh_free_model_app.zip'
      - '**/dsh_free_model_app.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug 可直接安装；release 为未签名包）'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      skip_bundle:
        description: '跳过拉取上游源码生成 bundle.zip（快速验证壳能否编译）'
        required: false
        default: false
        type: boolean
      libnode_url:
        description: 'nodejs-mobile Android arm64 产物 zip 的下载直链（留空则自动探测）'
        required: false
        default: ''
        type: string
      libnode_sha256:
        description: '上述 zip 的 SHA-256（可选，用于校验）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.9'
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  SKIP_BUNDLE: ${{ inputs.skip_bundle }}
  LIBNODE_URL: ${{ inputs.libnode_url || vars.NODE_MOBILE_URL || '' }}
  LIBNODE_SHA256: ${{ inputs.libnode_sha256 || vars.NODE_MOBILE_SHA256 || '' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: 解压 → 准备运行时 → 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------- 1
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          lfs: true

      # ---------------------------------------------------------------- 2
      # 定位工程：不假定 zip 内容，也不假定套了几层目录。
      #  · 逐个解压仓库根目录所有 zip，并把内容清单打进日志（便于确诊）
      #  · 在「所有解压结果」+「仓库明文目录」里找 settings.gradle.kts
      #  · 目录名无关（aggregate-gateway/ / dsh_free_model_app/ 都行）
      #  · 不含工程的「增量包」会被覆盖合并到工程目录（.github 除外）
      #
      # 常见踩坑：把只含 build.yml 的增量包当成工程包上传。
      # 此时这里会明确列出 zip 内容并给出可操作的错误，而不是一句「找不到文件」。
      - name: 解压并定位工程（自动识别套层 / 增量包）
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          OUT="$WS/_unpacked"
          rm -rf "$OUT"; mkdir -p "$OUT"

          mapfile -t ZIPS < <(find "$WS" -maxdepth 1 -type f -name '*.zip' -print | sort)
          echo "仓库根目录 zip 数量：${#ZIPS[@]}"

          idx=0
          EXTRA_DIRS=()
          for z in "${ZIPS[@]}"; do
            idx=$((idx + 1))
            d="$OUT/zip$idx"
            mkdir -p "$d"
            echo "::group::解压 $(basename "$z")"
            if ! unzip -q -o "$z" -d "$d"; then
              echo "::warning::$(basename "$z") 解压失败，跳过"
              echo "::endgroup::"
              continue
            fi
            find "$d" -type d -name '__MACOSX' -prune -exec rm -rf {} + 2>/dev/null || true
            echo "内容清单（最多 40 项）："
            (cd "$d" && find . -maxdepth 4 -type f | sed 's|^\./||' | sort | head -40)
            echo "文件总数：$(find "$d" -type f | wc -l | tr -d ' ')"
            echo "::endgroup::"
            EXTRA_DIRS+=("$d")
          done

          find_settings() {
            find "$1" -maxdepth 8 -type f -name 'settings.gradle.kts' \
              -not -path '*/.git/*' -not -path '*__MACOSX*' -print 2>/dev/null || true
          }

          PROJECT_DIR=""
          for base in "$OUT" "$WS"; do
            while IFS= read -r s; do
              [ -z "$s" ] && continue
              p="$(dirname "$s")"
              if [ -f "$p/app/build.gradle.kts" ]; then
                PROJECT_DIR="$p"
                break 2
              fi
            done < <(find_settings "$base")
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::没有找到完整 Android 工程（需同时存在 settings.gradle.kts 与 app/build.gradle.kts）。"
            echo "::error::仓库里的 zip 似乎只装了 workflow / 增量文件，不是工程本体。"
            echo "::error::请把【完整工程】压缩成 dsh_free_model_app.zip（里面允许再套一层文件夹，例如 aggregate-gateway/）后上传/替换。"
            echo "::error::.github/workflows/build.yml 必须明文提交到仓库根目录，不能只放在 zip 里。"
            echo "::error::本次各 zip 的内容清单已打印在上方，可据此确认哪个包传错了。"
            exit 1
          fi

          # 增量包叠加：不含工程的 zip 里若有改动文件，覆盖到工程目录。
          # 增量包本身也可能套了一层文件夹，合并前先把那层剥掉，
          # 否则会变成 PROJECT_DIR/aggregate-gateway/app/... 多一层。
          for d in "${EXTRA_DIRS[@]}"; do
            if [ -z "$(find_settings "$d")" ]; then
              echo "检测到增量包，把其中的改动文件合并到工程…"
              strip=""
              for sub in "$d"/*; do
                [ -d "$sub" ] || continue
                bn="$(basename "$sub")"
                if [ "$bn" = "$(basename "$PROJECT_DIR")" ] || [ -f "$sub/settings.gradle.kts" ]; then
                  strip="$bn"
                  break
                fi
              done
              [ -n "$strip" ] && echo "  剥离套层：$strip/"
              (cd "$d" && find . -type f -not -path './.github/*' -print0 \
                | while IFS= read -r -d '' f; do
                    rel="${f#./}"
                    if [ -n "$strip" ]; then rel="${rel#"$strip"/}"; fi
                    [ -z "$rel" ] && continue
                    dst="$PROJECT_DIR/$rel"
                    mkdir -p "$(dirname "$dst")"
                    cp -f "$f" "$dst"
                    echo "  合并: $rel"
                  done)
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_USED=${ZIPS[*]:-none}" >> "$GITHUB_ENV"
          echo "工程目录：$PROJECT_DIR"
          echo "顶层内容："
          ls -la "$PROJECT_DIR" | sed -n '1,25p'

      # ---------------------------------------------------------------- 3
      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ---------------------------------------------------------------- 4
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 安装 platform / build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools"

      # ---------------------------------------------------------------- 5
      - name: 安装 Node.js（用于生成 bundle.zip）
        if: env.SKIP_BUNDLE != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---------------------------------------------------------------- 6
      # 调用工程自带脚本：clone 完整上游仓库 → npm install → 打成
      # app/src/main/assets/node/bundle.zip。
      # 必须整仓（adapter/、vendor/channel-pack/ 的 WASM 与许可证缺一不可）。
      # 失败不阻断「编译出 APK」，但会在 Job Summary 里醒目告警。
      - name: 生成上游源码 bundle.zip
        if: env.SKIP_BUNDLE != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/prepare-node-bundle.sh"
          bash "$PROJECT_DIR/scripts/prepare-node-bundle.sh" "$PROJECT_DIR/.ofm-src"

      # ---------------------------------------------------------------- 7
      # 放置 libnode.so。优先用手动输入 / 仓库变量 NODE_MOBILE_URL，
      # 否则 best-effort 从 nodejs-mobile Releases 探测 arm64 资产。
      # 注意：Java 桥接 aar 不在这里注入 —— 若你已有 aar，请直接放进
      # 完整工程包的 app/libs/ 里一起上传，Gradle 会自动编译进去。
      - name: 放置 nodejs-mobile 的 libnode.so
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL="$LIBNODE_URL"
          if [ -z "$URL" ]; then
            echo "未指定 URL，尝试从 nodejs-mobile Releases 自动探测…"
            URL="$(gh api repos/nodejs-mobile/nodejs-mobile/releases \
              --jq '.[0].assets[]? | select(.name | test("android|arm64"; "i")) | .browser_download_url' \
              2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$URL" ]; then
            echo "::warning::没有可用的 nodejs-mobile 产物 URL。APK 仍可编译，但不会包含 libnode.so，装上后无法启动 Node。"
            echo "::warning::请在 Run workflow 里填 libnode_url，或设置仓库变量 NODE_MOBILE_URL。"
            exit 0
          fi
          echo "下载：$URL"
          chmod +x "$PROJECT_DIR/scripts/fetch-libnode.sh"
          bash "$PROJECT_DIR/scripts/fetch-libnode.sh" "$URL" "$LIBNODE_SHA256"

      # ---------------------------------------------------------------- 8
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 工程不带 gradle wrapper，用此输入在无 wrapper 项目上直接装 Gradle
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: 构建前自检
        shell: bash
        run: |
          set -euo pipefail
          echo "PROJECT_DIR = $PROJECT_DIR"
          BUNDLE="$PROJECT_DIR/app/src/main/assets/node/bundle.zip"
          SO="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libnode.so"
          AARCOUNT="$(find "$PROJECT_DIR/app/libs" -maxdepth 1 -type f \
            \( -name '*.aar' -o -name '*.jar' \) 2>/dev/null | wc -l | tr -d ' ')"
          echo "bundle.zip  : $([ -f "$BUNDLE" ] && du -h "$BUNDLE" | cut -f1 || echo '缺失')"
          echo "libnode.so  : $([ -f "$SO" ]     && du -h "$SO"     | cut -f1 || echo '缺失')"
          echo "桥接 aar/jar: $AARCOUNT 个"
          if [ ! -f "$BUNDLE" ]; then
            echo "::warning::bundle.zip 缺失：APK 能编译，但装上后 AssetInstaller 会报「缺少 bootstrap.js」。"
          fi
          if [ ! -f "$SO" ] || [ "$AARCOUNT" = "0" ]; then
            echo "::warning::Node 运行时不完整：缺少 libnode.so 或 Java 桥接 aar。APK 能编译，但运行时 NodeRuntime.start() 会失败。"
          fi

      # ---------------------------------------------------------------- 9
      - name: 生成 Gradle Wrapper 并编译 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "::error::ANDROID_HOME 未设置"; exit 1; }
          echo "sdk.dir=$SDK" > local.properties

          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin --no-daemon
          chmod +x gradlew

          case "$BUILD_TYPE" in
            debug)   ./gradlew --no-daemon --stacktrace assembleDebug ;;
            release) ./gradlew --no-daemon --stacktrace assembleRelease ;;
            both)    ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease ;;
            *)       echo "::error::未知 BUILD_TYPE=$BUILD_TYPE"; exit 1 ;;
          esac

      # ---------------------------------------------------------------- 10
      - name: 收集 APK
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          SHA="$(git -C "$WS" rev-parse --short=7 HEAD)"
          mkdir -p "$WS/artifacts"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print0 \
            | while IFS= read -r -d '' f; do
                variant="$(basename "$(dirname "$f")")"
                out="$WS/artifacts/AggregateGateway-${variant}-${SHA}.apk"
                cp "$f" "$out"
                echo "产出：$out ($(du -h "$out" | cut -f1))"
              done
          test -n "$(ls -A "$WS/artifacts" 2>/dev/null)" || {
            echo "::error::Gradle 未产出任何 APK"; exit 1;
          }

      # ---------------------------------------------------------------- 11
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AggregateGateway-APK-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------- 12
      - name: 构建结果汇总
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          PD="${PROJECT_DIR:-$WS/_unpacked}"
          BUNDLE="$PD/app/src/main/assets/node/bundle.zip"
          SO="$PD/app/src/main/jniLibs/arm64-v8a/libnode.so"
          AARCOUNT="$(find "$PD/app/libs" -maxdepth 1 -type f \
            \( -name '*.aar' -o -name '*.jar' \) 2>/dev/null | wc -l | tr -d ' ' || echo 0)"
          mark() { [ "$1" = "1" ] && echo "✅" || echo "⚠️ 缺失"; }
          b=0; s=0; a=0
          [ -f "$BUNDLE" ] && b=1
          [ -f "$SO" ]     && s=1
          [ "$AARCOUNT" != "0" ] && a=1

          {
            echo "## 聚合网关 APK 构建结果"
            echo ""
            echo "| 检查项 | 状态 |"
            echo "|---|---|"
            echo "| 压缩包 | ${ZIP_USED:-未找到} |"
            echo "| 工程目录 | ${PD} |"
            echo "| 构建类型 | ${BUILD_TYPE} |"
            echo "| 上游源码 bundle.zip | $(mark $b) |"
            echo "| libnode.so (arm64) | $(mark $s) |"
            echo "| Java 桥接 aar/jar | $(mark $a) |"
            echo ""
            echo "### 产物"
            if [ -d "$WS/artifacts" ] && [ -n "$(ls -A "$WS/artifacts" 2>/dev/null)" ]; then
              for f in "$WS"/artifacts/*.apk; do
                echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)"
              done
            else
              echo "- 无（构建失败）"
            fi
            echo ""
            if [ "$b" = 1 ] && [ "$s" = 1 ] && [ "$a" = 1 ]; then
              echo "> 运行时依赖齐备，可安装验证。仍需真机确认 \`NodeJS.start(...)\` 的签名与本工程反射调用匹配。"
            else
              echo "> ⚠️ **这是壳 APK**：能编译、能安装，但网关启动会失败。"
              echo "> 补齐方式：把 \`libnode.so\` 与 nodejs-mobile 的 Java 桥接 aar 放进完整工程的"
              echo "> \`app/libs/\` / \`app/src/main/jniLibs/arm64-v8a/\` 后重新压缩上传，"
              echo "> 或在 Run workflow 里指定 \`libnode_url\`。"
            fi
            echo ""
            echo "> release 产物为 **unsigned**（工程未配置签名）；默认 debug 已由 AGP 用 debug keystore 签名，可直接安装。"
          } >> "$GITHUB_STEP_SUMMARY"
