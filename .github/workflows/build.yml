name: Build DeviceMCP APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'DeviceMCP.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: 解压源码并编译 APK
    runs-on: ubuntu-latest

    # 源码含中文注释，显式声明 UTF-8 环境
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # ===============================================================
      # 1. 检出仓库
      # ===============================================================
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 确认压缩包存在
        run: |
          echo "仓库根目录内容："
          ls -la
          if [ ! -f "DeviceMCP.zip" ]; then
            echo "::error::未找到 DeviceMCP.zip，请确认已上传到仓库根目录"
            exit 1
          fi
          echo "压缩包大小：$(du -h DeviceMCP.zip | cut -f1)"

      # ===============================================================
      # 2. JDK 17
      #     注意：不要把 JAVA_TOOL_OPTIONS 设为全局，否则 sdkmanager /
      #     Gradle 的每步输出都会插入 "Picked up ..." 噪音行。
      #     编码改为在 Gradle 命令上单独指定。
      # ===============================================================
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===============================================================
      # 3. Android SDK（手动安装）
      #    不使用 android-actions/setup-android：该 action 默认安装已废弃的
      #    "tools" 包，新版 SDK 中已不存在，会导致 sdkmanager 退出码 1。
      #    runner 镜像已预装 cmdline-tools，直接复用即可。
      # ===============================================================
      - name: 定位 sdkmanager
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "--- cmdline-tools 目录 ---"
          ls -la "$SDK/cmdline-tools" || true

          # 选一个可用的 sdkmanager：优先 latest，其次任意版本目录
          SM=""
          for c in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$c" ] && SM="$c" && break
          done
          if [ -z "$SM" ]; then
            echo "::error::未找到可用的 sdkmanager"
            exit 1
          fi
          echo "SM=$SM" >> "$GITHUB_ENV"
          echo "使用 sdkmanager: $SM"
          "$SM" --version 2>/dev/null || true

      - name: 预置 SDK 许可（避免交互式询问）
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          cd "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > android-sdk-license
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55' >> android-sdk-license
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > android-sdk-preview-license
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a' > intel-android-extra-license
          printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6' > android-googletv-license
          printf '\n33b6a2b64607f11b759f320ef9dff4ae72c9e97e' > google-gdk-license
          ls -la
          echo "许可文件已预置"

      - name: 安装 SDK 组件（platform 34 / build-tools 34 / platform-tools）
        run: |
          set -o pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          # 仅安装真实存在的包；绝不安装已废弃的 "tools"
          "$SM" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1 | grep -v "^\[=* *\]" || true

          echo "--- 校验安装结果 ---"
          ls -d "$ANDROID_HOME/platforms/android-34" 2>/dev/null || echo "  [缺失] platforms/android-34"
          ls -d "$ANDROID_HOME/build-tools/34.0.0"   2>/dev/null || echo "  [缺失] build-tools/34.0.0"
          ls -d "$ANDROID_HOME/platform-tools"       2>/dev/null || echo "  [缺失] platform-tools"

          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "::error::SDK 组件安装失败，请查看上方输出"
            exit 1
          fi
          echo "SDK 组件就绪"

      # ===============================================================
      # 4. 解压 DeviceMCP.zip
      #    用 Python：兼容 Windows 压缩产生的反斜杠路径与中文文件名，
      #    并自动剥离最外层目录。
      # ===============================================================
      - name: 解压 DeviceMCP.zip
        env:
          GITHUB_ENV: ${{ env.GITHUB_ENV }}
        run: |
          python3 - << 'PYEOF'
          import zipfile, os, shutil, stat

          ZIP = 'DeviceMCP.zip'
          OUT = 'src'

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          count = 0
          with zipfile.ZipFile(ZIP) as z:
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  parts = name.split('/')
                  # 剥离最外层目录（DeviceMCP/ 或 DeviceMCP-master/ 等）
                  rel = '/'.join(parts[1:]) if len(parts) > 1 and parts[0] else name
                  if not rel or rel.endswith('/'):
                      continue
                  target = os.path.join(OUT, rel)
                  os.makedirs(os.path.dirname(target) or OUT, exist_ok=True)
                  with z.open(info) as s, open(target, 'wb') as d:
                      shutil.copyfileobj(s, d)
                  count += 1
                  mode = info.external_attr >> 16
                  if mode and stat.S_ISREG(mode):
                      os.chmod(target, mode & 0o7777)

          print(f"解压文件数: {count}")

          # 定位项目根：优先含 settings.gradle 的目录
          root = None
          for dp, dn, fn in os.walk(OUT):
              if 'settings.gradle' in fn:
                  root = dp
                  break
          if root is None:
              for dp, dn, fn in os.walk(OUT):
                  if 'build.gradle' in fn:
                      root = dp
                      break

          if root is None:
              print("::error::解压后未找到 settings.gradle / build.gradle，请检查压缩包结构")
              print("顶层目录:", os.listdir(OUT))
              raise SystemExit(1)

          abs_root = os.path.abspath(root)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PROJECT_ROOT={abs_root}\n")

          print(f"项目根目录: {abs_root}")
          print("内容:", sorted(os.listdir(abs_root))[:30])
          PYEOF

      - name: 校验项目结构
        run: |
          echo "PROJECT_ROOT=${PROJECT_ROOT}"
          cd "$PROJECT_ROOT"
          echo "--- 关键文件 ---"
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml gradle/wrapper/gradle-wrapper.properties; do
            if [ -f "$f" ]; then echo "  [OK] $f"; else echo "  [缺失] $f"; fi
          done
          echo "--- Java 源文件数 ---"
          find . -name "*.java" | wc -l

          # 写入 local.properties 指向 SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "已写入 local.properties: sdk.dir=$ANDROID_HOME"

      # ===============================================================
      # 5. Gradle
      #    源码包不含 gradle-wrapper.jar，先装发行版再就地生成 wrapper
      # ===============================================================
      - name: 安装 Gradle 8.5
        run: |
          cd /tmp
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q -o gradle.zip -d /opt
          rm -f gradle.zip
          chmod +x /opt/gradle-8.5/bin/gradle
          /opt/gradle-8.5/bin/gradle --version | head -8
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: 生成 Gradle Wrapper
        run: |
          cd "$PROJECT_ROOT"
          /opt/gradle-8.5/bin/gradle wrapper \
            --gradle-version 8.5 --distribution-type bin --no-daemon
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: 预下载依赖
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew androidDependencies --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

      # ===============================================================
      # 6. 编译
      # ===============================================================
      - name: 编译 Debug APK
        if: github.event.inputs.build_type != 'release'
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

      - name: 编译 Release APK（未签名）
        if: github.event.inputs.build_type == 'release'
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

      # ===============================================================
      # 7. 收集与上传
      # ===============================================================
      - name: 定位 APK
        run: |
          echo "--- 全部 APK ---"
          find "$PROJECT_ROOT" -name "*.apk" -type f || true
          mkdir -p apk_out
          find "$PROJECT_ROOT/app/build/outputs" -name "*.apk" -type f -exec cp {} apk_out/ \; || true
          cd apk_out
          ls -la
          if ! ls *.apk >/dev/null 2>&1; then
            echo "::error::未生成任何 APK，请查看编译步骤日志"
            exit 1
          fi

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMCP-APK
          path: apk_out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk_out/*.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===============================================================
      # 8. 失败诊断
      # ===============================================================
      - name: 构建失败诊断
        if: failure()
        run: |
          echo "=========== 环境变量 ==========="
          echo "PROJECT_ROOT=${PROJECT_ROOT:-（未设置，说明解压步骤未完成）}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "=========== 目录树 ==========="
          if [ -n "${PROJECT_ROOT}" ] && [ -d "${PROJECT_ROOT}" ]; then
            find "${PROJECT_ROOT}" -maxdepth 3 -type d | head -40 || true
          else
            echo "（PROJECT_ROOT 无效，跳过）"
            ls -la src 2>/dev/null || true
          fi
          echo "=========== SDK 目录 ==========="
          ls /usr/local/lib/android/sdk 2>/dev/null || true
          echo "=========== Gradle 日志 ==========="
          find . -name "*.log" -path "*gradle*" 2>/dev/null | head -5 || true
