name: Build APK from source.zip

# 触发方式：
# 1. 推送 / PR（源码以 source.zip 形式放在仓库里）
# 2. 右上角 Actions → Run workflow 手动触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ---------------------------------------------------------------
      # 解压 source.zip 并定位真正的工程根目录
      # 兼容：zip 里可能多套了一层文件夹，脚本会自动向下查找
      # settings.gradle.kts 所在目录
      # ---------------------------------------------------------------
      - name: Unpack source.zip
        id: unpack
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          ZIP="$(find . -maxdepth 3 -type f -name 'source.zip' | head -n 1 || true)"
          if [ -z "${ZIP}" ]; then
            echo "::error::仓库里找不到 source.zip"
            exit 1
          fi
          echo "找到压缩包: ${ZIP}"

          rm -rf _src
          mkdir -p _src
          unzip -q -o "${ZIP}" -d _src

          # 自动剥掉外层目录：找 settings.gradle.kts（KTS），退化为 settings.gradle（Groovy）
          HIT="$(find _src -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -n 1 || true)"
          if [ -z "${HIT}" ]; then
            echo "::error::解压后找不到 settings.gradle(.kts)，请确认压缩包内容"
            find _src -maxdepth 3 | head -n 40
            exit 1
          fi

          PROJ="$(dirname "${HIT}")"
          # 转成相对路径，供后续步骤使用
          PROJ="${PROJ#./}"
          echo "工程根目录: ${PROJ}"
          echo "proj=${PROJ}" >> "$GITHUB_OUTPUT"

          # 确认 app 模块存在
          if [ ! -d "${PROJ}/app" ]; then
            echo "::error::${PROJ}/app 不存在"
            exit 1
          fi

      # zip 打包时可能丢失可执行位，这里统一补回来
      - name: Fix gradlew permission
        run: |
          set -euo pipefail
          cd "${{ steps.unpack.outputs.proj }}"
          if [ ! -f gradlew ]; then
            echo "::error::缺少 Gradle Wrapper（gradlew），无法离线构建"
            exit 1
          fi
          chmod +x gradlew
          chmod +x gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

      - name: Build Debug APK
        run: |
          set -euo pipefail
          cd "${{ steps.unpack.outputs.proj }}"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: |
          set -euo pipefail
          cd "${{ steps.unpack.outputs.proj }}"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          cd "${{ steps.unpack.outputs.proj }}"
          mkdir -p "$GITHUB_WORKSPACE/apks"
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apks/" \;
          echo "=== 产物 ==="
          ls -lh "$GITHUB_WORKSPACE/apks"
          du -sh "$GITHUB_WORKSPACE/apks"/*

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 30
