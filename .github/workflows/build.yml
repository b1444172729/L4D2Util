# 聚合网关 · GitHub Actions 编译脚本
#
# 放置位置（硬性要求）：仓库根目录 .github/workflows/build.yml，明文提交。
#   ⚠️ GitHub 只识别「已提交的明文 YAML」，压缩包里的 workflow 永远不会被触发。
#
# 仓库结构：
#   repo/
#   ├── .github/workflows/build.yml   ← 本文件，明文提交
#   └── dsh_free_model_app.zip        ← 完整工程包（里面套一层 aggregate-gateway/）
#
# 重要：dsh_free_model_app.zip 必须是【完整工程】，不能只放改动文件。
#       本脚本不再做增量叠加或历史回溯 —— 那样依赖仓库历史，太脆弱。
#
# 产出：Artifacts 里的 AggregateGateway-*.apk（默认 debug，AGP 自动签名，可直接安装）

name: 构建聚合网关 APK

on:
  push:
    paths:
      - 'dsh_free_model_app.zip'
      - '**/dsh_free_model_app.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug 可直接安装；release 为未签名包）'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release, both]
      skip_bundle:
        description: '跳过生成 bundle.zip（快速验证壳能否编译）'
        required: false
        default: false
        type: boolean
      libnode_url:
        description: 'nodejs-mobile Android arm64 产物 zip 下载直链（可留空）'
        required: false
        default: ''
        type: string
      libnode_sha256:
        description: '上述 zip 的 SHA-256（可选）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.9'
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  SKIP_BUNDLE: ${{ inputs.skip_bundle }}
  LIBNODE_URL: ${{ inputs.libnode_url || vars.NODE_MOBILE_URL || '' }}
  LIBNODE_SHA256: ${{ inputs.libnode_sha256 || vars.NODE_MOBILE_SHA256 || '' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: 解压 → 准备运行时 → 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # -------------------------------------------------------------- 1
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          lfs: true

      # -------------------------------------------------------------- 2
      # 解压并定位工程：不假定套了几层、不假定目录名。
      # 判据：同时存在 settings.gradle.kts 与 app/build.gradle.kts。
      # 打印每个 zip 的完整文件清单，传错包时一眼可查。
      - name: 解压 dsh_free_model_app.zip 并定位工程
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          OUT="$WS/_unpacked"
          rm -rf "$OUT"; mkdir -p "$OUT"

          mapfile -t ZIPS < <(find "$WS" -maxdepth 1 -type f -name '*.zip' -print | sort)
          echo "仓库根目录 zip 数量：${#ZIPS[@]}"
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::仓库根目录没有任何 .zip 文件"
            exit 1
          fi

          idx=0
          for z in "${ZIPS[@]}"; do
            idx=$((idx + 1))
            d="$OUT/zip$idx"
            mkdir -p "$d"
            echo "::group::解压 $(basename "$z")"
            if ! unzip -q -o "$z" -d "$d"; then
              echo "::error::$(basename "$z") 解压失败"
              echo "::endgroup::"
              exit 1
            fi
            find "$d" -type d -name '__MACOSX' -prune -exec rm -rf {} + 2>/dev/null || true
            echo "内容清单（最多 80 项）："
            (cd "$d" && find . -type f | sed 's|^\./||' | sort | head -80)
            echo "文件总数：$(find "$d" -type f | wc -l | tr -d ' ')"
            echo "::endgroup::"
          done

          # ------------------------------------------------------------
          # ★ 关键：归一化解压文件的 mtime。
          #
          # ZIP 格式保存的是「本地时间且不带时区」。在东八区打包的源码，
          # 在 UTC 的 GitHub runner 上解压后，mtime 会被解释成「未来 8 小时」。
          # 于是 CMake 生成的 build.ninja（当前时间）永远比 CMakeLists.txt /
          # dsh-node.c 旧，Ninja 判定 manifest dirty → 反复 Re-running CMake
          # → 重生成内容相同、mtime 不变 → 循环 100 次后报：
          #   ninja: error: manifest 'build.ninja' still dirty after 100 tries
          # 把所有源码文件统一设成 2000-01-01 UTC，保证构建产物严格更新。
          # ------------------------------------------------------------
          echo "::group::归一化源码文件时间戳（防止未来时间戳）"
          echo "当前时间(UTC)      : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "归一化前最晚 mtime : $(find "$OUT" -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -n1)"
          find "$OUT" -type f -exec touch -d '2000-01-01 00:00:00 UTC' {} +
          echo "归一化后最晚 mtime : $(find "$OUT" -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -n1)"
          echo "已统一为 2000-01-01 UTC，CMake/Ninja 不会再误判 manifest dirty。"
          echo "::endgroup::"

          PROJECT_DIR=""
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            p="$(dirname "$s")"
            if [ -f "$p/app/build.gradle.kts" ]; then
              PROJECT_DIR="$p"
              break
            fi
          done < <(find "$OUT" "$WS" -maxdepth 12 -type f -name 'settings.gradle.kts' \
            -not -path '*/.git/*' -not -path '*__MACOSX*' -print 2>/dev/null || true)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::没找到完整 Android 工程（需同时有 settings.gradle.kts 与 app/build.gradle.kts）。"
            echo "::error::dsh_free_model_app.zip 必须是【完整工程包】，不能只放改动文件。"
            echo "::error::正确结构：zip 里套一层 aggregate-gateway/，内含 settings.gradle.kts、app/、res/ 等全部源码。"
            echo "::error::上面已打印各 zip 的完整清单，可据此核对缺了什么。"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_USED=${ZIPS[*]:-none}"    >> "$GITHUB_ENV"
          echo "工程目录：$PROJECT_DIR"
          echo "工程文件数：$(find "$PROJECT_DIR" -type f | wc -l | tr -d ' ')"
          echo "顶层内容："
          ls -la "$PROJECT_DIR" | sed -n '1,25p'

      # -------------------------------------------------------------- 3
      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # -------------------------------------------------------------- 4
      # 不用 android-actions/setup-android@v3：它默认要装早已下架的 `tools` 包，
      # 在 2026 新 runner（预装 cmdline-tools 20.0）上必然 "Failed to find package 'tools'"。
      # GitHub ubuntu 镜像自带完整 Android SDK，直接用预装的 sdkmanager 即可。
      - name: 配置 Android SDK 并安装 platform / build-tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for c in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              [ -d "$c" ] && { SDK_ROOT="$c"; break; }
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::找不到预装 Android SDK"
            exit 1
          fi
          echo "SDK_ROOT = $SDK_ROOT"

          SDKMGR=""
          for c in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            [ -x "$c" ] && { SDKMGR="$c"; break; }
          done
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f \
              -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::$SDK_ROOT 下没有可用的 sdkmanager"
            exit 1
          fi
          echo "sdkmanager = $SDKMGR"
          "$SDKMGR" --version || true

          # pipefail 下 yes 被 SIGPIPE 打断是正常现象，整条兜底
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          # 只装明确存在的三个包；绝不要装已下架的 `tools`
          ok=0
          for i in 1 2 3; do
            if "$SDKMGR" --sdk_root="$SDK_ROOT" --install \
              "platforms;android-${COMPILE_SDK}" \
              "build-tools;${BUILD_TOOLS}" \
              "platform-tools"; then
              ok=1
              break
            fi
            echo "::warning::SDK 组件安装第 $i 次失败，10 秒后重试…"
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::SDK 组件安装失败"
            exit 1
          fi

          # 自建 JNI 胶水需要 NDK + CMake。镜像通常已预装，缺失才安装，
          # 避免每次都下载上 GB 的 NDK 拖慢编译。
          NDK_VER="27.0.12077973"
          CMAKE_VER="3.22.1"
          NEED=""
          [ -d "$SDK_ROOT/ndk/$NDK_VER" ] || NEED="$NEED ndk;$NDK_VER"
          [ -x "$SDK_ROOT/cmake/$CMAKE_VER/bin/cmake" ] || NEED="$NEED cmake;$CMAKE_VER"
          if [ -n "$NEED" ]; then
            echo "需要补装原生工具链：$NEED"
            # shellcheck disable=SC2086
            "$SDKMGR" --sdk_root="$SDK_ROOT" --install $NEED || {
              echo "::error::NDK/CMake 安装失败，无法编译 app/src/main/cpp 下的胶水"
              exit 1
            }
          else
            echo "NDK $NDK_VER 与 CMake $CMAKE_VER 已预装，跳过"
          fi
          echo "  NDK  : $([ -d "$SDK_ROOT/ndk/$NDK_VER" ] && echo 已就位 || echo 缺失)"
          echo "  CMake: $([ -x "$SDK_ROOT/cmake/$CMAKE_VER/bin/cmake" ] && echo 已就位 || echo 缺失)"

          echo "ANDROID_HOME=$SDK_ROOT"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "已写入 ANDROID_HOME / ANDROID_SDK_ROOT = $SDK_ROOT"

      # -------------------------------------------------------------- 5
      - name: 安装 Node.js（用于生成 bundle.zip）
        if: env.SKIP_BUNDLE != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # -------------------------------------------------------------- 6
      # 生成上游源码 bundle.zip。失败不阻断「编译出 APK」，但会在汇总里标 ⚠️。
      - name: 生成上游源码 bundle.zip
        if: env.SKIP_BUNDLE != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/prepare-node-bundle.sh"
          bash "$PROJECT_DIR/scripts/prepare-node-bundle.sh" "$PROJECT_DIR/.ofm-src"

      # -------------------------------------------------------------- 7
      # Java 桥接层已由本工程自编（app/src/main/cpp + NodeBridge.java），
      # 这里只需要官方的 libnode.so；不再需要任何 aar。
      - name: 放置 nodejs-mobile 的 libnode.so
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL="$LIBNODE_URL"
          if [ -z "$URL" ]; then
            echo "未指定 URL，尝试从 nodejs-mobile Releases 自动探测…"
            URL="$(gh api repos/nodejs-mobile/nodejs-mobile/releases \
              --jq '.[0].assets[]? | select(.name | test("android|arm64"; "i")) | .browser_download_url' \
              2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$URL" ]; then
            echo "::warning::没有可用的 nodejs-mobile 产物 URL。APK 仍可编译，但装上后无法启动 Node。"
            echo "::warning::请在 Run workflow 里填 libnode_url，或设置仓库变量 NODE_MOBILE_URL，"
            echo "::warning::也可把 arm64 的 libnode.so 放进完整工程的 app/src/main/jniLibs/arm64-v8a/ 一起上传。"
            exit 0
          fi
          echo "下载：$URL"
          chmod +x "$PROJECT_DIR/scripts/fetch-libnode.sh"
          bash "$PROJECT_DIR/scripts/fetch-libnode.sh" "$URL" "$LIBNODE_SHA256"

      # -------------------------------------------------------------- 7b
      # ★ 关键：libnode.so 是 C++ 库，DT_NEEDED 里有 libc++_shared.so。
      # 本工程胶水是纯 C，AGP 不会自动打包这份 STL。缺失时真机 dlopen 报：
      #   library "libc++_shared.so" not found ... in namespace classloader-namespace
      # 独立成步（不依赖上一步是否下载成功），从已安装的 NDK 复制同架构 STL。
      - name: 补齐 libc++_shared.so（libnode.so 的 C++ 运行时依赖）
        shell: bash
        run: |
          set -euo pipefail
          JNI="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          if [ -f "$JNI/libc++_shared.so" ]; then
            echo "已随工程包提供，跳过：$(du -h "$JNI/libc++_shared.so" | cut -f1)"
            exit 0
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_VER="27.0.12077973"
          NDK="$SDK_ROOT/ndk/$NDK_VER"
          SRC=""
          for c in \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            "$NDK/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so"; do
            [ -f "$c" ] && { SRC="$c"; break; }
          done
          if [ -z "$SRC" ]; then
            SRC="$(find "$NDK" -type f -name 'libc++_shared.so' \
              \( -path '*aarch64-linux-android*' -o -path '*arm64-v8a*' \) 2>/dev/null \
              | grep -vE '/[0-9]{2}/libc\+\+_shared\.so$' | head -n1 || true)"
          fi
          if [ -z "$SRC" ] && [ -d "$SDK_ROOT/ndk" ]; then
            # 最后一档不过滤 API 子目录：能找到一份就能用
            SRC="$(find "$SDK_ROOT/ndk" -type f -name 'libc++_shared.so' \
              \( -path '*aarch64-linux-android*' -o -path '*arm64-v8a*' \) 2>/dev/null \
              | head -n1 || true)"
          fi
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::NDK 中找不到 arm64 的 libc++_shared.so（NDK=$NDK）。"
            echo "::error::请把该文件放进完整工程的 app/src/main/jniLibs/arm64-v8a/ 后重新上传。"
            exit 1
          fi
          cp "$SRC" "$JNI/libc++_shared.so"
          echo "来源：$SRC"
          echo "  → $JNI/libc++_shared.so ($(du -h "$JNI/libc++_shared.so" | cut -f1))"
          echo "✅ 已随 APK 打包，dlopen(libnode.so) 不会再缺 STL"

      # -------------------------------------------------------------- 8
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 工程不带 gradle wrapper；此输入会在 runner 上 provision 指定版本并加入 PATH
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: 构建前自检
        shell: bash
        run: |
          set -euo pipefail
          echo "PROJECT_DIR = $PROJECT_DIR"
          BUNDLE="$PROJECT_DIR/app/src/main/assets/node/bundle.zip"
          SO="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libnode.so"
          STL="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"
          GLUE="$PROJECT_DIR/app/src/main/cpp/dsh-node.c"
          CMAKE="$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt"
          echo "bundle.zip         : $([ -f "$BUNDLE" ] && du -h "$BUNDLE" | cut -f1 || echo '缺失')"
          echo "libnode.so         : $([ -f "$SO" ]     && du -h "$SO"     | cut -f1 || echo '缺失')"
          echo "libc++_shared.so   : $([ -f "$STL" ]    && du -h "$STL"    | cut -f1 || echo '缺失')"
          echo "JNI 胶水源码       : $([ -f "$GLUE" ] && echo 已就位 || echo '缺失')"
          echo "CMakeLists         : $([ -f "$CMAKE" ] && echo 已就位 || echo '缺失')"
          [ -f "$PROJECT_DIR/settings.gradle.kts" ] || { echo "::error::缺 settings.gradle.kts"; exit 1; }
          [ -f "$PROJECT_DIR/app/build.gradle.kts" ] || { echo "::error::缺 app/build.gradle.kts"; exit 1; }
          [ -f "$GLUE" ]  || { echo "::error::缺 app/src/main/cpp/dsh-node.c，请上传最新完整工程包"; exit 1; }
          [ -f "$CMAKE" ] || { echo "::error::缺 app/src/main/cpp/CMakeLists.txt"; exit 1; }
          if [ ! -f "$BUNDLE" ]; then
            echo "::warning::bundle.zip 缺失：APK 能编译，但装上后 AssetInstaller 会报「缺少 bootstrap.js」。"
          fi
          if [ ! -f "$SO" ]; then
            echo "::warning::缺 libnode.so：APK 能编译，但装上后 Node 引擎起不来。请在 Run workflow 填 libnode_url。"
          fi
          if [ ! -f "$STL" ]; then
            echo "::warning::缺 libc++_shared.so：dlopen(libnode.so) 会报 library not found。"
            echo "::warning::请把 NDK 里的 arm64 libc++_shared.so 放进 app/src/main/jniLibs/arm64-v8a/。"
          fi
          # CMake 形态：有 libnode.so 时走官方 DT_NEEDED 链接，否则回退 dlopen。
          # 这一行决定 node::Start 由 linker 绑定还是运行期 dlsym，必须打印出来便于核对。
          if [ -f "$SO" ]; then
            echo "CMake 形态：✅ 官方 DT_NEEDED（libdsh-node.so 链接 libnode.so，linker 绑定符号）"
          else
            echo "CMake 形态：⚠️ 回退 dlopen+dlsym（未找到 libnode.so，V8 初始化可能静默失败）"
            echo "::warning::请在 Run workflow 填 libnode_url，或把 arm64 的 libnode.so 放进 app/src/main/jniLibs/arm64-v8a/。"
          fi

      # -------------------------------------------------------------- 9
      - name: 编译 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "::error::ANDROID_HOME 未设置"; exit 1; }
          echo "sdk.dir=$SDK" > local.properties

          # 二次加固：解压步骤已归一化过一次，这里再把「参与 CMake 配置的
          # 源码与脚本」压到过去时间，排除 build/.cxx/.ofm-src 等生成目录。
          # 即便用户换了打包工具、或中间步骤又带进未来时间戳，也兜得住。
          find . -type f \
            -not -path './build/*' -not -path './.cxx/*' -not -path './.gradle/*' \
            -not -path './.ofm-src/*' -not -path './app/build/*' \
            -not -path './app/.cxx/*' \
            -exec touch -d '2000-01-01 00:00:00 UTC' {} +
          echo "编译前时间戳已复核：源码均为 2000-01-01 UTC，产物将严格更新"

          GRADLE_BIN="$(command -v gradle || true)"
          if [ -z "$GRADLE_BIN" ]; then
            GRADLE_BIN="$(find "$HOME/.gradle" /opt/hostedtoolcache /usr/local -maxdepth 6 \
              -type f -path '*/bin/gradle' -perm -u+x 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
            echo "::error::找不到可执行的 gradle（setup-gradle 的 gradle-version 未生效）"
            exit 1
          fi
          echo "GRADLE_BIN = $GRADLE_BIN"
          "$GRADLE_BIN" --version

          case "$BUILD_TYPE" in
            debug)   "$GRADLE_BIN" --no-daemon --stacktrace assembleDebug ;;
            release) "$GRADLE_BIN" --no-daemon --stacktrace assembleRelease ;;
            both)    "$GRADLE_BIN" --no-daemon --stacktrace assembleDebug assembleRelease ;;
            *)       echo "::error::未知 BUILD_TYPE=$BUILD_TYPE"; exit 1 ;;
          esac

      # -------------------------------------------------------------- 10
      - name: 收集 APK
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          SHA="$(git -C "$WS" rev-parse --short=7 HEAD)"
          mkdir -p "$WS/artifacts"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print0 \
            | while IFS= read -r -d '' f; do
                variant="$(basename "$(dirname "$f")")"
                out="$WS/artifacts/AggregateGateway-${variant}-${SHA}.apk"
                cp "$f" "$out"
                echo "产出：$out ($(du -h "$out" | cut -f1))"
              done
          test -n "$(ls -A "$WS/artifacts" 2>/dev/null)" || {
            echo "::error::Gradle 未产出任何 APK"; exit 1;
          }

      # -------------------------------------------------------------- 11
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AggregateGateway-APK-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------------- 12
      - name: 构建结果汇总
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          PD="${PROJECT_DIR:-$WS/_unpacked}"
          BUNDLE="$PD/app/src/main/assets/node/bundle.zip"
          SO="$PD/app/src/main/jniLibs/arm64-v8a/libnode.so"
          STL="$PD/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"
          GLUE="$PD/app/src/main/cpp/dsh-node.c"
          mark() { [ "$1" = "1" ] && echo "✅" || echo "⚠️ 缺失"; }
          b=0; s=0; t=0; g=0
          [ -f "$BUNDLE" ] && b=1
          [ -f "$SO" ]     && s=1
          [ -f "$STL" ]    && t=1
          [ -f "$GLUE" ]   && g=1
          {
            echo "## 聚合网关 APK 构建结果"
            echo ""
            echo "| 检查项 | 状态 |"
            echo "|---|---|"
            echo "| 压缩包 | ${ZIP_USED:-未找到} |"
            echo "| 工程目录 | ${PD} |"
            echo "| 构建类型 | ${BUILD_TYPE} |"
            echo "| 上游源码 bundle.zip | $(mark $b) |"
            echo "| libnode.so (arm64) | $(mark $s) |"
            echo "| libc++_shared.so (arm64) | $(mark $t) |"
            echo "| 自建 JNI 胶水（CMake 编译） | $(mark $g) |"
            echo ""
            echo "### 产物"
            if [ -d "$WS/artifacts" ] && [ -n "$(ls -A "$WS/artifacts" 2>/dev/null)" ]; then
              for f in "$WS"/artifacts/*.apk; do
                echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)"
              done
            else
              echo "- 无（构建失败）"
            fi
            echo ""
            if [ "$b" = 1 ] && [ "$s" = 1 ] && [ "$t" = 1 ] && [ "$g" = 1 ]; then
              echo "> 运行时依赖齐备，可安装验证。界面「运行时自检」会显示能否解析 \`node::Start\` 符号。"
            else
              echo "> ⚠️ **这是壳 APK**：能编译、能安装，但网关启动会失败。"
              echo "> 补齐方式：在 Run workflow 里指定 \`libnode_url\` 拿到 arm64 的 \`libnode.so\`；"
              echo "> \`libc++_shared.so\` 由 workflow 从 NDK 自动补齐（也可手动放进 jniLibs）；"
              echo "> 并确保完整包内含 \`app/src/main/cpp/\`（自建胶水，无需任何 aar）。"
            fi
            echo ""
            echo "> release 产物为 **unsigned**；默认 debug 已由 AGP 用 debug keystore 签名，可直接安装。"
          } >> "$GITHUB_STEP_SUMMARY"
