# =============================================================================
# 从「仓库里一个 zip 压缩包」解压源码 → 编译 APK → 生成 rootfs 的一体化 workflow
#
# ⚠⚠ 这个文件必须作为【明文文件】单独放到仓库根的 .github/workflows/build.yml
#    「一起塞进 opencode_rootfs.zip」是无效的：GitHub 只认提交里的明文 yml，
#    zip 是二进制，里面的 .github 不会被当成 workflow，Actions 页会空白。
#
# 你的仓库最终只需要 2 个东西：
#    opencode_rootfs.zip                 ← 你压缩/重命名后的源码包（里面可以套任意层文件夹）
#    .github/workflows/build.yml          ← 本文件（明文）
#
# v2 修复（2026-11-11 run #246）：
#   APK 其实编译成功、Release 也发了，失败的是 rootfs job ——
#   旧脚本只用「第一个拿到 Packages 索引」的清华镜像去拼 deb URL，
#   而该镜像 pool/ 里的 proot deb 取不到（HTTP 非 2xx），且 curl 错误被
#   2>/dev/null 吞掉，于是只打印「❌ 下载 proot 失败」就退出。
#   本版在 rootfs job 里【内联写入修复版 build-rootfs.sh 覆盖 zip 里的旧版】：
#     · 官方 packages.termux.dev 排第一，国内镜像作回退
#     · 每个镜像独立：下索引(支持 gz/xz) → 解析 → 下全部 deb → 全成功才采用
#     · 打印 HTTP 码与 curl 错误；deb 多路径拼接；libandroid-shmem 不再致命
#   → 你【只需替换这个明文 yml】，不用重新压缩/上传 zip。
#
# 本 workflow 会自动：
#    1. 找到 zip（精确名优先，找不到就取仓库里第一个 .zip）
#    2. 解压，剔除 __MACOSX / ._*，【递归定位含 settings.gradle 的目录】，
#       所以「里面还套了一层文件夹」甚至两层都能正确拍平
#    3. 校验关键文件；release.keystore 漏了就自动生成
#    4. 用 Gradle 8.8 + JDK 17 + Android SDK 34 编译 arm64-v8a release APK
#    5. 在免费的 arm64 runner 上跑 rootfs/build-rootfs.sh 生成 rootfs-arm64.tar.gz
#    6. 把 APK 与 rootfs 一起发到 Release（tag = build-<run_number>），
#       同时在 Actions artifacts 里各留一份
# =============================================================================
name: build-from-zip

on:
  workflow_dispatch:
    inputs:
      oc_ver:
        description: 'OpenCode v2 版本（留空 = 自动取 npm latest；免费模型必须 v2，别填 1.x）'
        required: false
        default: ''
      skip_apt:
        description: '跳过 chroot 安装 git（推荐 true；网关不调 /api/vcs/init）'
        type: boolean
        required: false
        default: true
      build_rootfs:
        description: '同时也生成 rootfs-arm64.tar.gz（约 100~150 MB，需要几分钟）'
        type: boolean
        required: false
        default: true
  push:
    paths:
      - 'opencode_rootfs.zip'
      - '.github/workflows/build.yml'
      - '**/*.zip'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) 解压并拍平：只做一次，产物作为 artifact 交给后面两个 job
  # ---------------------------------------------------------------------------
  unpack:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.locate.outputs.found }}
      src_dir: ${{ steps.locate.outputs.src_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: 定位 / 解压 / 拍平嵌套目录
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          # ① 精确名优先；找不到就取仓库里第一个 .zip（兼容你随手起的名字）
          ZIP=""
          for n in opencode_rootfs.zip OPENCODE_ROOTFS.zip opencode_rootfs.ZIP; do
            if [ -f "$n" ]; then ZIP="$n"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' ! -iname 'source.tgz' | sort | sed -n '1p' || true)
          fi
          if [ -z "$ZIP" ] || [ ! -s "$ZIP" ]; then
            echo "::warning::仓库里没有 opencode_rootfs.zip，也没有其它 .zip。本次跳过（不算失败）。"
            echo "::warning::请用 Add file → Upload files 把压缩包传到仓库根目录。"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "📦 找到压缩包：$ZIP ($(du -h "$ZIP" | cut -f1))"

          # ② 解压到独立临时目录，避免污染工作区 / 覆盖根 workflow
          rm -rf /tmp/unz && mkdir -p /tmp/unz
          unzip -q -o "$ZIP" -d /tmp/unz || { echo "::error::unzip 失败，文件可能不是有效 zip"; exit 1; }

          # ③ 清掉 macOS 压缩带进来的垃圾
          find /tmp/unz -type d -name '__MACOSX' -prune -exec rm -rf {} + 2>/dev/null || true
          find /tmp/unz -type f -name '._*' -delete 2>/dev/null || true

          # ④ 【核心】递归找含 settings.gradle 的目录 —— 不管 zip 里套 1 层还是 2 层文件夹
          SRC=""
          while IFS= read -r d; do
            if [ -f "$d/app/build.gradle" ] || [ -f "$d/app/build.gradle.kts" ]; then
              SRC="$d"; break
            fi
          done < <(find /tmp/unz -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | sort -u)

          if [ -z "$SRC" ]; then
            echo "::error::解压后找不到带 app/build.gradle 的 settings.gradle 目录。实际结构："
            find /tmp/unz -maxdepth 4 | sed -n "1,80p"
            echo "::error::请确认压缩包里确实包含 app/、settings.gradle、rootfs/ 这几个条目。"
            exit 1
          fi
          echo "📂 源码根目录：$SRC"
          echo "   （相对解压根：${SRC#/tmp/unz/}）"

          # ⑤ 关键文件校验（keystore 单独兜底，见 apk job）
          for f in settings.gradle gradle.properties app/build.gradle \
                   app/src/main/AndroidManifest.xml \
                   app/src/main/java/com/ocgw/app/GatewayService.kt \
                   rootfs/build-rootfs.sh; do
            if [ ! -f "$SRC/$f" ]; then
              echo "::error::缺少 $f —— 压缩包不完整，请重新压缩时把隐藏目录 .github/ 和所有文件都带上"
              exit 1
            fi
          done
          echo "✅ 关键文件齐全"

          # ⑥ 拍平到统一路径，打包成 artifact
          rm -rf "$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/src"
          cp -a "$SRC/." "$GITHUB_WORKSPACE/src/"
          tar -czf "$GITHUB_WORKSPACE/source.tgz" -C "$GITHUB_WORKSPACE/src" .
          echo "📤 源码快照：$(du -h "$GITHUB_WORKSPACE/source.tgz" | cut -f1)"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "src_dir=src" >> "$GITHUB_OUTPUT"

      - name: 上传源码快照
        if: steps.locate.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: source.tgz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) 编译 APK
  # ---------------------------------------------------------------------------
  apk:
    needs: unpack
    if: ${{ needs.unpack.outputs.found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 下载源码快照
        uses: actions/download-artifact@v4
        with:
          name: source
          path: .

      - name: 解开源码
        run: |
          mkdir -p src
          tar -xzmf source.tgz -C src
          ls -la src | sed -n "1,20p"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # settings.gradle 里钉的是 AGP 8.5.2 / Kotlin 2.0.20；
      # AGP 8.5 要求 Gradle >= 8.7，Kotlin 2.0.20 上限约 8.8，故锁 8.8。
      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: 配置 Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "已装 platforms:"; ls "$SDK/platforms" 2>/dev/null || true

      - name: 兜底生成签名 keystore（压缩包漏带时）
        shell: bash
        run: |
          set -euo pipefail
          if [ -f src/release.keystore ]; then
            echo "✅ 使用压缩包内的 release.keystore"
          elif [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > src/release.keystore
            echo "✅ 使用 secrets.KEYSTORE_B64"
          else
            echo "⚠ 压缩包里没有 release.keystore，现场生成一枚（仅自用）"
            keytool -genkeypair -v -keystore src/release.keystore -keyalg RSA -keysize 2048 \
              -validity 10000 -alias ocgw -dname "CN=OCGW" \
              -storepass android -keypass android
          fi

      - name: 编译 arm64-v8a release APK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          command -v gradle >/dev/null || { echo "::error::runner 上找不到 gradle"; exit 1; }
          gradle --version | sed -n '1,12p'
          gradle assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/src/release.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=ocgw \
            -Pandroid.injected.signing.key.password=android

      - name: 收集 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find src/app/build/outputs -type f -name '*.apk' -exec cp -v {} out/ \;
          test -n "$(ls -A out)" || { echo "::error::没产出任何 APK"; exit 1; }
          ls -lh out

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: out/*.apk
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) 生成 rootfs-arm64.tar.gz（原文件已下架，必须自己重建）
  # ---------------------------------------------------------------------------
  rootfs:
    needs: unpack
    if: ${{ needs.unpack.outputs.found == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_rootfs) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: 下载源码快照
        uses: actions/download-artifact@v4
        with:
          name: source
          path: .

      - name: 解开源码
        run: |
          mkdir -p src
          tar -xzmf source.tgz -C src

      - name: 写入修复版 rootfs 构建脚本（覆盖 zip 里的旧版）
        shell: bash
        run: |
          cat > src/rootfs/build-rootfs.sh <<'ROOTFS_SCRIPT'
          #!/usr/bin/env bash
          # =============================================================================
          # 生成可在 Android(arm64) 上运行的 rootfs-arm64.tar.gz  ——  r2 修复版
          #
          # 修复 2026-11-11 run #246 的失败：
          #   旧版只用「第一个能下到 Packages 索引」的镜像（清华 TUNA）去拼 deb URL，
          #   且 curl 错误被 2>/dev/null 吞掉。一旦该镜像的 pool/ 路径不可用就整体失败：
          #     [build-rootfs]   尝试 https://mirrors.tuna.tsinghua.edu.cn/.../proot_5.1.107.102_aarch64.deb
          #     ❌ 下载 proot 失败
          #
          # 本版改动：
          #   · Termux 官方源排第一（GitHub Actions 境外 runner 直连最稳），国内镜像作回退
          #   · 【每个镜像独立走完整流程】下索引 → 解析 4 个包 → 下全部 deb → 全成功才采用，
          #     任一失败立刻换下一个镜像，不再被单一镜像锁死
          #   · 索引支持 Packages / Packages.gz / Packages.xz 三种格式
          #   · deb URL 多路径拼接（仓库根 / dists 下 / 多一层 apt/termux-main）
          #   · fetch_first 打印 HTTP 码与 curl 错误，不再盲失败
          #   · libandroid-shmem 改为「建议但不致命」（部分 Termux 源已并入 proot 包）
          #   · 支持手动兜底：若 /tmp/{proot,libtalloc,libandroid-shmem}.deb 已存在就直接用
          #   · 其余（Ubuntu base / OpenCode v2 CLI / --skip-apt / 四件套自检 / SHA256）不变
          #
          # 用法：
          #   bash build-rootfs.sh --skip-apt            # 无需 root / chroot
          #   OC_VER=2.2.7 bash build-rootfs.sh --skip-apt
          #   sudo -E bash build-rootfs.sh              # 完整版（含 git，需 root + arm64）
          # =============================================================================
          set -euo pipefail
          
          ARCH="arm64"
          OUT="rootfs-${ARCH}.tar.gz"
          ROOT="rootfs-${ARCH}"
          OC_VER="${OC_VER:-}"
          SKIP_APT="${SKIP_APT:-0}"
          for a in "$@"; do [ "$a" = "--skip-apt" ] && SKIP_APT=1; done
          
          UBUNTU_MIRRORS=(
            "https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.3-base-arm64.tar.gz"
            "https://mirrors.tuna.tsinghua.edu.cn/ubuntu-cdimage/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.3-base-arm64.tar.gz"
            "https://mirrors.aliyun.com/ubuntu-cdimage/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.3-base-arm64.tar.gz"
            "https://mirrors.ustc.edu.cn/ubuntu-cdimage/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.3-base-arm64.tar.gz"
          )
          # ⚠ 官方源优先：run #246 里清华镜像的 Packages 能下、pool 里的 deb 却取不到。
          TERMUX_MIRRORS=(
            "https://packages.termux.dev/apt/termux-main"
            "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main"
            "https://mirrors.ustc.edu.cn/termux/apt/termux-main"
            "https://mirrors.aliyun.com/termux/apt/termux-main"
          )
          NPM_REGISTRIES=(
            "https://registry.npmjs.org"
            "https://registry.npmmirror.com"
          )
          GH_MIRRORS=(
            ""
            "https://gh-proxy.com/"
            "https://ghfast.top/"
            "https://ghproxy.net/"
          )
          
          log() { echo "[build-rootfs] $*"; }
          die() { echo "❌ $*" >&2; exit 1; }
          
          # 逐个尝试；打印 HTTP 码与 curl 错误，不再 2>/dev/null 全吞
          fetch_first() {
            local dest="$1"; shift
            local u code
            for u in "$@"; do
              [ -z "$u" ] && continue
              log "  尝试 $u"
              : > /tmp/fetch.err
              code=$(curl -sSL --connect-timeout 12 --max-time 900 -A 'Mozilla/5.0' \
                     -w '%{http_code}' "$u" -o "$dest" 2>/tmp/fetch.err || true)
              if { [ "$code" = "200" ] || [ "$code" = "206" ]; } && [ -s "$dest" ]; then
                log "  ✓ HTTP $code，拿到 $(du -h "$dest" | cut -f1)"
                return 0
              fi
              local err; err=$(tr '\n' ' ' < /tmp/fetch.err | cut -c1-140)
              log "  ✗ HTTP ${code:-无响应} $err"
              rm -f "$dest"
            done
            return 1
          }
          
          # ---------------------------------------------------------------- 0) 环境
          log "架构：$(uname -m)（产物固定 arm64；若宿主非 aarch64，只有 --skip-apt 能跑）"
          if [ "$SKIP_APT" = "0" ] && [ "$(id -u)" != "0" ]; then
            die "完整版需要 root（chroot + mount + apt）。改用 sudo -E bash $0，或加 --skip-apt。"
          fi
          
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          
          # ---------------------------------------------------------------- 1) Ubuntu base
          log "1/7 下载 Ubuntu Base 24.04 arm64（glibc rootfs，约 28 MB）"
          fetch_first /tmp/ubuntu-base.tar.gz "${UBUNTU_MIRRORS[@]}" \
            || die "Ubuntu base 所有镜像都不可达。可手动下载后放到 /tmp/ubuntu-base.tar.gz 再重跑。"
          tar -xzf /tmp/ubuntu-base.tar.gz -C "$ROOT" || die "Ubuntu base 解包失败"
          rm -f /tmp/ubuntu-base.tar.gz
          
          # ---------------------------------------------------------------- 2) 基础目录
          log "2/7 基础目录 / DNS / CA 证书"
          mkdir -p "$ROOT/dev" "$ROOT/proc" "$ROOT/sys" "$ROOT/dev/pts" "$ROOT/tmp" "$ROOT/workspace"
          chmod 1777 "$ROOT/tmp"
          printf 'nameserver 223.5.5.5\nnameserver 8.8.8.8\n' > "$ROOT/etc/resolv.conf"
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            mkdir -p "$ROOT/etc/ssl/certs"
            cp -f /etc/ssl/certs/ca-certificates.crt "$ROOT/etc/ssl/certs/ca-certificates.crt"
          fi
          
          # ---------------------------------------------------------------- 3) git（可选）
          if [ "$SKIP_APT" = "0" ]; then
            log "3/7 chroot 安装 git（/api/vcs/init 需要真实 git）"
            cat > "$ROOT/etc/apt/sources.list" <<'SRC'
          deb http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          SRC
            mount -t proc /proc "$ROOT/proc" 2>/dev/null || true
            mount --bind /dev "$ROOT/dev" 2>/dev/null || true
            if chroot "$ROOT" /bin/bash -c "export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates" >/tmp/git-install.log 2>&1; then
              log "  ✓ git 已安装"
            else
              log "  ⚠ apt 安装 git 失败（不影响 bridge）："; sed -n '1,12p' /tmp/git-install.log || true
            fi
            umount "$ROOT/proc" 2>/dev/null || true
            umount "$ROOT/dev" 2>/dev/null || true
            rm -rf "$ROOT/var/lib/apt/lists"/* "$ROOT/var/cache/apt/archives"/*.deb 2>/dev/null || true
          else
            log "3/7 跳过 git（--skip-apt）"
          fi
          
          # ---------------------------------------------------------------- 4) OpenCode CLI (v2)
          log "4/7 获取 OpenCode v2 CLI（arm64）"
          if [ -z "$OC_VER" ]; then
            for reg in "${NPM_REGISTRIES[@]}"; do
              OC_VER=$(curl -fsSL --connect-timeout 10 --max-time 20 "$reg/@opencode%2fcli-linux-arm64/latest" 2>/dev/null \
                       | python3 -c 'import sys,json;print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
              [ -n "$OC_VER" ] && break
            done
            OC_VER="${OC_VER:-2.2.7}"
          fi
          log "  目标版本：$OC_VER"
          
          mkdir -p "$ROOT/opencode/bin" /tmp/ocpkg
          OC_OK=0
          for reg in "${NPM_REGISTRIES[@]}"; do
            if fetch_first /tmp/oc.tgz "$reg/@opencode/cli-linux-arm64/-/cli-linux-arm64-${OC_VER}.tgz"; then OC_OK=1; break; fi
          done
          if [ "$OC_OK" = "0" ]; then
            for pre in "${GH_MIRRORS[@]}"; do
              if fetch_first /tmp/oc.tgz "${pre}https://github.com/anomalyco/opencode/releases/download/v${OC_VER}/opencode-linux-arm64.tar.gz"; then OC_OK=1; break; fi
            done
          fi
          [ "$OC_OK" = "1" ] || die "拿不到 OpenCode CLI：npm 与 GitHub release 都不可达。可手动放到 /tmp/oc.tgz 再重跑。"
          
          rm -rf /tmp/ocpkg && mkdir -p /tmp/ocpkg
          tar -xzf /tmp/oc.tgz -C /tmp/ocpkg || die "CLI 包解包失败"
          OC_BIN=$(find /tmp/ocpkg -type f -name 'opencode' | sed -n '1p')
          [ -n "$OC_BIN" ] || die "CLI 包里找不到 opencode 可执行文件"
          cp -f "$OC_BIN" "$ROOT/opencode/bin/opencode"
          chmod 755 "$ROOT/opencode/bin/opencode"
          log "  ✓ CLI $(du -h "$ROOT/opencode/bin/opencode" | cut -f1)"
          rm -rf /tmp/oc.tgz /tmp/ocpkg
          
          # ---------------------------------------------------------------- 5) Termux proot【本次修复重点】
          log "5/7 获取 Termux 版 proot + loader + libtalloc + libandroid-shmem"
          mkdir -p "$ROOT/proot/bin" "$ROOT/proot/lib" "$ROOT/proot/libexec"
          
          extract_deb() { # debfile destdir
            python3 - "$1" "$2" <<'PY'
          import sys, os, subprocess, tempfile
          deb, dest = sys.argv[1], sys.argv[2]
          d = open(deb, 'rb').read()
          i = 8
          while i < len(d):
              hdr = d[i:i+60]
              if len(hdr) < 60: break
              name = hdr[0:16].decode(errors='replace').strip().rstrip('/')
              try: size = int(hdr[48:58].decode().strip())
              except ValueError: break
              data = d[i+60:i+60+size]
              if name.startswith('data.tar'):
                  ext = name.split('.', 1)[1] if '.' in name else 'tar'
                  tmp = tempfile.mktemp(suffix='.' + ext)
                  open(tmp, 'wb').write(data)
                  os.makedirs(dest, exist_ok=True)
                  subprocess.run(['tar', '-xf', tmp, '-C', dest], check=False)
                  os.remove(tmp)
              i += 60 + size
              if i % 2: i += 1
          PY
          }
          
          fn() { # pkg -> Filename（从 /tmp/tpkgs 解析）
            awk -v pkg="$1" '
              $1=="Package:" && $2==pkg {found=1; next}
              found && $1=="Filename:" {print $2; exit}
              found && $1=="Package:" {found=0}
            ' /tmp/tpkgs
          }
          
          PKGS=(proot libtalloc libandroid-shmem)
          TERMUX_OK=0
          
          for tm in "${TERMUX_MIRRORS[@]}"; do
            log "  ── 镜像：$tm"
          
            # ① 该镜像自己的索引（支持未压缩 / gz / xz）
            IDX=""
            for idx in Packages Packages.gz Packages.xz; do
              u="$tm/dists/stable/main/binary-aarch64/$idx"
              code=$(curl -sSL --connect-timeout 10 --max-time 120 -A 'Mozilla/5.0' \
                     -w '%{http_code}' "$u" -o /tmp/tpkgs.raw 2>/dev/null || true)
              if [ "$code" = "200" ] && [ -s /tmp/tpkgs.raw ]; then
                case "$idx" in
                  *.gz) gzip -dc /tmp/tpkgs.raw > /tmp/tpkgs 2>/dev/null || { continue; } ;;
                  *.xz) xz -dc   /tmp/tpkgs.raw > /tmp/tpkgs 2>/dev/null || { continue; } ;;
                  *)    cp /tmp/tpkgs.raw /tmp/tpkgs ;;
                esac
                IDX="$idx"; break
              fi
              log "     索引 $idx -> HTTP ${code:-无响应}"
            done
            if [ -z "$IDX" ]; then log "  ⚠ 该镜像索引不可达，换下一个"; continue; fi
            log "     索引格式：$IDX（$(wc -l < /tmp/tpkgs) 行）"
          
            # ② 解析每个包的 Filename
            declare -A PATHS=()
            BAD=0
            for p in "${PKGS[@]}"; do
              path=$(fn "$p")
              if [ -z "$path" ]; then
                log "  ⚠ 索引里找不到包 $p，换下一个镜像"
                BAD=1; break
              fi
              PATHS[$p]="$path"
              log "     $p -> $path"
            done
            [ "$BAD" = "0" ] || continue
          
            # ③ 下全部 deb：同一路径在多个前缀下尝试；任一失败就换镜像
            for p in "${PKGS[@]}"; do
              path="${PATHS[$p]}"
              # 手动兜底：用户预先放好的 deb 优先
              if [ -s "/tmp/$p.deb" ] && [ ! -f "/tmp/$p.deb.tried" ]; then
                log "     使用已存在的 /tmp/$p.deb（手动兜底）"
                : > "/tmp/$p.deb.tried"
              else
                # 标准 apt 布局：Filename 相对仓库根；部分镜像把 pool 放在 dists 下或多层目录
                urls=(
                  "$tm/$path"
                  "$tm/dists/stable/main/binary-aarch64/$path"
                  "$tm/apt/termux-main/$path"
                )
                fetch_first "/tmp/$p.deb" "${urls[@]}" || { BAD=1; break; }
              fi
              rm -rf "/tmp/tx_$p"
              extract_deb "/tmp/$p.deb" "/tmp/tx_$p"
            done
            [ "$BAD" = "0" ] || { log "  ⚠ 该镜像有包下载失败，换下一个"; continue; }
          
            TERMUX_OK=1
            log "  ✅ 四件套来自镜像：$tm"
            break
          done
          [ "$TERMUX_OK" = "1" ] || die "所有 Termux 镜像都拿不到 proot 四件套。可手动把 proot.deb / libtalloc.deb / libandroid-shmem.deb 放到 /tmp/ 后重跑。"
          
          P="/tmp/tx_proot/data/data/com.termux/files/usr"
          [ -f "$P/bin/proot" ]            || die "proot.deb 里缺 bin/proot（包结构变了，请把日志贴出来）"
          [ -f "$P/libexec/proot/loader" ] || die "proot.deb 里缺 libexec/proot/loader"
          cp -f "$P/bin/proot"                  "$ROOT/proot/bin/proot"
          cp -f "$P/libexec/proot/loader"       "$ROOT/proot/libexec/loader"
          if [ -f "$P/libexec/proot/loader32" ]; then
            cp -f "$P/libexec/proot/loader32"   "$ROOT/proot/libexec/loader32"
          fi
          TL=$(find /tmp/tx_libtalloc -name 'libtalloc.so.*' -type f | sed -n '1p')
          [ -n "$TL" ] || die "缺 libtalloc.so"
          cp -f "$TL" "$ROOT/proot/lib/libtalloc.so.2"
          SH=$(find /tmp/tx_libandroid-shmem -name 'libandroid-shmem.so*' -type f | sed -n '1p')
          if [ -n "$SH" ]; then
            cp -f "$SH" "$ROOT/proot/lib/libandroid-shmem.so"
          else
            log "  ⚠ 缺 libandroid-shmem.so（部分源已并入 proot 包）：APP 会告警，多数 ROM 仍可启动"
          fi
          chmod 755 "$ROOT/proot/bin/proot" "$ROOT/proot/libexec/"*
          chmod 644 "$ROOT/proot/lib/"*.so*
          
          # ---------------------------------------------------------------- 6) 清理
          log "6/7 清理残留 .git 与缓存"
          find "$ROOT" -name '.git' -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$ROOT/var/tmp"/* 2>/dev/null || true
          du -sh "$ROOT"
          
          # ---------------------------------------------------------------- 7) 打包 + 校验
          log "7/7 打包 $OUT（--hard-dereference 展开硬链接）"
          tar -czf "$OUT" -C "$ROOT" --hard-dereference .
          sha256sum "$OUT" > "$OUT.sha256"
          
          log "校验四件套："
          MISS=0
          for f in opencode/bin/opencode proot/bin/proot proot/libexec/loader proot/lib/libtalloc.so.2; do
            if [ -f "$ROOT/$f" ]; then echo "  ✅ $f"; else echo "  ❌ $f"; MISS=1; fi
          done
          [ "$MISS" = "0" ] || die "四件套不齐，产物不可用"
          for f in proot/lib/libandroid-shmem.so proot/libexec/loader32; do
            [ -f "$ROOT/$f" ] && echo "  ✅ $f（推荐）" || echo "  ⚠ $f（建议补上）"
          done
          
          HL=$(tar -tvf "$OUT" 2>/dev/null | awk '$1 ~ /^h/' | wc -l)
          log "归档内硬链接条目：$HL（必须为 0）"
          log "完成：$OUT ($(du -h "$OUT" | cut -f1))"
          cat "$OUT.sha256"
          ROOTFS_SCRIPT
          chmod +x src/rootfs/build-rootfs.sh
          echo "✅ 已写入修复版 rootfs/build-rootfs.sh（$(wc -l < src/rootfs/build-rootfs.sh) 行）"
          bash -n src/rootfs/build-rootfs.sh

      - name: 生成 rootfs-arm64.tar.gz
        shell: bash
        env:
          OC_VER: ${{ inputs.oc_ver }}
        run: |
          set -euo pipefail
          cd src
          SKIP="${{ inputs.skip_apt }}"
          # push 触发时 inputs 为空 → 默认走轻量版（不需要 chroot / mount）
          if [ -z "$SKIP" ] || [ "$SKIP" = "true" ]; then
            echo "▶ --skip-apt（网关不调 /api/vcs/init，不需要 git）"
            sudo -E env OC_VER="$OC_VER" bash rootfs/build-rootfs.sh --skip-apt
          else
            echo "▶ 完整版（含 git）"
            sudo -E env OC_VER="$OC_VER" bash rootfs/build-rootfs.sh
          fi
          ls -lh rootfs-arm64.tar.gz rootfs-arm64.tar.gz.sha256
          cat rootfs-arm64.tar.gz.sha256

      - name: 归档自检
        shell: bash
        run: |
          set -euo pipefail
          cd src
          tar -tzf rootfs-arm64.tar.gz > /tmp/entries.txt
          for f in ./opencode/bin/opencode ./proot/bin/proot ./proot/libexec/loader ./proot/lib/libtalloc.so.2; do
            grep -qF "$f" /tmp/entries.txt || { echo "❌ 归档缺少 $f"; exit 1; }
          done
          echo "✅ 四件套齐全，归档条目 $(wc -l < /tmp/entries.txt) 个"

      - name: 上传 rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-arm64
          path: |
            src/rootfs-arm64.tar.gz
            src/rootfs-arm64.tar.gz.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4) 汇总成一个 Release（artifact 始终可用，Release 失败不影响编译结果）
  # ---------------------------------------------------------------------------
  publish:
    needs: [unpack, apk, rootfs]
    if: ${{ always() && needs.unpack.outputs.found == 'true' && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-arm64
          path: dist

      - name: 下载 rootfs（仅当该 job 成功）
        if: ${{ needs.rootfs.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: rootfs-arm64
          path: dist

      - name: rootfs 未生成时的说明
        if: ${{ needs.rootfs.result != 'success' }}
        run: |
          echo "::warning::本次 rootfs job 未成功（状态：${{ needs.rootfs.result }}），Release 里只有 APK。"
          echo "::warning::APK 已正常编译发布、可直接下载；rootfs 需看 rootfs job 日志修好后重跑。"
          echo "::warning::APP 无 rootfs 会提示「未找到本地 rootfs-arm64.tar.gz」，把归档 adb push 到 /sdcard/Download/ 即可。"

      - name: 列出产物
        run: find dist -type f -printf '%f  %k KB\n' | sort

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: 'OpenCode Gateway build #${{ github.run_number }}'
          body: |
            由 `opencode_rootfs.zip` 自动解压构建。
            - Commit: ${{ github.sha }}
            - 源码包内嵌目录已自动拍平
            - **app-arm64-v8a-release.apk**：装机用
            - **rootfs-arm64.tar.gz**：`adb push` 到 `/sdcard/Download/`，APP 启动时会优先读本地归档
            - 若本次 rootfs job 失败，此文件不会出现；APK 不受影响，看 rootfs job 日志即可
            - 网关：`http://127.0.0.1:4318/v1`；Web UI：`http://127.0.0.1:4317`
            - 生成 rootfs 的脚本在源码包 `rootfs/build-rootfs.sh`，说明见 `OFFLINE_BUILD.md`
          files: |
            dist/*.apk
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
