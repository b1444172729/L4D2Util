# 聚合网关 · GitHub Actions 编译脚本（r9 / Bun 路线）
#
# 放置位置（硬性要求）：仓库根目录 .github/workflows/build.yml，明文提交。
#   ⚠️ GitHub 只识别「已提交的明文 YAML」，压缩包里的 workflow 永远不会被触发。
#
# 仓库结构：
#   repo/
#   ├── .github/workflows/build.yml   ← 本文件，明文提交
#   └── dsh_free_model_app.zip        ← 完整工程包（里面套一层 aggregate-gateway/）
#
# dsh_free_model_app.zip 必须是【完整工程】：含 app/src/main/assets/bin/bun、
# assets/lib/*.so、assets/node/bootstrap.cjs 与全部 Kotlin/资源/脚本。
#
# 产出：Artifacts 里的 AggregateGateway-*.apk（默认 debug，AGP 自动签名，可直接安装）
# 目标体积：约 60 MB，与对照版一致。

name: 构建聚合网关 APK

on:
  push:
    paths:
      - 'dsh_free_model_app.zip'
      - '**/dsh_free_model_app.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug 可直接安装；release 为未签名包）'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release, both]
      skip_bundle:
        description: '跳过分发生成上游源码（快速验证壳能否编译，产物不含网关源码）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.9'
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  SKIP_BUNDLE: ${{ inputs.skip_bundle }}

jobs:
  build:
    name: 解压 → 校验 Bun 运行时 → 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # -------------------------------------------------------------- 1
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          lfs: true

      # -------------------------------------------------------------- 2
      # 解压并定位工程：不假定套了几层、不假定目录名。
      # 判据：同时存在 settings.gradle.kts 与 app/build.gradle.kts。
      - name: 解压 dsh_free_model_app.zip 并定位工程
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          OUT="$WS/_unpacked"
          rm -rf "$OUT"; mkdir -p "$OUT"

          mapfile -t ZIPS < <(find "$WS" -maxdepth 1 -type f -name '*.zip' -print | sort)
          echo "仓库根目录 zip 数量：${#ZIPS[@]}"
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::仓库根目录没有任何 .zip 文件"
            exit 1
          fi

          idx=0
          for z in "${ZIPS[@]}"; do
            idx=$((idx + 1))
            d="$OUT/zip$idx"
            mkdir -p "$d"
            echo "::group::解压 $(basename "$z")"
            if ! unzip -q -o "$z" -d "$d"; then
              echo "::error::$(basename "$z") 解压失败"
              echo "::endgroup::"
              exit 1
            fi
            find "$d" -type d -name '__MACOSX' -prune -exec rm -rf {} + 2>/dev/null || true
            echo "内容清单（最多 80 项）："
            (cd "$d" && find . -type f | sed 's|^\./||' | sort | head -80)
            echo "文件总数：$(find "$d" -type f | wc -l | tr -d ' ')"
            echo "::endgroup::"
          done

          # ZIP 格式保存本地时间且不带时区；东八区打包的源码在 UTC runner 上
          # 会被解释成「未来」mtime，导致 Ninja / Gradle 反复判定输入脏。
          echo "::group::归一化源码文件时间戳"
          echo "当前时间(UTC)      : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "归一化前最晚 mtime : $(find "$OUT" -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -n1)"
          find "$OUT" -type f -exec touch -d '2000-01-01 00:00:00 UTC' {} +
          echo "归一化后最晚 mtime : $(find "$OUT" -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -n1)"
          echo "::endgroup::"

          PROJECT_DIR=""
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            p="$(dirname "$s")"
            if [ -f "$p/app/build.gradle.kts" ]; then
              PROJECT_DIR="$p"
              break
            fi
          done < <(find "$OUT" "$WS" -maxdepth 12 -type f -name 'settings.gradle.kts' \
            -not -path '*/.git/*' -not -path '*__MACOSX*' -print 2>/dev/null || true)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::没找到完整 Android 工程（需同时有 settings.gradle.kts 与 app/build.gradle.kts）。"
            echo "::error::dsh_free_model_app.zip 必须是【完整工程包】，不能只放改动文件。"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_USED=${ZIPS[*]:-none}"    >> "$GITHUB_ENV"
          echo "工程目录：$PROJECT_DIR"
          echo "工程文件数：$(find "$PROJECT_DIR" -type f | wc -l | tr -d ' ')"

      # -------------------------------------------------------------- 3
      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # -------------------------------------------------------------- 4
      # 不用 android-actions/setup-android@v3：它默认要装早已下架的 `tools` 包。
      # r9：Bun 路线不需要 NDK / CMake，只装 SDK 三件套。
      - name: 配置 Android SDK 并安装 platform / build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for c in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              [ -d "$c" ] && { SDK_ROOT="$c"; break; }
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::找不到预装 Android SDK"
            exit 1
          fi
          echo "SDK_ROOT = $SDK_ROOT"
          SDKMGR=""
          for c in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            [ -x "$c" ] && { SDKMGR="$c"; break; }
          done
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f \
              -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::$SDK_ROOT 下没有可用的 sdkmanager"; exit 1
          fi
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          ok=0
          for i in 1 2 3; do
            if "$SDKMGR" --sdk_root="$SDK_ROOT" --install \
              "platforms;android-${COMPILE_SDK}" \
              "build-tools;${BUILD_TOOLS}" \
              "platform-tools"; then
              ok=1; break
            fi
            echo "::warning::SDK 组件安装第 $i 次失败，10 秒后重试…"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::SDK 组件安装失败"; exit 1; }
          echo "✅ SDK 就绪（Bun 路线无需 NDK / CMake）"
          echo "ANDROID_HOME=$SDK_ROOT"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # -------------------------------------------------------------- 5
      - name: 安装 Node.js（用于校验上游源码依赖）
        if: env.SKIP_BUNDLE != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # -------------------------------------------------------------- 6
      # 生成【散放】上游源码到 assets/node/ —— 零 node_modules、裁掉
      # desktop/scripts/TS 源码。Bun 二进制与 .so 不在本步骤范围内
      # （它们已随完整工程包提供，位于 assets/bin 与 assets/lib）。
      - name: 生成上游源码（散放 assets/node）
        if: env.SKIP_BUNDLE != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/prepare-node-bundle.sh"
          bash "$PROJECT_DIR/scripts/prepare-node-bundle.sh" "$PROJECT_DIR/.ofm-src"

      # -------------------------------------------------------------- 7
      # r9 闸门：Bun 由 ProcessBuilder 直接 exec，必须在编译前确认
      # 5 个二进制齐全、架构正确，否则产出「能装但起不来」的废 APK。
      - name: 校验 Bun 运行时（工程包内置，无需联网下载）
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::workflow 版本：2026-11-06-r9（Bun / ProcessBuilder 路线）。CI 日志里搜不到这行，说明仓库根的明文 build.yml 没覆盖提交。"
          A="$PROJECT_DIR/app/src/main/assets"
          BUN="$A/bin/bun"
          if [ ! -f "$BUN" ]; then
            echo "::error::缺 assets/bin/bun —— 完整工程包必须自带这个二进制。"
            exit 1
          fi
          python3 - "$BUN" "$A/lib" <<'PY'
          import os, sys, hashlib
          bun, libdir = sys.argv[1], sys.argv[2]
          d = open(bun, "rb").read()
          h = d[:20]
          is_elf = h[:4] == b"\x7fELF"
          is64 = len(h) > 4 and h[4] == 2
          machine = (h[18] | (h[19] << 8)) if len(h) >= 20 else 0
          print("Bun 核对       : %.2f MB | sha256=%s… | ELF=%s | 64位=%s | e_machine=%d" % (
              len(d)/1048576, hashlib.sha256(d).hexdigest()[:12], is_elf, is64, machine))
          if not (is_elf and is64 and machine == 0xB7):
              print("::error::assets/bin/bun 不是 arm64 的 64 位 ELF，拒绝打包")
              sys.exit(1)
          # ICU 库文件名是 libicu*.so.78，不能用 endswith(".so") 过滤
          want = ["libc++_shared.so", "libicudata.so.78", "libicui18n.so.78", "libicuuc.so.78"]
          have = sorted(os.listdir(libdir)) if os.path.isdir(libdir) else []
          hit = [w for w in want if w in have]
          print("依赖库         : %s" % ", ".join(have))
          miss = [w for w in want if w not in hit]
          if miss:
              print("::error::assets/lib 缺少依赖：" + ", ".join(miss))
              sys.exit(1)
          total = len(d) + sum(os.path.getsize(os.path.join(libdir, w)) for w in want)
          print("✅ 运行时齐备：Bun + %d 个依赖库，共 %.2f MB（未压缩）" % (len(hit), total/1048576))
          PY
          echo "许可声明       : $([ -f "$A/NOTICE.txt" ] && echo 已就位 || echo '缺失')"

      # -------------------------------------------------------------- 8
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: 构建前自检
        shell: bash
        run: |
          set -euo pipefail
          echo "PROJECT_DIR = $PROJECT_DIR"
          A="$PROJECT_DIR/app/src/main/assets"
          SRC="$A/node"
          echo "Bun 可执行文件 : $([ -f "$A/bin/bun" ] && du -h "$A/bin/bun" | cut -f1 || echo '缺失 ❌')"
          echo "C++/ICU 依赖   : $(find "$A/lib" -name '*.so*' 2>/dev/null | wc -l | tr -d ' ') 个"
          echo "上游源码       : $([ -f "$SRC/package.json" ] && echo 已就位 || echo '缺失')"
          echo "  入口 cli.mjs : $([ -f "$SRC/packages/standalone/cli.mjs" ] && echo 已就位 || echo '缺失')"
          echo "  文件数/体积  : $(find "$SRC" -type f 2>/dev/null | wc -l | tr -d ' ') 个 / $(du -sh "$SRC" 2>/dev/null | cut -f1)"
          echo "  node_modules : $([ -d "$SRC/node_modules" ] && echo '存在 ❌' || echo '无 ✅')"
          echo "  bundle.zip   : $([ -f "$SRC/bundle.zip" ] && echo '存在 ❌' || echo '已取消 ✅')"
          echo "JNI 胶水       : $([ -d "$PROJECT_DIR/app/src/main/cpp" ] && echo '残留 ❌' || echo '已删除 ✅')"
          echo "libnode.so     : $([ -f "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libnode.so" ] && echo '残留 ❌' || echo '已删除 ✅')"
          [ -f "$PROJECT_DIR/settings.gradle.kts" ] || { echo "::error::缺 settings.gradle.kts"; exit 1; }
          [ -f "$PROJECT_DIR/app/build.gradle.kts" ] || { echo "::error::缺 app/build.gradle.kts"; exit 1; }
          [ -f "$A/bin/bun" ] || { echo "::error::缺 assets/bin/bun，请上传最新完整工程包"; exit 1; }
          if [ ! -f "$SRC/package.json" ] || [ ! -f "$SRC/packages/standalone/cli.mjs" ]; then
            echo "::warning::上游源码缺失：APK 能编译，但装上后网关会报「源码不完整」。"
            echo "::warning::通常是 SKIP_BUNDLE=true，或 prepare-node-bundle.sh 执行失败（看步骤 6 日志）。"
          fi

      # -------------------------------------------------------------- 9
      - name: 编译 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "::error::ANDROID_HOME 未设置"; exit 1; }
          echo "sdk.dir=$SDK" > local.properties
          find . -type f \
            -not -path './build/*' -not -path './.cxx/*' -not -path './.gradle/*' \
            -not -path './.ofm-src/*' -not -path './app/build/*' \
            -exec touch -d '2000-01-01 00:00:00 UTC' {} +
          GRADLE_BIN="$(command -v gradle || true)"
          if [ -z "$GRADLE_BIN" ]; then
            GRADLE_BIN="$(find "$HOME/.gradle" /opt/hostedtoolcache /usr/local -maxdepth 6 \
              -type f -path '*/bin/gradle' -perm -u+x 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          [ -n "$GRADLE_BIN" ] && [ -x "$GRADLE_BIN" ] || { echo "::error::找不到 gradle"; exit 1; }
          echo "GRADLE_BIN = $GRADLE_BIN"
          "$GRADLE_BIN" --version
          case "$BUILD_TYPE" in
            debug)   "$GRADLE_BIN" --no-daemon --stacktrace assembleDebug ;;
            release) "$GRADLE_BIN" --no-daemon --stacktrace assembleRelease ;;
            both)    "$GRADLE_BIN" --no-daemon --stacktrace assembleDebug assembleRelease ;;
            *)       echo "::error::未知 BUILD_TYPE=$BUILD_TYPE"; exit 1 ;;
          esac

      # -------------------------------------------------------------- 10
      - name: 收集 APK
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          SHA="$(git -C "$WS" rev-parse --short=7 HEAD)"
          mkdir -p "$WS/artifacts"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print0 \
            | while IFS= read -r -d '' f; do
                variant="$(basename "$(dirname "$f")")"
                out="$WS/artifacts/AggregateGateway-${variant}-${SHA}.apk"
                cp "$f" "$out"
                echo "产出：$out ($(du -h "$out" | cut -f1))"
              done
          test -n "$(ls -A "$WS/artifacts" 2>/dev/null)" || {
            echo "::error::Gradle 未产出任何 APK"; exit 1;
          }

      # -------------------------------------------------------------- 10b
      # 体积构成自动打印：不用 adb、不用 unzip -l，编译完直接写日志与 Summary。
      - name: APK 体积构成（自动打印，无需手动操作）
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls -1 "${GITHUB_WORKSPACE}"/artifacts/*.apk 2>/dev/null | head -n1 || true)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "没有 APK 可分析（构建失败）"; exit 0
          fi
          python3 - "$APK" <<'PY'
          import sys, os, zipfile, collections
          p = sys.argv[1]
          z = zipfile.ZipFile(p)
          cat = collections.Counter(); catn = collections.Counter(); items = []
          for i in z.infolist():
              n = i.filename
              if   n.startswith('assets/bin/'):   k = 'Bun 运行时 assets/bin/'
              elif n.startswith('assets/lib/'):   k = 'C++/ICU 依赖 assets/lib/'
              elif n.startswith('assets/node/'):  k = '上游源码 assets/node/'
              elif n.startswith('assets/'):       k = '其它 assets/'
              elif n.startswith('lib/'):          k = '原生库 lib/（应为空）'
              elif n.endswith('.dex'):            k = 'classes.dex'
              else:                               k = '资源/签名'
              cat[k] += i.compress_size; catn[k] += 1
              items.append((i.compress_size, i.file_size, i.compress_type, n))
          tot = os.path.getsize(p)
          L = ['## APK 体积构成（自动分析）', '',
               '`%s` — **%.2f MB**，共 %d 个条目' % (os.path.basename(p), tot/1048576, len(z.infolist())),
               '', '| 类别 | 压缩后 | 条目数 |', '|---|---:|---:|']
          for k, v in cat.most_common():
              L.append('| %s | %.2f MB | %d |' % (k, v/1048576, catn[k]))
          L += ['', '### 最大的 12 个条目', '',
                '| 压缩后 | 原始 | 方式 | 文件 |', '|---:|---:|---|---|']
          for c, u, t, n in sorted(items, reverse=True)[:12]:
              L.append('| %.2f MB | %.2f MB | %s | `%s` |' % (
                  c/1048576, u/1048576, 'DEFLATE' if t == 8 else 'STORED', n))
          txt = '\n'.join(L)
          print(txt)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n' + txt + '\n')
          if 55 <= tot/1048576 <= 66:
              print('✅ %.1f MB：已与对照版（60.28 MB）对齐到同一量级。' % (tot/1048576))
          else:
              print('::notice::APK %.1f MB，未落在 55–66 MB 的目标区间；请对照上表找出大文件。' % (tot/1048576))
          # Bun 必须是 DEFLATE：STORED 的超大 assets 在部分 ROM 上无法 am.open()
          for c, u, t, n in items:
              if n == 'assets/bin/bun':
                  if t == 8: print('✅ assets/bin/bun 为 DEFLATE，AssetManager 可正常读取')
                  else: print('::warning::assets/bin/bun 是 STORED（未压缩），部分 ROM 上释放会失败')
          src = cat.get('上游源码 assets/node/', 0)
          if src > 20 * 1048576:
              print('::warning::上游源码区 %.1f MB，远超正常的 ~8 MB；对照上表找大文件。' % (src/1048576))
          else:
              print('✅ 上游源码区 %.1f MB，正常。' % (src/1048576))
          PY

      # -------------------------------------------------------------- 11
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AggregateGateway-APK-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------------- 12
      - name: 构建结果汇总
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          PD="${PROJECT_DIR:-$WS/_unpacked}"
          A="$PD/app/src/main/assets"
          SRC="$A/node"
          mark() { [ "$1" = "1" ] && echo "✅" || echo "⚠️ 缺失"; }
          b=0; r=0; s=0
          [ -f "$A/bin/bun" ] && r=1
          [ "$(find "$A/lib" -name '*.so*' 2>/dev/null | wc -l | tr -d ' ')" -ge 4 ] && s=1
          [ -f "$SRC/package.json" ] && [ -f "$SRC/packages/standalone/cli.mjs" ] && b=1
          {
            echo "## 聚合网关 APK 构建结果（r9 / Bun）"
            echo ""
            echo "| 检查项 | 状态 |"
            echo "|---|---|"
            echo "| 压缩包 | ${ZIP_USED:-未找到} |"
            echo "| 工程目录 | ${PD} |"
            echo "| 构建类型 | ${BUILD_TYPE} |"
            echo "| Bun 可执行文件 | $(mark $r) |"
            echo "| C++/ICU 依赖（4 个 .so） | $(mark $s) |"
            echo "| 上游源码（散放 assets/node） | $(mark $b) |"
            echo "| 源码文件数 / 体积 | $(find "$SRC" -type f 2>/dev/null | wc -l | tr -d ' ') 个 / $(du -sh "$SRC" 2>/dev/null | cut -f1) |"
            echo ""
            if [ -d "$WS/artifacts" ] && [ -n "$(ls -A "$WS/artifacts" 2>/dev/null)" ]; then
              for f in "$WS"/artifacts/*.apk; do
                echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)"
              done
            else
              echo "- 无（构建失败）"
            fi
            echo ""
            if [ "$b" = 1 ] && [ "$r" = 1 ] && [ "$s" = 1 ]; then
              echo "> 运行时齐备。装上后点「启动网关」，界面自检会显示 Bun 与 4 个 .so 是否就位。"
            else
              echo "> ⚠️ **这是壳 APK**：能编译、能安装，但网关启动会失败。请上传含 assets/bin 与 assets/lib 的完整工程包。"
            fi
            echo ""
            echo "> release 产物为 **unsigned**；默认 debug 已由 AGP 用 debug keystore 签名，可直接安装。"
          } >> "$GITHUB_STEP_SUMMARY"
