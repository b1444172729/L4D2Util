name: Build DeviceMCP APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'DeviceMCP.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: 解压源码并编译 APK
    runs-on: ubuntu-latest

    # 源码含中文注释，显式声明 UTF-8 环境
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:
      # ---------------------------------------------------------------
      # 1. 检出仓库（拿到 DeviceMCP.zip）
      # ---------------------------------------------------------------
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 确认压缩包存在
        run: |
          echo "仓库根目录内容："
          ls -la
          if [ ! -f "DeviceMCP.zip" ]; then
            echo "::error::未找到 DeviceMCP.zip，请确认已上传到仓库根目录"
            exit 1
          fi
          echo "压缩包大小：$(du -h DeviceMCP.zip | cut -f1)"

      # ---------------------------------------------------------------
      # 2. JDK 17 + Android SDK
      # ---------------------------------------------------------------
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "已安装组件："
          sdkmanager --list_installed | head -20 || true

      # ---------------------------------------------------------------
      # 3. 解压压缩包
      #    用 Python 而非 unzip：可正确处理 Windows 压缩产生的反斜杠路径
      #    与中文文件名，并剥离最外层目录。
      # ---------------------------------------------------------------
      - name: 解压 DeviceMCP.zip
        run: |
          python3 - << 'PYEOF'
          import zipfile, os, shutil, stat

          ZIP = 'DeviceMCP.zip'
          OUT = 'src'

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          extracted = []
          with zipfile.ZipFile(ZIP) as z:
              for info in z.infolist():
                  raw = info.filename
                  # 统一分隔符：Windows 压缩可能是 DeviceMCP\app\...
                  name = raw.replace('\\', '/')
                  # 剥离最外层目录（DeviceMCP/ 或 DeviceMCP-master/ 等）
                  parts = name.split('/')
                  if len(parts) > 1 and parts[0]:
                      rel = '/'.join(parts[1:])
                  else:
                      rel = name
                  if not rel or rel.endswith('/'):
                      continue
                  target = os.path.join(OUT, rel)
                  os.makedirs(os.path.dirname(target) or OUT, exist_ok=True)
                  with z.open(info) as src, open(target, 'wb') as dst:
                      shutil.copyfileobj(src, dst)
                  extracted.append(rel)
                  # 恢复可执行文件权限
                  mode = info.external_attr >> 16
                  if mode and stat.S_ISREG(mode):
                      os.chmod(target, mode & 0o7777)

          print(f"解压文件数: {len(extracted)}")

          # 定位项目根目录：含有 settings.gradle 或 build.gradle 的目录
          project_root = None
          for dp, dn, fn in os.walk(OUT):
              if 'settings.gradle' in fn or 'build.gradle' in fn:
                  # 优先取含 settings.gradle 且层级最浅的目录
                  if 'settings.gradle' in fn:
                      project_root = dp
                      break
          if project_root is None:
              for dp, dn, fn in os.walk(OUT):
                  if 'build.gradle' in fn:
                      project_root = dp
                      break

          if project_root is None:
              print("::error::解压后未找到 settings.gradle / build.gradle，请检查压缩包结构")
              print("顶层目录:", os.listdir(OUT))
              raise SystemExit(1)

          # 写出供后续步骤使用的路径
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PROJECT_ROOT={os.path.abspath(project_root)}\n")

          print(f"项目根目录: {project_root}")
          print("该目录内容:")
          for x in sorted(os.listdir(project_root))[:30]:
              print("  -", x)
          PYEOF

      - name: 校验项目结构
        run: |
          echo "PROJECT_ROOT=${PROJECT_ROOT}"
          cd "${PROJECT_ROOT}"
          echo "--- 关键文件检查 ---"
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml gradle/wrapper/gradle-wrapper.properties; do
            if [ -f "$f" ]; then echo "  [OK] $f"; else echo "  [缺失] $f"; fi
          done
          echo "--- Java 源文件数 ---"
          find . -name "*.java" | wc -l

      # ---------------------------------------------------------------
      # 4. 准备 Gradle
      #    源码包内不含 gradle-wrapper.jar（二进制文件不便随源码分发），
      #    因此先安装 Gradle 发行版，再用它就地生成完整 wrapper。
      # ---------------------------------------------------------------
      - name: 安装 Gradle 8.5
        run: |
          cd /tmp
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q -o gradle.zip -d /opt
          rm -f gradle.zip
          chmod +x /opt/gradle-8.5/bin/gradle
          /opt/gradle-8.5/bin/gradle --version | head -6
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: 生成 Gradle Wrapper
        run: |
          cd "$PROJECT_ROOT"
          /opt/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 --distribution-type bin --no-daemon
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      # ---------------------------------------------------------------
      # 5. 编译
      # ---------------------------------------------------------------
      - name: 授予 gradlew 执行权限并预下载依赖
        run: |
          cd "$PROJECT_ROOT"
          chmod +x ./gradlew
          ./gradlew --version
          echo "开始解析依赖（首次耗时较长）..."
          ./gradlew androidDependencies --no-daemon -Dorg.gradle.jvmargs=-Xmx2048m

      - name: 编译 Debug APK
        if: github.event.inputs.build_type != 'release'
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

      - name: 编译 Release APK（未签名）
        if: github.event.inputs.build_type == 'release'
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

      # ---------------------------------------------------------------
      # 6. 收集与上传产物
      # ---------------------------------------------------------------
      - name: 定位 APK
        run: |
          echo "--- 全部 APK ---"
          find "${PROJECT_ROOT}" -name "*.apk" -type f
          echo "--- 复制到输出目录 ---"
          mkdir -p apk_out
          find "${PROJECT_ROOT}/app/build/outputs" -name "*.apk" -type f -exec cp {} apk_out/ \;
          cd apk_out
          for f in *.apk; do
            [ -e "$f" ] || continue
            echo "  $f  $(du -h "$f" | cut -f1)"
          done
          ls -la

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMCP-APK
          path: apk_out/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------
      # 7. 打 tag 时自动发布 Release
      # ---------------------------------------------------------------
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk_out/*.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # 8. 失败时输出诊断信息
      # ---------------------------------------------------------------
      - name: 构建失败诊断
        if: failure()
        run: |
          echo "=========== 目录树（前 3 层）==========="
          find "${PROJECT_ROOT}" -maxdepth 3 -type d | head -40 || true
          echo "=========== 最近日志 ==========="
          if [ -f "${PROJECT_ROOT}/app/build/reports/androidTest-results" ]; then
            echo "(无测试报告)"
          fi
          echo "请查看上方 Gradle 报错详情"
