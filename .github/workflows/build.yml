name: Build NxShell (Windows x64)

# ============================================================
#  触发：
#   1. Actions 页面 → Run workflow（手动）
#   2. git tag v1.0.0 && git push origin v1.0.0（自动发 Release）
#
#  仓库里放什么都可以，脚本会自己找路：
#    - nxshell-source.zip（脚本自动解压，且支持包内再套一层目录）
#    - nxshell-source/ 目录
#    - 源码平铺在仓库根
# ============================================================
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    # 必须 pin windows-2022！不能写 windows-latest。
    # windows-latest 已切到 Visual Studio 2026 (18.x)，node-gyp 12.0.x 及更早
    # 版本不认识该版本号，会报：
    #   gyp ERR! find VS unknown version "undefined"
    #   could not find a version of Visual Studio 2017 or newer
    # node-pty / serialport 是原生模块 → 直接编译失败。
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      # 脚本解压 zip 需要 python；windows-2022 自带，此步确保版本可控
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        shell: bash
        env:
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          # 脚本可能位于仓库根，也可能在 nxshell-source/ 里，或压在 zip 中
          if [ -f build.sh ]; then
            bash build.sh
          elif [ -f nxshell-source/build.sh ]; then
            bash nxshell-source/build.sh
          else
            echo "!! 找不到 build.sh"
            find . -maxdepth 3 -name "build.sh" || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxShell-win-x64-Setup
          path: out/*.exe
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
