name: Build AdbWifi APK

on:
  workflow_dispatch:      # 允许在 Actions 页面手动点「Run workflow」
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # 1. 拉取仓库（仓库根目录下应放置 adbwifi.zip）
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. JDK 17
      #    镜像预装的 cmdline-tools 硬性要求 JDK 17+，用 JDK 11 会直接报错。
      #    AGP 7.4.2 / Gradle 7.6.4 均支持 JDK 17，故全程统一用 17。
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------
      # 3. 定位 Android SDK 与 sdkmanager
      #    不使用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      #    而 "tools" 包已被 Google 下架，sdkmanager 返回 1 导致 action 崩溃。
      #    镜像本身已预装 SDK + cmdline-tools，但目录名是版本号（16.0/20.0…）
      #    而非 latest，所以这里用通配动态定位，并把路径存进 GITHUB_ENV。
      # ---------------------------------------------------------------
      - name: Set up Android SDK
        run: |
          set -e
          # 1) 找 SDK 根目录
          SDK=""
          for c in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" \
                   /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -n "$c" ] && [ -d "$c" ]; then SDK="$c"; break; fi
          done
          if [ -z "$SDK" ]; then
            echo "::error::找不到 Android SDK 根目录"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "SDK = $SDK"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          # 2) 找 sdkmanager：cmdline-tools/<版本>/bin/sdkmanager
          SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SM" ]; then SM=$(command -v sdkmanager 2>/dev/null || true); fi
          if [ -z "$SM" ]; then
            echo "::error::找不到 sdkmanager"
            ls -la "$SDK" 2>/dev/null || true
            ls -la "$SDK/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager = $SM"
          echo "SM=$SM"                 >> "$GITHUB_ENV"
          echo "SM_DIR=$(dirname "$SM")" >> "$GITHUB_ENV"
          # 关键：当前步骤内也要立刻生效（GITHUB_PATH 只对后续步骤有效）
          export PATH="$(dirname "$SM"):$PATH"

          # 3) 预置 license 哈希，避免卡在 Accept? (y/N) 交互
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' \
            > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$SDK/licenses/android-sdk-preview-license"
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a\n' \
            > "$SDK/licenses/intel-android-extra-license"

          echo "---- sdkmanager version ----"
          sdkmanager --version

      # ---------------------------------------------------------------
      # 4. 按需安装编译组件
      #    镜像通常已预装 android-33 与 build-tools，先检查、缺什么装什么，
      #    能全跳过就最好——少一次联网就少一个失败点。
      # ---------------------------------------------------------------
      - name: Install SDK packages
        run: |
          set -e
          export PATH="$SM_DIR:$PATH"
          echo "---- 已装 platforms ----"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(无)"
          echo "---- 已装 build-tools ----"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(无)"

          NEED=""
          [ -d "$ANDROID_HOME/platforms/android-33" ] || NEED="$NEED platforms;android-33"
          [ -d "$ANDROID_HOME/build-tools/33.0.1"  ] || NEED="$NEED build-tools;33.0.1"
          [ -d "$ANDROID_HOME/build-tools/33.0.2"  ] || NEED="$NEED build-tools;33.0.2"
          [ -d "$ANDROID_HOME/platform-tools"      ] || NEED="$NEED platform-tools"

          if [ -z "$NEED" ]; then
            echo "组件齐全，跳过安装"
          else
            echo "待安装：$NEED"
            yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install $NEED
          fi
          echo "---- 安装后 ----"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      # ---------------------------------------------------------------
      # 5. 解压 adbwifi.zip 并定位工程根目录
      #    压缩包里套了一层文件夹，所以解压后用 find 找 settings.gradle，
      #    不管那层文件夹叫什么名字、套了几层都能定位到。
      # ---------------------------------------------------------------
      - name: Unzip and locate project
        run: |
          set -e
          if [ ! -f adbwifi.zip ]; then
            echo "::error::仓库根目录没找到 adbwifi.zip"
            ls -la
            exit 1
          fi
          rm -rf __src
          mkdir -p __src
          unzip -q -o adbwifi.zip -d __src
          DIR=$(find __src -name "settings.gradle" -printf "%h\n" | head -1)
          if [ -z "$DIR" ]; then
            echo "::error::解压后没找到 settings.gradle，压缩包结构不对"
            find __src -maxdepth 3 | head -40
            exit 1
          fi
          echo "project dir = $DIR"
          find "$DIR" -maxdepth 2 -type f | head -30
          echo "SRC_DIR=$DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 6. 覆写 settings.gradle / gradle.properties
      #    原包里带的是阿里云 Maven 镜像，在海外 runner 上可能慢或不可达，
      #    这里换成 google() + mavenCentral()，避免卡在解析依赖。
      # ---------------------------------------------------------------
      - name: Normalize gradle config
        run: |
          cat > "${SRC_DIR}/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AdbWifi"
          include ':app'
          EOF

          cat > "${SRC_DIR}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ---------------------------------------------------------------
      # 7. 编译 Debug APK
      #    AGP 7.4.2 要求 Gradle >= 7.5，这里用 7.6.4（7.x 末版，兼容性最好）。
      # ---------------------------------------------------------------
      - name: Build with Gradle
        id: gradle_build
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6.4
          build-root-directory: ${{ env.SRC_DIR }}
          arguments: assembleDebug --stacktrace

      # 兜底：若 gradle-build-action 因 Node 20 弃用等环境问题失效，
      # 用镜像自带的 gradle 生成 wrapper 再编译。
      - name: Build with Gradle (fallback)
        if: failure() && steps.gradle_build.outcome == 'failure'
        run: |
          set -e
          cd "$SRC_DIR"
          gradle wrapper --gradle-version 7.6.4 --distribution-type bin
          ./gradlew assembleDebug --stacktrace

      # ---------------------------------------------------------------
      # 8. 收集并上传产物
      # ---------------------------------------------------------------
      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          APK=$(find "${SRC_DIR}" -name "*.apk" -path "*outputs*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没找到 APK 产物"
            find "${SRC_DIR}" -name "*.apk" | head -20
            exit 1
          fi
          cp "$APK" out/adbwifi-debug.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbwifi-debug
          path: out/adbwifi-debug.apk

      # ---------------------------------------------------------------
      # 9. 打 tag（v*）时额外发一个 Release，方便直接下载
      # ---------------------------------------------------------------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/adbwifi-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
