name: Build AdbWifi APK

on:
  workflow_dispatch:      # 允许在 Actions 页面手动点「Run workflow」
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # 1. 拉取仓库（仓库根目录下应放置 adbwifi.zip）
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. JDK 11（AGP 7.4.2 在 JDK 11 下最稳）
      # ---------------------------------------------------------------
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # ---------------------------------------------------------------
      # 3. Android SDK + Licenses
      # ---------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1 || true
          sdkmanager --list_installed | head -20

      # ---------------------------------------------------------------
      # 4. 解压 adbwifi.zip 并定位工程根目录
      #    压缩包里套了一层文件夹，所以解压后用 find 找 settings.gradle，
      #    不管那层文件夹叫什么名字都能定位到。
      # ---------------------------------------------------------------
      - name: Unzip and locate project
        id: locate
        run: |
          set -e
          if [ ! -f adbwifi.zip ]; then
            echo "::error::仓库根目录没找到 adbwifi.zip"
            exit 1
          fi
          rm -rf __src
          mkdir -p __src
          unzip -q -o adbwifi.zip -d __src
          # 找到含 settings.gradle 的那一层，就是工程根
          DIR=$(find __src -name "settings.gradle" -printf "%h\n" | head -1)
          if [ -z "$DIR" ]; then
            echo "::error::解压后没找到 settings.gradle，压缩包结构不对"
            find __src -maxdepth 3 | head -40
            exit 1
          fi
          echo "project dir = $DIR"
          find "$DIR" -maxdepth 2 -type f | head -30
          echo "SRC_DIR=$DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 5. 覆写 settings.gradle / gradle.properties
      #    原包里带的是阿里云 Maven 镜像，在海外 runner 上可能慢或不可达，
      #    这里换成 google() + mavenCentral()，避免卡在解析依赖。
      # ---------------------------------------------------------------
      - name: Normalize gradle config
        run: |
          cat > "${SRC_DIR}/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AdbWifi"
          include ':app'
          EOF

          cat > "${SRC_DIR}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ---------------------------------------------------------------
      # 6. 编译 Debug APK
      #    gradle-build-action 会在没有 wrapper 的情况下按指定版本拉 Gradle。
      #    AGP 7.4.2 要求 Gradle >= 7.5，这里用 7.6.4（7.x 末版，兼容性最好）。
      #    若该 action 报弃用/不可用，改用下面注释里的 fallback 两步：
      #       cd "$SRC_DIR" && gradle wrapper --gradle-version 7.6.4 && ./gradlew assembleDebug
      # ---------------------------------------------------------------
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6.4
          build-root-directory: ${{ env.SRC_DIR }}
          arguments: assembleDebug --stacktrace

      # ---------------------------------------------------------------
      # 7. 收集并上传产物
      # ---------------------------------------------------------------
      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          APK=$(find "${SRC_DIR}" -name "*.apk" -path "*outputs*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没找到 APK 产物"
            find "${SRC_DIR}" -name "*.apk" | head -20
            exit 1
          fi
          cp "$APK" out/adbwifi-debug.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbwifi-debug
          path: out/adbwifi-debug.apk

      # ---------------------------------------------------------------
      # 8. 打 tag（v*）时额外发一个 Release，方便直接下载
      # ---------------------------------------------------------------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/adbwifi-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
