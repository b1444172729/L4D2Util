name: Build AdbWifi APK

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. 检出仓库（拿到上传的 adbwifi.zip）
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. JDK 17 + Android SDK 34
      # ─────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' '

      # ─────────────────────────────────────────────
      # 3. 安装 Gradle 8.2（仓库里没有 gradle-wrapper.jar 时兜底）
      # ─────────────────────────────────────────────
      - name: Setup Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sfn /opt/gradle-8.2 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"
          /opt/gradle/bin/gradle --version | head -4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ─────────────────────────────────────────────
      # 4. 解压 adbwifi.zip 并定位工程根目录
      #    （压缩包里套了一层文件夹，自动剥离）
      # ─────────────────────────────────────────────
      - name: Unzip source and locate project
        id: locate
        run: |
          set -e
          # 优先找 adbwifi.zip，其次任意 zip
          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -iname 'adbwifi.zip' -not -path '*/.git/*' | head -1)"
          [ -z "$ZIP" ] && ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -iname '*.zip' -not -path '*/.git/*' -not -iname '*gradle*' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "::error::仓库中未找到源码压缩包（adbwifi.zip）"
            exit 1
          fi
          echo "找到压缩包: $ZIP"

          # 用 Python 解压，避免 unzip 在中文文件名上的编码问题
          python3 - <<PY
          import zipfile, os
          zipfile.ZipFile(r"$ZIP").extractall("$GITHUB_WORKSPACE/__src")
          print("解压完成")
          PY

          # 无论套了几层文件夹，直接找 settings.gradle 所在目录
          SETTINGS="$(find "$GITHUB_WORKSPACE/__src" \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::解压后未找到 settings.gradle，请确认压缩包内含完整工程"
            find "$GITHUB_WORKSPACE/__src" -maxdepth 2 | head -30
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "工程根目录: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          # 校验关键文件
          ls -la "$ROOT"
          ls "$ROOT/app/src/main/java/com/android/adbwifi/MainActivity.kt" || exit 1

      # ─────────────────────────────────────────────
      # 5. 构建 APK
      # ─────────────────────────────────────────────
      - name: Build APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          set -e
          TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "构建类型: $TYPE"

          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "使用仓库自带 Gradle Wrapper"
            chmod +x gradlew
            ./gradlew --no-daemon :app:assemble${TYPE^}
          else
            echo "仓库缺少 gradle-wrapper.jar，使用系统 Gradle 8.2"
            gradle --no-daemon :app:assemble${TYPE^}
          fi

      # ─────────────────────────────────────────────
      # 6. 收集产物
      # ─────────────────────────────────────────────
      - name: Collect APK
        id: collect
        run: |
          set -e
          TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          mkdir -p out
          APK="$(find "$GITHUB_WORKSPACE/__src" -path '*/app/build/outputs/apk/*' -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::未生成 APK"
            find "$GITHUB_WORKSPACE/__src" -name '*.apk' | head
            exit 1
          fi
          echo "原始产物: $APK"
          cp "$APK" "out/无线调试-$TYPE.apk"
          cp "$APK" "out/adbwifi-$TYPE.apk"
          ls -la out
          echo "apk_name=无线调试-$TYPE.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbwifi-apk
          path: out/*.apk
          compression-level: 9
          retention-days: 90

      # ─────────────────────────────────────────────
      # 7. 打 tag 时顺带发 Release
      # ─────────────────────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: 无线调试 ${{ github.ref_name }}
          body: |
            自动构建产物（GitHub Actions）

            - 包名：`com.android.adbwifi`
            - 构建类型：${{ github.event.inputs.build_type || 'debug' }}

            首次使用如需开关无线调试，请先授权：
            ```
            adb shell pm grant com.android.adbwifi android.permission.WRITE_SECURE_SETTINGS
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
