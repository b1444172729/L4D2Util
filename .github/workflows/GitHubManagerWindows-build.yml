name: Build Windows App

# 推送源码包 / Kotlin 文件 / 脚本本身时自动构建，
# 也可以在 Actions 页面手动点「Run workflow」触发。
on:
  push:
    paths:
      - '**.zip'
      - '**.kt'
      - '**.kts'
      - 'gradle.properties'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    # 必须是 Windows：Compose Desktop 的 exe / msi 走 jpackage 打包，
    # 只能在目标平台上生成，Linux / macOS 运行器出不来。
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # Windows 默认 GBK，不强制 UTF-8 的话源码里的中文可能变乱码
      GRADLE_OPTS: -Dfile.encoding=UTF-8

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. 解压并定位项目目录
      #    压缩包上传后不会自动解开，且里面还套了一层文件夹，
      #    所以这里先解压，再递归找到真正的 Gradle 项目根目录。
      # ------------------------------------------------------------------
      - name: 解压源码包并定位项目目录
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob nocaseglob
          zips=( *.zip )

          if [ ${#zips[@]} -gt 0 ]; then
            echo "发现 ${#zips[@]} 个压缩包：${zips[*]}"
            rm -rf _src && mkdir -p _src
            for z in "${zips[@]}"; do
              echo "解压：$z"
              if command -v unzip >/dev/null 2>&1; then
                unzip -q -o "$z" -d _src
              else
                # 兜底：Git Bash 万一没有 unzip，用 Python 的 zipfile
                python -m zipfile -e "$z" _src/
              fi
            done
            base="_src"
          else
            echo "未发现压缩包，假定仓库根目录就是项目"
            base="."
          fi

          # 递归查找：必须同时有 settings.gradle.kts 与 build.gradle.kts，
          # 避免误判到某个只有其一的子目录。
          dir=""
          while IFS= read -r hit; do
            cand="$(dirname "$hit")"
            if [ -f "$cand/build.gradle.kts" ] || [ -f "$cand/build.gradle" ]; then
              dir="$cand"
              break
            fi
          done < <(find "$base" -maxdepth 6 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print)

          if [ -z "$dir" ]; then
            echo "::error::未找到项目目录（需要同时含 settings.gradle.kts 与 build.gradle.kts）"
            echo "----- _src 目录树 -----"
            find "$base" -maxdepth 4 2>/dev/null | head -60
            exit 1
          fi

          echo "项目目录：$dir"
          echo "----- 目录内容 -----"
          ls -la "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 2. 环境：JDK 17 + Gradle 8.7
      #    jpackage 要求 JDK 17+，低版本打包会直接失败。
      # ------------------------------------------------------------------
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ------------------------------------------------------------------
      # 3. 准备 WiX（生成 exe / msi 安装包需要）
      #    windows-latest 镜像一般自带 WiX；即便没有，Compose 插件也会
      #    自动下载 wix311。这一步只是把预装路径显式加进 PATH，尽力而为。
      # ------------------------------------------------------------------
      - name: 准备 WiX 工具集
        shell: pwsh
        continue-on-error: true
        run: |
          $wix = $env:WIX
          if ($wix) {
            $wix = $wix.TrimEnd('\', '/')
            if (Test-Path (Join-Path $wix 'bin')) {
              (Join-Path $wix 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "已把预装 WiX 加入 PATH：$(Join-Path $wix 'bin')"
            }
          } else {
            Write-Host "未检测到预装 WiX，交由 Compose 插件自动下载"
          }

      # ------------------------------------------------------------------
      # 4. 打包 exe（主产物，必须成功）
      #    源码包里没有 gradlew，所以直接用已安装的 gradle。
      # ------------------------------------------------------------------
      - name: 打包 exe
        # continue-on-error：exe 失败时仍让 msi 有机会跑，
        # 最终有没有产物由后面的「校验产物」把关
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          echo "使用命令：$CMD"
          # --info：jpackage 失败时 Gradle 默认只报「exit code 1」，
          # 加 --info 才能看到 jpackage 的完整命令行与部分内部输出
          $CMD --no-daemon --console=plain --info packageExe

      # ------------------------------------------------------------------
      # 5. 打包 msi（可选，失败不影响整体）
      # ------------------------------------------------------------------
      - name: 打包 msi
        id: msi
        shell: bash
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          $CMD --no-daemon --console=plain packageMsi

      # ------------------------------------------------------------------
      # 7. 校验并上传（必须先上传，再跑兜底）
      #
      #    ⚠ 顺序很重要：之前把 if: always() 的兜底步骤放在上传之前，
      #    结果兜底步骤自己失败（exit 127），把后面的上传全部跳过了——
      #    exe / msi 明明打出来了却没上传。现在上传排在兜底之前。
      #
      #    另外注意产物目录名：Compose Multiplatform 1.6.11 输出在
      #    build/compose/binaries/main/，不是 main-release/。
      #    所以这里用 ** 通配，两个目录名都能匹配。
      # ------------------------------------------------------------------
      - name: 校验产物
        id: verify
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          found=$(find build/compose/binaries -type f \( -name '*.exe' -o -name '*.msi' \) 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "::error::未生成任何 exe / msi"
            echo "----- build/compose/binaries 目录树 -----"
            find build/compose/binaries -maxdepth 4 2>/dev/null | head -40
            exit 1
          fi
          echo "产物清单："
          echo "$found"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: GitHubManager-Windows
          path: |
            ${{ steps.locate.outputs.dir }}/build/compose/binaries/**/*.exe
            ${{ steps.locate.outputs.dir }}/build/compose/binaries/**/*.msi
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------
      # 8. 以下全部是兜底：只有打包失败/无论如何都不影响主产物时才跑
      #    每个都带 continue-on-error，绝不能因为它们失败而拖累主流程
      # ------------------------------------------------------------------
      - name: 输出 jpackage 错误日志
        if: failure()
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          echo "========== jpackage 日志文件清单 =========="
          find build/compose/logs -type f 2>/dev/null | head -20
          echo
          for f in $(find build/compose/logs -type f -name '*err.txt' 2>/dev/null | head -5); do
            echo "========== [STDERR] $f =========="
            cat "$f"
            echo
          done
          for f in $(find build/compose/logs -type f -name '*out.txt' 2>/dev/null | head -5); do
            echo "========== [STDOUT] $f =========="
            tail -60 "$f"
            echo
          done
          echo "========== jpackage 参数文件 =========="
          for f in $(find build/compose/tmp -type f -name '*.args.txt' 2>/dev/null | head -5); do
            echo "--- $f ---"
            cat "$f"
            echo
          done

          echo "========== 参数文件非 ASCII 字节扫描 =========="
          echo "（若这里不是 0，说明 jpackage 会因 MalformedInputException 解析失败）"
          for f in $(find build/compose/tmp -type f -name '*.args.txt' 2>/dev/null); do
            n=$(LC_ALL=C tr -dc '\200-\377' < "$f" | wc -c)
            echo "$f -> 非ASCII字节数: $n"
          done

      - name: 兜底生成可运行程序目录
        if: failure()
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          $CMD --no-daemon --console=plain createDistributable || true
          APPDIR=$(find build/compose/binaries -maxdepth 3 -type d -name 'app' | head -1)
          if [ -n "$APPDIR" ]; then
            # 注意：windows-2025 镜像的 Git Bash 里没有 zip 命令，
            # 用 PowerShell 的 Compress-Archive（Windows 运行器必带）代替。
            powershell -NoProfile -Command "Compress-Archive -Path '$APPDIR/*' -DestinationPath 'build/compose/binaries/GitHubManager-app.zip' -Force"
            echo "已生成 app 压缩包：$APPDIR"
          else
            echo "::warning::没找到 app 目录"
          fi

      - name: 上传可运行程序目录（兜底）
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GitHubManager-Windows-AppDir
          path: ${{ steps.locate.outputs.dir }}/build/compose/binaries/GitHubManager-app.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: 生成可运行 jar 包（终极兜底）
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          $CMD --no-daemon --console=plain jar || true

          OUT=build/GitHubManager-runnable
          rm -rf "$OUT" && mkdir -p "$OUT/lib"

          # 主 jar
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -1)
          if [ -z "$JAR" ]; then echo "::warning::没找到主 jar，跳过兜底产物"; exit 0; fi
          cp "$JAR" "$OUT/GitHubManager.jar"
          echo "主 jar：$JAR"

          # 运行时依赖
          $CMD --no-daemon --console=plain -q printRuntimeClasspath 2>/dev/null > /tmp/cp.txt || true
          if [ -s /tmp/cp.txt ]; then
            tr ':' '\n' < /tmp/cp.txt | grep '\.jar$' | while read -r j; do
              [ -f "$j" ] && cp "$j" "$OUT/lib/" || true
            done
          fi

          cat > "$OUT/运行.bat" <<'BAT'
          @echo off
          chcp 65001 >nul
          java -version >nul 2>&1 || (echo 需要先安装 JDK 17：https://adoptium.net/ & pause & exit /b 1)
          java -cp "GitHubManager.jar;lib/*" com.githubmanager.desktop.MainKt
          pause
          BAT

          # 同样：Git Bash 没有 zip，用 PowerShell 压缩
          powershell -NoProfile -Command "Compress-Archive -Path '$OUT/*' -DestinationPath 'build/GitHubManager-runnable.zip' -Force"
          echo "已生成：build/GitHubManager-runnable.zip"

      - name: 上传可运行 jar 包（无需安装即可运行）
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GitHubManager-Windows-Runnable
          path: ${{ steps.locate.outputs.dir }}/build/GitHubManager-runnable.zip
          if-no-files-found: ignore
          retention-days: 30

      # ------------------------------------------------------------------
      # 8. 编译失败时，把 Kotlin 报错单独摘出来，省得翻几百行日志
      # ------------------------------------------------------------------
      - name: 输出 Kotlin 编译错误
        if: failure()
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          echo "========== e: 开头的编译错误 =========="
          $CMD --no-daemon --console=plain compileKotlin 2>&1 | grep -E "^e: " | head -40
          echo "========== 依赖解析错误 =========="
          $CMD --no-daemon --console=plain compileKotlin 2>&1 | grep -iE "Could not (resolve|find)|Couldn't resolve|not found" | head -20
