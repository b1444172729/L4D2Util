name: Build Windows App

# 自动触发：只要往仓库推送任何内容就构建（不限分支、不限文件）。
#
# 之前用的是 paths 过滤（只监听 .zip / .kt / .kts 等），
# 结果经常出现"明明推了东西却不触发"的情况——paths 过滤对
# 网页端上传、合并提交、以及某些客户端的判定并不总是可靠。
# 现在去掉过滤，任何 push 都触发，最省事。
#
# 另外保留了手动触发，方便不改代码直接重跑。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 必须是 Windows：Compose Desktop 的 exe / msi 走 jpackage 打包，
    # 只能在目标平台上生成，Linux / macOS 运行器出不来。
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # Windows 默认代码页不是 UTF-8，不强制的话源码里的中文可能变乱码
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      # 让 jpackage 用 UTF-8 读 build/compose/tmp/*.args.txt。
      # 参数文件里含中文应用名（Github 管理器），若按平台默认字符集读会抛
      # MalformedInputException: Input length = 1，在解析参数阶段就崩。
      #
      # ⚠ 之前用 JDK_TOOL_OPTIONS 加 -Dsun.jnu.encoding=UTF-8 是无效的：
      # sun.jnu.encoding 由 JVM 启动时按系统区域设置决定，命令行 -D 覆盖不了
      # （实测加了 -Dfile.encoding=UTF-8 后它仍是平台值）。所以改成覆盖面更广的
      # JAVA_TOOL_OPTIONS，并配合下面「强制 UTF-8 系统代码页」从根上解决。
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. 解压并定位项目目录
      #    压缩包上传后不会自动解开，且里面还套了一层文件夹，
      #    所以这里先解压，再递归找到真正的 Gradle 项目根目录。
      # ------------------------------------------------------------------
      - name: 解压源码包并定位项目目录
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob nocaseglob
          zips=( *.zip )

          if [ ${#zips[@]} -gt 0 ]; then
            echo "发现 ${#zips[@]} 个压缩包：${zips[*]}"
            rm -rf _src && mkdir -p _src
            for z in "${zips[@]}"; do
              echo "解压：$z"
              if command -v unzip >/dev/null 2>&1; then
                unzip -q -o "$z" -d _src
              else
                # 兜底：Git Bash 万一没有 unzip，用 Python 的 zipfile
                python -m zipfile -e "$z" _src/
              fi
            done
            base="_src"
          else
            echo "未发现压缩包，假定仓库根目录就是项目"
            base="."
          fi

          # 递归查找：必须同时有 settings.gradle.kts 与 build.gradle.kts，
          # 避免误判到某个只有其一的子目录。
          dir=""
          while IFS= read -r hit; do
            cand="$(dirname "$hit")"
            if [ -f "$cand/build.gradle.kts" ] || [ -f "$cand/build.gradle" ]; then
              dir="$cand"
              break
            fi
          done < <(find "$base" -maxdepth 6 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print)

          if [ -z "$dir" ]; then
            echo "::error::未找到项目目录（需要同时含 settings.gradle.kts 与 build.gradle.kts）"
            echo "----- _src 目录树 -----"
            find "$base" -maxdepth 4 2>/dev/null | head -60
            exit 1
          fi

          echo "项目目录：$dir"
          echo "----- 目录内容 -----"
          ls -la "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 2. 环境：JDK 21（打包）+ 17（Kotlin toolchain）+ Gradle 8.7
      #
      #    ⚠ 必须用 21 打包：JDK 17 的 jpackage 不允许通过 --resource-dir
      #    覆盖「primary 本地化文件」MsiInstallerStrings_en.wxl。该能力是
      #    OpenJDK 8291978 在 JDK 20 才加入的。JDK 17 会无视我们注入的
      #    936 版 wxl、仍用内置 1252 版，WiX 于是报 LGHT0311（退出码 311）。
      #
      #    同时装 17 是因为 build.gradle.kts 里写死了 jvmToolchain(17)，
      #    setup-java 多版本会导出 JAVA_HOME_17_X64，Gradle 自动探测得到。
      #    第一个版本（21）成为默认 JAVA_HOME，jpackage 用的是它。
      # ------------------------------------------------------------------
      - name: 安装 JDK 21 与 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ------------------------------------------------------------------
      # 2.5 强制 UTF-8 系统代码页（中文应用名的关键，不做回退）
      #
      #     jpackage 读 @args.txt 用的是 sun.jnu.encoding，它跟随 Windows 系统
      #     ANSI 代码页（ACP），且无法通过 -D 命令行覆盖。windows-latest 是
      #     en-US 区域设置，ACP=Cp1252，遇到 UTF-8 中文字节就抛
      #     MalformedInputException: Input length = 1。
      #
      #     把 ACP 设为 65001 后，之后新启动的 java / jpackage 进程都会拿到
      #     UTF-8 的 sun.jnu.encoding，中文 --name 才能被正确读出来。
      #     这比之前靠环境变量去猜要确定得多：改的是源头，不是读取方。
      # ------------------------------------------------------------------
      - name: 强制 UTF-8 系统代码页
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage'
          try {
            Set-ItemProperty -Path $key -Name 'ACP'   -Value '65001'
            Set-ItemProperty -Path $key -Name 'OEMCP' -Value '65001'
            Set-ItemProperty -Path $key -Name 'MACCP' -Value '65001'
          } catch {
            Write-Host "::error::无法把系统代码页设为 UTF-8：$($_.Exception.Message)"
            Write-Host "中文应用名需要 UTF-8 代码页，此处不允许降级，直接失败"
            exit 1
          }
          Write-Host "系统 ANSI 代码页 ACP = $((Get-ItemProperty -Path $key -Name ACP).ACP)"

      # 诊断：打印 JVM 实际拿到的三个编码属性，确认 sun.jnu.encoding 已是 UTF-8
      - name: 验证 JVM 编码设置
        shell: bash
        run: |
          echo "========== JDK 编码属性（sun.jnu.encoding 必须为 UTF-8）=========="
          java -XshowSettings:properties -version 2>&1 | grep -iE 'file.encoding|native.encoding|sun.jnu.encoding' || true

      # ------------------------------------------------------------------
      # 3. 准备 WiX（生成 exe / msi 安装包需要）
      #    windows-latest 镜像一般自带 WiX；即便没有，Compose 插件也会
      #    自动下载 wix311。这一步只是把预装路径显式加进 PATH，尽力而为。
      # ------------------------------------------------------------------
      - name: 准备 WiX 工具集
        shell: pwsh
        continue-on-error: true
        run: |
          $wix = $env:WIX
          if ($wix) {
            $wix = $wix.TrimEnd('\', '/')
            if (Test-Path (Join-Path $wix 'bin')) {
              (Join-Path $wix 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "已把预装 WiX 加入 PATH：$(Join-Path $wix 'bin')"
            }
          } else {
            Write-Host "未检测到预装 WiX，交由 Compose 插件自动下载"
          }

      # ------------------------------------------------------------------
      # 3.5 修复 WiX 中文应用名的 311 错误（关键）
      #
      #     jpackage 打 exe 时内部先用 WiX 生成一个 MSI。它固定用
      #     -cultures:en-us + MsiInstallerStrings_en.wxl，而该 wxl 里写死
      #     Codepage="1252"。MSI 数据库代码页 1252 装不下中文 ProductName，
      #     light.exe 于是报 LGHT0311（退出码 311）：
      #       "A string was provided with characters that are not available
      #        in the specified database code page '1252'."
      #
      #     解法：把该 wxl 的 Codepage 改成 936（GBK，能表示中文），
      #     通过 jpackage 的 --resource-dir 覆盖机制注入。
      #     wxl 正文从 JDK 自带的 lib/modules 里用 jimage 原样提取，
      #     只替换一个属性值，绝不丢任何本地化字符串（否则会报 LGHT0102）。
      #
      #     ⚠ 该覆盖只在 JDK 20+ 生效，所以上面必须装 JDK 21。
      #
      #     注入时机用 Gradle init script 挂在 packageExe / packageMsi 的
      #     doFirst：此时 Compose 的资源目录已就绪、jpackage 还没启动。
      # ------------------------------------------------------------------
      - name: 准备 WiX 中文代码页资源
        shell: pwsh
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'wix936'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $jimage  = Join-Path $env:JAVA_HOME 'bin/jimage.exe'
          $modules = Join-Path $env:JAVA_HOME 'lib/modules'

          # 先按文件名过滤提取；不支持 --include 或没命中就全量提取
          & $jimage extract "--include=regex:.*MsiInstallerStrings.*" --dir $work $modules 2>$null
          $hit = Get-ChildItem -Path $work -Recurse -Filter 'MsiInstallerStrings_en.wxl' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hit) {
            Write-Host "--include 未命中，改用全量 jimage extract"
            & $jimage extract --dir $work $modules
            if ($LASTEXITCODE -ne 0) { throw 'jimage extract 失败' }
            $hit = Get-ChildItem -Path $work -Recurse -Filter 'MsiInstallerStrings_en.wxl' | Select-Object -First 1
          }
          if (-not $hit) { throw 'JDK 里没有找到 MsiInstallerStrings_en.wxl' }
          Write-Host "JDK 内置 wxl：$($hit.FullName)"

          $text = [System.IO.File]::ReadAllText($hit.FullName, [System.Text.Encoding]::UTF8)
          $patched = $text -replace 'Codepage="1252"', 'Codepage="936"'
          if ($patched -eq $text) {
            Write-Host "wxl 头部："
            Write-Host ($text.Substring(0, [Math]::Min(400, $text.Length)))
            throw 'wxl 里没有 Codepage="1252"，无法改代码页'
          }
          $out = Join-Path $work 'MsiInstallerStrings_en.wxl'
          [System.IO.File]::WriteAllText($out, $patched, (New-Object System.Text.UTF8Encoding($false)))
          Select-String -Path $out -Pattern 'Codepage=' | ForEach-Object { Write-Host "已生成：$($_.Line.Trim())" }

          # Gradle init script：把 936 版 wxl 注入 Compose 的 --resource-dir
          $wxlWin = $out.Replace('\', '/')
          $init = Join-Path $work 'inject.gradle'
          @"
          gradle.projectsEvaluated {
            rootProject.tasks.matching { it.name == 'packageExe' || it.name == 'packageMsi' }.configureEach { t ->
              t.doFirst {
                def res = new File(t.project.buildDir, 'compose/tmp/resources')
                res.mkdirs()
                def src = new File('$wxlWin')
                if (!src.exists()) throw new GradleException('[wix936] missing ' + src)
                def dst = new File(res, 'MsiInstallerStrings_en.wxl')
                dst.setText(src.getText('UTF-8'), 'UTF-8')
                println '[wix936] injected 936 wxl -> ' + dst
                def cp = dst.getText('UTF-8').find(/Codepage="[^"]*"/)
                println '[wix936] resource-dir wxl codepage -> ' + cp
              }
            }
          }
          "@ | Set-Content -Path $init -Encoding UTF8
          Write-Host "init script：$init"

      # ------------------------------------------------------------------
      # 4. 打包 exe（主产物，必须成功）
      #    源码包里没有 gradlew，所以直接用已安装的 gradle。
      # ------------------------------------------------------------------
      - name: 打包 exe
        id: pkgexe
        # ⚠ 必须 continue-on-error：否则这一步失败会让后面「校验产物」
        # 和「上传安装包」被整段跳过，即使手工兜底产出了 exe 也传不上去。
        # 真正的硬性关卡在「校验产物」里（产物存在 + 英文名硬检查）。
        # 不再有「自动回退英文」这一步。
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          echo "使用命令：$CMD"
          # --info：jpackage 失败时 Gradle 默认只报「exit code 1」，
          # 加 --info 才能看到 jpackage 的完整命令行与部分内部输出
          # -I：注入 936 代码页 wxl，让 WiX 能写中文 ProductName
          INIT="$RUNNER_TEMP/wix936/inject.gradle"
          $CMD --no-daemon --console=plain --info -I "$INIT" packageExe

      # ------------------------------------------------------------------
      # 5. 打包 msi（可选，失败不影响整体）
      #    与 exe 共用同一份 build.gradle.kts，应用名必然一致。
      # ------------------------------------------------------------------
      - name: 打包 msi
        id: msi
        shell: bash
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          INIT="$RUNNER_TEMP/wix936/inject.gradle"
          $CMD --no-daemon --console=plain -I "$INIT" packageMsi

      # ------------------------------------------------------------------
      # 6. 手工 jpackage 兜底（packageExe 失败时才跑）
      #
      #    Compose 插件把 --resource-dir 指向它自己的临时目录，任务结束就
      #    清理；这里完全绕过插件：先 createDistributable 拿到 app 镜像，
      #    再用 --app-image 直接调 jpackage，--resource-dir 指向我们自己
      #    的独立目录（不会被清理），确保 936 wxl 一定能被读到。
      #
      #    --app-image 模式下不需要 --input / --main-jar / --runtime-image，
      #    app 镜像里已经包含完整运行时与启动器。
      # ------------------------------------------------------------------
      - name: 手工 jpackage 兜底（中文应用名）
        id: manual
        if: steps.pkgexe.outcome == 'failure'
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat

          echo "===== 生成可分发 app 镜像 ====="
          $CMD --no-daemon --console=plain createDistributable
          # ⚠ createDistributable 产出的是 .../main/app/<应用名>/ 目录，
          #    launcher exe 与 .cfg 在 <应用名>/ 里。外层 main/app/ 只是容器，
          #    把它直接喂给 --app-image 会找不到启动器。
          APP=""
          while IFS= read -r exe; do
            APP=$(dirname "$exe")
            break
          done < <(find build/compose/binaries/main/app -maxdepth 2 -type f -name '*.exe' -print)
          if [ -z "$APP" ]; then echo "::error::没找到 app 镜像里的启动器"; exit 1; fi
          echo "app 镜像（含启动器）：$APP"
          ls -la "$APP"

          RES="$RUNNER_TEMP/wix936/res"
          mkdir -p "$RES"
          cp "$RUNNER_TEMP/wix936/MsiInstallerStrings_en.wxl" "$RES/"
          echo "resource-dir：$RES"
          grep -o 'Codepage="[^"]*"' "$RES/MsiInstallerStrings_en.wxl" || true

          JP="$JAVA_HOME/bin/jpackage.exe"
          [ -f "$JP" ] || JP="jpackage"
          "$JP" --version

          COMMON=(
            --name "Github 管理器"
            --app-image "$APP"
            --resource-dir "$RES"
            --icon app-icon.ico
            --win-shortcut --win-menu
            --win-menu-group "Github 管理器"
            --win-dir-chooser
            --app-version "1.0.0"
            --vendor "GitHubManager"
            --description "GitHub Repository Manager (Desktop)"
            --copyright "Copyright (c) 2026 GitHubManager"
            --win-upgrade-uuid "b6f2f0a4-3f6d-4a2e-9a71-0f7f2c8e5d31"
            --verbose
          )

          echo "===== 手工打 exe ====="
          DEST=build/compose/binaries/main/exe
          mkdir -p "$DEST"
          "$JP" --type exe "${COMMON[@]}" --dest "$DEST"

          echo "===== 手工打 msi ====="
          DEST2=build/compose/binaries/main/msi
          mkdir -p "$DEST2"
          "$JP" --type msi "${COMMON[@]}" --dest "$DEST2" || true

          echo "===== 产物 ====="
          find build/compose/binaries -type f \( -name '*.exe' -o -name '*.msi' \) -print

      # ------------------------------------------------------------------
      # 7. 校验并上传（必须先上传，再跑兜底）
      #
      #    ⚠ 顺序很重要：之前把 if: always() 的兜底步骤放在上传之前，
      #    结果兜底步骤自己失败（exit 127），把后面的上传全部跳过了——
      #    exe / msi 明明打出来了却没上传。现在上传排在兜底之前。
      #
      #    另外注意产物目录名：Compose Multiplatform 1.6.11 输出在
      #    build/compose/binaries/main/，不是 main-release/，所以用 ** 通配。
      #
      #    ⚠ 更重要：必须把「安装包」和「app-image 启动器」分开。
      #    main/app/<应用名>/<应用名>.exe 只有几百 KB，是 launcher，
      #    依赖同目录的 .cfg 与 app/ 子目录；单独交付必然报
      #    "Error opening ...cfg file. No such file or directory"。
      #    校验只认 exe/ 与 msi/ 下 >10MB 的文件，上传路径同步收窄。
      # ------------------------------------------------------------------
      - name: 校验产物
        id: verify
        if: always() && steps.locate.outputs.dir != ''
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail

          # 先把所有 exe/msi 连大小列出来，一眼分清「安装包」与「启动器」
          echo "===== build/compose/binaries 下所有 exe / msi ====="
          while IFS= read -r f; do
            sz=$(stat -c %s "$f" 2>/dev/null || echo '?')
            echo "  ${sz} 字节  $f"
          done < <(find build/compose/binaries -type f \( -name '*.exe' -o -name '*.msi' \) -print 2>/dev/null)

          # ⚠ 关键：绝对不能用 build/compose/binaries/**/*.exe 当安装包。
          #    createDistributable 会在 main/app/<应用名>/ 里放一个几百 KB 的
          #    launcher，它必须配套同目录的 .cfg 和 app/ 子目录才能运行。
          #    把它单独传上去，用户双击就会报
          #      Error opening "...\app\<应用名>.cfg" file. No such file or directory
          #    这正是「476 KB 装不上」的原因。
          #
          #    真正的安装包只在 exe/ 或 msi/ 目录里，且自带 JRE，必然 >10 MB。
          found=$(find build/compose/binaries/*/exe build/compose/binaries/*/msi \
                    -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' \) \
                    -size +10M -print 2>/dev/null || true)

          if [ -z "$found" ]; then
            echo "::error::没有生成真正的安装包（exe/ 或 msi/ 目录下 >10MB 的文件）"
            echo "   app-image 里的启动器不是安装包，不能单独交付。"
            echo "----- build/compose/binaries 目录树 -----"
            find build/compose/binaries -maxdepth 4 2>/dev/null | head -40
            exit 1
          fi
          echo "✅ 安装包清单："
          echo "$found"

          # 强制中文应用名：只要产物文件名里出现英文名，就判定未生效并失败。
          # 绝不允许静默降级成 GitHubManager 混进 Artifacts。
          if echo "$found" | grep -q 'GitHubManager'; then
            echo "::error::产物文件名里出现英文名 GitHubManager，说明中文应用名未生效"
            echo "$found"
            exit 1
          fi
          echo "✅ 产物均使用中文应用名"

      - name: 上传安装包
        if: always() && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GitHubManager-Windows
          # 只收 exe/ 和 msi/ 两个安装包目录。
          # **/*.exe 会误收 main/app/<应用名>/ 里的 launcher（几百 KB），
          # 单独传上去就是「装不上、报 .cfg 找不到」的那个文件。
          path: |
            ${{ steps.locate.outputs.dir }}/build/compose/binaries/**/exe/*.exe
            ${{ steps.locate.outputs.dir }}/build/compose/binaries/**/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------
      # 8. 以下全部是兜底：只有打包失败/无论如何都不影响主产物时才跑
      #    每个都带 continue-on-error，绝不能因为它们失败而拖累主流程
      # ------------------------------------------------------------------
      - name: 输出 jpackage 错误日志
        if: failure()
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          echo "========== jpackage 日志文件清单 =========="
          find build/compose/logs -type f 2>/dev/null | head -20
          echo
          for f in $(find build/compose/logs -type f -name '*err.txt' 2>/dev/null | head -5); do
            echo "========== [STDERR] $f =========="
            cat "$f"
            echo
          done
          for f in $(find build/compose/logs -type f -name '*out.txt' 2>/dev/null | head -5); do
            echo "========== [STDOUT] $f =========="
            tail -60 "$f"
            echo
          done
          echo "========== jpackage 参数文件 =========="
          for f in $(find build/compose/tmp -type f -name '*.args.txt' 2>/dev/null | head -5); do
            echo "--- $f ---"
            cat "$f"
            echo
          done

          echo "========== 参数文件非 ASCII 字节扫描 =========="
          echo "（若这里不是 0，说明 jpackage 会因 MalformedInputException 解析失败）"
          for f in $(find build/compose/tmp -type f -name '*.args.txt' 2>/dev/null); do
            n=$(LC_ALL=C tr -dc '\200-\377' < "$f" | wc -c)
            echo "$f -> 非ASCII字节数: $n"
          done

          echo "========== resource-dir 里的 wxl ========="
          echo "（注意：Compose 任务结束后会清理该临时目录，这里为空不代表没注入；"
          echo "  以打包日志里 [wix936] resource-dir wxl codepage -> 那一行为准）"
          for f in $(find build/compose/tmp/resources -name '*.wxl' 2>/dev/null); do
            echo "--- $f ---"
            grep -o 'Codepage="[^"]*"' "$f" || true
          done

          echo "========== jpackage 临时目录里的 wxl（WiX 实际读到的那份）=========="
          for d in $(find "$LOCALAPPDATA/Temp" -maxdepth 1 -type d -name 'jdk.jpackage*' 2>/dev/null | head -3); do
            for f in $(find "$d/config" -name '*.wxl' 2>/dev/null); do
              echo "--- $f ---"
              grep -o 'Codepage="[^"]*"' "$f" || true
            done
          done

      - name: 兜底生成可运行程序目录
        if: failure()
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          $CMD --no-daemon --console=plain createDistributable || true
          APPDIR=$(find build/compose/binaries -maxdepth 3 -type d -name 'app' | head -1)
          if [ -n "$APPDIR" ]; then
            # 注意：windows-2025 镜像的 Git Bash 里没有 zip 命令，
            # 用 PowerShell 的 Compress-Archive（Windows 运行器必带）代替。
            powershell -NoProfile -Command "Compress-Archive -Path '$APPDIR/*' -DestinationPath 'build/compose/binaries/GitHubManager-app.zip' -Force"
            echo "已生成 app 压缩包：$APPDIR"
          else
            echo "::warning::没找到 app 目录"
          fi

      - name: 上传可运行程序目录（兜底）
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GitHubManager-Windows-AppDir
          path: ${{ steps.locate.outputs.dir }}/build/compose/binaries/GitHubManager-app.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: 生成可运行 jar 包（终极兜底）
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          $CMD --no-daemon --console=plain jar || true

          OUT=build/GitHubManager-runnable
          rm -rf "$OUT" && mkdir -p "$OUT/lib"

          # 主 jar
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -1)
          if [ -z "$JAR" ]; then echo "::warning::没找到主 jar，跳过兜底产物"; exit 0; fi
          cp "$JAR" "$OUT/GitHubManager.jar"
          echo "主 jar：$JAR"

          # 运行时依赖
          $CMD --no-daemon --console=plain -q printRuntimeClasspath 2>/dev/null > /tmp/cp.txt || true
          if [ -s /tmp/cp.txt ]; then
            tr ':' '\n' < /tmp/cp.txt | grep '\.jar$' | while read -r j; do
              [ -f "$j" ] && cp "$j" "$OUT/lib/" || true
            done
          fi

          cat > "$OUT/运行.bat" <<'BAT'
          @echo off
          chcp 65001 >nul
          java -version >nul 2>&1 || (echo 需要先安装 JDK 17：https://adoptium.net/ & pause & exit /b 1)
          java -cp "GitHubManager.jar;lib/*" com.githubmanager.desktop.MainKt
          pause
          BAT

          # 同样：Git Bash 没有 zip，用 PowerShell 压缩
          powershell -NoProfile -Command "Compress-Archive -Path '$OUT/*' -DestinationPath 'build/GitHubManager-runnable.zip' -Force"
          echo "已生成：build/GitHubManager-runnable.zip"

      - name: 上传可运行 jar 包（无需安装即可运行）
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GitHubManager-Windows-Runnable
          path: ${{ steps.locate.outputs.dir }}/build/GitHubManager-runnable.zip
          if-no-files-found: ignore
          retention-days: 30

      # ------------------------------------------------------------------
      # 8. 编译失败时，把 Kotlin 报错单独摘出来，省得翻几百行日志
      # ------------------------------------------------------------------
      - name: 输出 Kotlin 编译错误
        if: failure()
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          CMD=gradle
          command -v gradle >/dev/null 2>&1 || CMD=gradle.bat
          echo "========== e: 开头的编译错误 =========="
          $CMD --no-daemon --console=plain compileKotlin 2>&1 | grep -E "^e: " | head -40
          echo "========== 依赖解析错误 =========="
          $CMD --no-daemon --console=plain compileKotlin 2>&1 | grep -iE "Could not (resolve|find)|Couldn't resolve|not found" | head -20
