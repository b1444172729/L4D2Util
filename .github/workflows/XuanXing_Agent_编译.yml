# ============================================================================
# 玄星 XuanXing_Agent 编译脚本（GitHub Actions，修复版 v3）
#
# 放置：仓库根目录 .github/workflows/ 下，文件名任意 .yml
# 触发：Actions -> "玄星编译APK" -> Run workflow；或 push 到 main/master
# 产物：运行页底部 Artifacts -> XuanXing_Agent-APK-*.zip
#       app-universal-*.apk 为通用包，所有手机都能装（推荐）
#
# 支持的两种仓库内容（任选其一，脚本自动识别）：
#   A. 直接把 XuanXing_Agent.zip 上传到仓库根目录 —— 脚本会自动解压并展平
#   B. 把 zip 内全部文件（含隐藏文件）解压后上传到仓库根目录
#
# 修复记录：
#   v2 (run 45410600223)：移除 setup-node 的 pnpm 缓存输入，避免
#       "Some specified paths were not resolved" 直接终止 job。
#   默认构建类型：release（R8 + Baseline Profile，运行最流畅）。
#   如需 debug 包，在 Run workflow 时手动把 build_type 选成 debug。
#
#   v3 (run 45412426592)：日志显示仓库根目录只有
#       .git / .github / XuanXing_Agent.zip —— 源码整个以 zip 上传、未解压。
#       新增「自动解压源码 zip」逻辑；同时兼容"解压后多套一层目录"的情形；
#       修正 chmod +x gradlew 的条件写反。
# ============================================================================
name: 玄星编译APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型（默认 release，运行最流畅；未配密钥时自动回退 debug 签名，可直接安装）"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      upload_release:
        description: "同时发布到 GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write

concurrency:
  group: xuanxing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 XuanXing_Agent
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      XUANXING_CN_MIRROR: "0"
      GRADLE_OPTS: "-Dorg.gradle.console=plain"
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 关键：把源码摆到仓库根目录。三种来源都兼容：
      #   1) 只有 XuanXing_Agent.zip（整包上传）      -> 自动解压
      #   2) 解压后多套了一层 xuanxing-main/          -> 展平
      #   3) 已经正确解压到根目录                    -> 直接预检
      - name: 准备源码并预检完整性
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          echo "=== 检出后的根目录 ==="
          ls -a | head -40

          # 取层级最浅的 settings.gradle.kts。
          # 包内 build-logic/ 下也有同名文件，直接 find -maxdepth 3 会误命中，
          # 那样会把 build-logic 当成源码根目录展平。
          find_settings() {
            local base="$1" d c
            for d in 1 2 3 4 5; do
              c="$(find "$base" -maxdepth "$d" -type f -name settings.gradle.kts \
                    -not -path '*/.git/*' -print -quit)"
              if [ -n "$c" ]; then printf '%s\n' "$c"; return 0; fi
            done
            return 1
          }

          # 把子目录展平到仓库根目录：绝大多数条目是同文件系统的 mv（瞬时），
          # 只有仓库里已存在的目录（如 .github）需要合并。
          flatten_root() {
            local root="$1" item base
            case "$root" in .|./|"") return 0 ;; esac
            # 不让包内 workflow 覆盖/新增仓库里的编译脚本，避免重复触发
            find "$root/.github/workflows" -type f -name '*.yml' -delete 2>/dev/null || true
            shopt -s dotglob nullglob
            for item in "$root"/*; do
              base="${item##*/}"
              [ "$base" = ".git" ] && { rm -rf "$item"; continue; }
              if [ -e "$base" ]; then
                if [ -d "$item" ] && [ -d "$base" ]; then
                  cp -a "$item"/. "$base"/ 2>/dev/null || cp -r "$item"/. "$base"/
                fi
                rm -rf "$item"
              else
                mv "$item" .
              fi
            done
            shopt -u dotglob nullglob
            rmdir "$root" 2>/dev/null || true
          }

          # ---- 1) 仓库里只有源码 zip：直接解压到工作区（单次写，不再 tmp + cp 两遍）----
          if [ ! -f settings.gradle.kts ]; then
            ZIP=""
            if [ -f ./XuanXing_Agent.zip ]; then ZIP="./XuanXing_Agent.zip"; fi
            if [ -z "$ZIP" ]; then
              ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' \
                    -not -path './.git/*' -not -path './.github/*' -print -quit)"
            fi
            if [ -n "$ZIP" ]; then
              echo "=== 检测到源码压缩包 $ZIP，自动解压到工作区 ==="
              unzip -q -o "$ZIP" -d .
              C="$(find_settings .)"
              if [ -z "$C" ]; then
                echo "::error::$ZIP 内找不到 settings.gradle.kts，请确认上传的是 XuanXing_Agent.zip 完整源码包"
                exit 1
              fi
              flatten_root "$(dirname "$C")"
              echo "解压展平完成"
            fi
          fi

          # ---- 2) 兼容"手动解压后多套一层目录" ----
          if [ ! -f settings.gradle.kts ]; then
            C="$(find_settings .)"
            if [ -n "$C" ]; then flatten_root "$(dirname "$C")"; fi
          fi

          echo "=== 准备完成后的根目录 ==="
          ls -a | head -40

          # ---- 3) 完整性预检 ----
          missing=0
          for f in \
            settings.gradle.kts \
            build.gradle.kts \
            gradlew \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties \
            gradle/libs.versions.toml \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            workspace/build.gradle.kts \
            web-ui/package.json
          do
            if [ ! -f "$f" ]; then
              echo "缺失关键文件: $f"
              missing=1
            fi
          done

          if [ ! -f web-ui/pnpm-lock.yaml ]; then
            echo "提示：web-ui/pnpm-lock.yaml 缺失，依赖安装将改用非 frozen 模式"
          fi
          if [ -f gradlew ]; then chmod +x gradlew; fi

          if [ "$missing" = "1" ]; then
            echo "::error::仓库里找不到完整源码。请把 XuanXing_Agent.zip 上传到仓库根目录（脚本会自动解压），或把 zip 内【全部文件，含隐藏文件】解压后上传到根目录；不要只传部分文件。"
            exit 1
          fi
          echo "完整性预检通过"

      - name: 兜底补齐 material-color-utilities
        shell: bash
        run: |
          set -e
          DIR="material3/material-color-utilities/kotlin"
          if [ -n "$(find "$DIR" -name '*.kt' -type f 2>/dev/null | head -1)" ]; then
            echo "子模块源码已随包补齐，跳过（$(find "$DIR" -name '*.kt' -type f | wc -l) 个 .kt）"
            exit 0
          fi
          echo "子模块目录为空，从上游补齐..."
          TMP="$(mktemp -d)"
          git clone --depth 1 https://github.com/material-foundation/material-color-utilities.git "$TMP/mcu"
          mkdir -p "$(dirname "$DIR")"
          cp -r "$TMP/mcu/kotlin" "$DIR"
          [ -f "$TMP/mcu/LICENSE" ] && cp "$TMP/mcu/LICENSE" "material3/material-color-utilities/LICENSE"
          echo "补齐完成：$(find "$DIR" -name '*.kt' -type f | wc -l) 个 .kt"

      # AGP 9.2.1 / Gradle 9.4.1 需要 JDK 21
      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # pnpm 的 action 必须在 setup-node 之前
      - name: 安装 pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # 不配置 pnpm 缓存：v2 之前因找不到 lock 文件直接终止 job。
      # 依赖缓存由后面的 actions/cache 负责 Gradle 部分，pnpm 每次安装即可。
      - name: 安装 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # :web 的 preBuild 会跑前端构建，只跑 build 不跑 install，需提前装依赖
      - name: 安装 web-ui 依赖
        working-directory: web-ui
        shell: bash
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then
            echo "使用 frozen lockfile"
            pnpm install --frozen-lockfile
          else
            echo "未找到 pnpm-lock.yaml，改用非 frozen 模式自动生成"
            pnpm install --no-frozen-lockfile
          fi

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-xuanxing-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-xuanxing-

      # :workspace 启用 CMake 原生构建；AGP 自动下载 NDK 偶发包损坏，显式预装并重试。
      # bash {0} 接管 shell：默认 pipefail 下 yes 收到 SIGPIPE 退出 141 会误判失败。
      - name: 预装 SDK Platform 37 / NDK / CMake（带重试）
        shell: bash {0}
        env:
          NDK_VERSION: "28.2.13676358"
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ -z "${ANDROID_HOME:-}" ]; then
            echo "runner 无 sdkmanager，交给 AGP 自动下载"
            exit 0
          fi
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-37" "ndk;$NDK_VERSION" "cmake;3.22.1"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "--- $pkg attempt $attempt ---"
              if yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "$pkg"; then
                ok=1
                break
              fi
              case "$pkg" in
                ndk*) rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" ;;
              esac
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "$pkg 安装成功"
            else
              echo "$pkg 预装失败，交给 AGP 再试一次"
            fi
          done
          ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null || true
          exit 0

      - name: 依赖仓库连通性预检
        shell: bash
        run: |
          P=com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.4/com.google.devtools.ksp.gradle.plugin-2.3.4.pom
          for u in https://repo.maven.apache.org/maven2 https://plugins.gradle.org/m2 https://dl.google.com/dl/android/maven2; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -m 30 "$u/$P")"
          done

      - name: 编译 APK
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          case "$BUILD_TYPE" in
            release) TASK="assembleRelease" ;;
            *)       TASK="assembleDebug" ;;
          esac
          echo "Gradle task: $TASK"
          ./gradlew "$TASK" --stacktrace

      # ABI 拆分会产出 universal / arm64-v8a / x86_64 三个 APK
      - name: 整理产物与 SHA-256
        shell: bash
        run: |
          set -e
          OUT="app/build/outputs/apk/$BUILD_TYPE"
          mkdir -p dist
          cp "$OUT"/*.apk dist/
          ( cd dist && sha256sum ./*.apk > XuanXing_Agent-sha256.txt )
          ls -lh dist/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: XuanXing_Agent-APK-${{ env.BUILD_TYPE }}
          path: |
            dist/*.apk
            dist/XuanXing_Agent-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（可选）
        if: ${{ github.event.inputs.upload_release == 'true' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: XuanXing_Agent-${{ github.run_number }}
          name: XuanXing_Agent ${{ github.run_number }}
          prerelease: true
          body: |
            自动编译（commit `${{ github.sha }}`，类型 `${{ env.BUILD_TYPE }}`）

            - `app-universal-*.apk`：通用包，所有手机都能装（推荐）
            - `app-arm64-v8a-*.apk`：仅 64 位 ARM 手机
            - `app-x86_64-*.apk`：仅 x86_64 设备 / 模拟器

            安装前请先卸载不同签名的旧版本。
          files: dist/*
