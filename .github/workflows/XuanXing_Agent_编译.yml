# ============================================================================
# 玄星 XuanXing_Agent 编译脚本（GitHub Actions，修复版）
#
# 放置：仓库根目录 .github/workflows/ 下，文件名任意 .yml
# 触发：Actions -> "玄星编译APK" -> Run workflow；或 push 到 main/master
# 产物：运行页底部 Artifacts -> XuanXing_Agent-APK-*.zip
#       app-universal-*.apk 为通用包，所有手机都能装（推荐）
#
# 修复记录（针对 run 45410600223 日志）：
#   1. setup-node 移除 pnpm 缓存的两项输入（cache / cache-dependency-path）。
#      该配置在 web-ui/pnpm-lock.yaml 不存在时会抛
#      "Some specified paths were not resolved, unable to cache dependencies."
#      并以 error 直接终止 job —— 原日志卡在第 6 步，Gradle 根本没跑。
#   2. 新增「定位并展平源码根目录 + 完整性预检」：
#      兼容 zip 解压后多套一层 xuanxing-main/ 的情形，并对缺失关键文件明确报错。
#   3. pnpm install 对缺失 lock 文件做兜底（--no-frozen-lockfile）。
#   4. checkout / setup-java / setup-node 升级 v5，消除 Node.js 20 弃用警告。
# ============================================================================
name: 玄星编译APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型（debug 免密钥可直接安装；release 未配密钥时自动回退 debug 签名）"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      upload_release:
        description: "同时发布到 GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write

concurrency:
  group: xuanxing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 XuanXing_Agent
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      XUANXING_CN_MIRROR: "0"
      GRADLE_OPTS: "-Dorg.gradle.console=plain"
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 关键：把源码定位到仓库根目录，并对缺失文件给出可读报错。
      # 兼容两种常见上传失误：多套一层 xuanxing-main/、或网页上传漏文件。
      - name: 定位源码根目录并预检完整性
        shell: bash
        run: |
          set -e
          if [ ! -f settings.gradle.kts ]; then
            CAND="$(find . -maxdepth 3 -type f -name settings.gradle.kts -not -path './.git/*' -print -quit)"
            if [ -n "$CAND" ]; then
              ROOT="$(dirname "$CAND")"
              echo "源码位于子目录 $ROOT，展平到仓库根目录"
              cp -a "$ROOT"/. .
              rm -rf "$ROOT"
            fi
          fi

          echo "根目录概览："
          ls -a | head -40

          missing=0
          for f in \
            settings.gradle.kts \
            build.gradle.kts \
            gradlew \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties \
            gradle/libs.versions.toml \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            workspace/build.gradle.kts \
            web-ui/package.json
          do
            if [ ! -f "$f" ]; then
              echo "缺失关键文件: $f"
              missing=1
            fi
          done

          if [ ! -f web-ui/pnpm-lock.yaml ]; then
            echo "提示：web-ui/pnpm-lock.yaml 缺失，依赖安装将改用非 frozen 模式"
          fi
          if [ ! -f gradlew ]; then chmod +x gradlew 2>/dev/null || true; fi

          if [ "$missing" = "1" ]; then
            echo "::error::仓库源码不完整。请把 XuanXing_Agent.zip 内【全部文件（含隐藏文件）】解压后上传到仓库根目录，不要只传部分文件、也不要多套一层文件夹。"
            exit 1
          fi
          echo "完整性预检通过"

      # 源码包已把 44 个 .kt 作为普通文件补齐；仅在确实缺失时从上游兜底
      - name: 兜底补齐 material-color-utilities
        shell: bash
        run: |
          set -e
          DIR="material3/material-color-utilities/kotlin"
          if [ -n "$(find "$DIR" -name '*.kt' -type f 2>/dev/null | head -1)" ]; then
            echo "子模块源码已随包补齐，跳过（$(find "$DIR" -name '*.kt' -type f | wc -l) 个 .kt）"
            exit 0
          fi
          echo "子模块目录为空，从上游补齐..."
          TMP="$(mktemp -d)"
          git clone --depth 1 https://github.com/material-foundation/material-color-utilities.git "$TMP/mcu"
          mkdir -p "$(dirname "$DIR")"
          cp -r "$TMP/mcu/kotlin" "$DIR"
          [ -f "$TMP/mcu/LICENSE" ] && cp "$TMP/mcu/LICENSE" "material3/material-color-utilities/LICENSE"
          echo "补齐完成：$(find "$DIR" -name '*.kt' -type f | wc -l) 个 .kt"

      # AGP 9.2.1 / Gradle 9.4.1 需要 JDK 21
      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # pnpm 的 action 必须在 setup-node 之前
      - name: 安装 pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # 不再配置 pnpm 缓存 —— 这是上一版 job 终止的直接原因。
      # 依赖缓存由后面的 actions/cache 负责 Gradle 部分，pnpm 每次安装即可。
      - name: 安装 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # :web 的 preBuild 会跑前端构建，只跑 build 不跑 install，需提前装依赖
      - name: 安装 web-ui 依赖
        working-directory: web-ui
        shell: bash
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then
            echo "使用 frozen lockfile"
            pnpm install --frozen-lockfile
          else
            echo "未找到 pnpm-lock.yaml，改用非 frozen 模式自动生成"
            pnpm install --no-frozen-lockfile
          fi

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-xuanxing-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-xuanxing-

      # :workspace 启用 CMake 原生构建；AGP 自动下载 NDK 偶发包损坏，显式预装并重试。
      # bash {0} 接管 shell：默认 pipefail 下 yes 收到 SIGPIPE 退出 141 会误判失败。
      - name: 预装 SDK Platform 37 / NDK / CMake（带重试）
        shell: bash {0}
        env:
          NDK_VERSION: "28.2.13676358"
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ -z "${ANDROID_HOME:-}" ]; then
            echo "runner 无 sdkmanager，交给 AGP 自动下载"
            exit 0
          fi
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-37" "ndk;$NDK_VERSION" "cmake;3.22.1"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "--- $pkg attempt $attempt ---"
              if yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "$pkg"; then
                ok=1
                break
              fi
              case "$pkg" in
                ndk*) rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" ;;
              esac
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "$pkg 安装成功"
            else
              echo "$pkg 预装失败，交给 AGP 再试一次"
            fi
          done
          ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null || true
          exit 0

      - name: 依赖仓库连通性预检
        shell: bash
        run: |
          P=com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.4/com.google.devtools.ksp.gradle.plugin-2.3.4.pom
          for u in https://repo.maven.apache.org/maven2 https://plugins.gradle.org/m2 https://dl.google.com/dl/android/maven2; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -m 30 "$u/$P")"
          done

      - name: 编译 APK
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          case "$BUILD_TYPE" in
            release) TASK="assembleRelease" ;;
            *)       TASK="assembleDebug" ;;
          esac
          echo "Gradle task: $TASK"
          ./gradlew "$TASK" --stacktrace

      # ABI 拆分会产出 universal / arm64-v8a / x86_64 三个 APK
      - name: 整理产物与 SHA-256
        shell: bash
        run: |
          set -e
          OUT="app/build/outputs/apk/$BUILD_TYPE"
          mkdir -p dist
          cp "$OUT"/*.apk dist/
          ( cd dist && sha256sum ./*.apk > XuanXing_Agent-sha256.txt )
          ls -lh dist/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: XuanXing_Agent-APK-${{ env.BUILD_TYPE }}
          path: |
            dist/*.apk
            dist/XuanXing_Agent-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（可选）
        if: ${{ github.event.inputs.upload_release == 'true' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: XuanXing_Agent-${{ github.run_number }}
          name: XuanXing_Agent ${{ github.run_number }}
          prerelease: true
          body: |
            自动编译（commit `${{ github.sha }}`，类型 `${{ env.BUILD_TYPE }}`）

            - `app-universal-*.apk`：通用包，所有手机都能装（推荐）
            - `app-arm64-v8a-*.apk`：仅 64 位 ARM 手机
            - `app-x86_64-*.apk`：仅 x86_64 设备 / 模拟器

            安装前请先卸载不同签名的旧版本。
          files: dist/*
