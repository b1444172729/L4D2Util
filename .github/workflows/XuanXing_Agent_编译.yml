# ============================================================================
# 玄星 XuanXing_Agent 编译脚本（GitHub Actions）
#
# 放置路径：把本文件放到仓库根目录的 .github/workflows/ 下，文件名任意 .yml
# 触发方式：GitHub 仓库 -> Actions -> "玄星编译APK" -> Run workflow
# 下载产物：本次运行页面底部 Artifacts -> XuanXing_Agent-APK-*.zip
#           app-universal-*.apk 是通用包，所有手机都能装（推荐）
#
# 针对 XuanXing_Agent.zip 源码快照适配：
#   - 包内 material-color-utilities 子模块已作为普通文件补齐，
#     因此不走 checkout 的 submodules: recursive（对纯文件快照是无效动作）；
#     另加兜底：若该目录为空（从 git archive / 原仓库 clone 的场景）自动补齐。
#   - 显式预装 platforms;android-37、NDK 28.2.13676358、cmake;3.22.1。
#   - 可选构建 debug / release；release 未配 keystore 时工程会自动回退 debug 签名。
# ============================================================================
name: 玄星编译APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型（debug 免密钥可直接安装；release 未配密钥时自动回退 debug 签名）"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      upload_release:
        description: "同时发布到 GitHub Release（需要 contents: write）"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write

concurrency:
  group: xuanxing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 XuanXing_Agent
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # settings.gradle.kts 默认开阿里云镜像，海外 runner 上会拿到坏数据导致插件解析失败
      XUANXING_CN_MIRROR: "0"
      GRADLE_OPTS: "-Dorg.gradle.console=plain"
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # XuanXing_Agent.zip 已把 44 个 .kt 作为普通文件补齐，正常情况下此步直接跳过
      - name: 兜底补齐 material-color-utilities
        shell: bash
        run: |
          DIR="material3/material-color-utilities/kotlin"
          if [ -n "$(find "$DIR" -name '*.kt' -type f 2>/dev/null | head -1)" ]; then
            echo "子模块源码已随包补齐，跳过"
            exit 0
          fi
          echo "子模块目录为空，从上游补齐..."
          TMP="$(mktemp -d)"
          git clone --depth 1 https://github.com/material-foundation/material-color-utilities.git "$TMP/mcu"
          mkdir -p "$(dirname "$DIR")"
          cp -r "$TMP/mcu/kotlin" "$DIR"
          [ -f "$TMP/mcu/LICENSE" ] && cp "$TMP/mcu/LICENSE" "material3/material-color-utilities/LICENSE"
          echo "补齐完成：$(find "$DIR" -name '*.kt' -type f | wc -l) 个 .kt"

      # AGP 9.2.1 / Gradle 9.4.1 需要 JDK 21
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # pnpm 的 action 必须放在 setup-node 之前，否则依赖缓存不生效
      - name: 安装 pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # :web 的 preBuild 会跑前端构建，只跑 build 不跑 install，需提前装依赖
      - name: 安装 web-ui 依赖
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-xuanxing-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-xuanxing-

      # :workspace 启用了 CMake 原生构建；AGP 自动下载 NDK 偶发包损坏且一次失败整轮报废，
      # 所以显式预装并重试。用 bash {0} 接管 shell：默认 pipefail 下 yes 收到 SIGPIPE
      # 退出 141 会把「安装成功」误判为失败。
      - name: 预装 SDK Platform 37 / NDK / CMake（带重试）
        shell: bash {0}
        env:
          NDK_VERSION: "28.2.13676358"
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ -z "${ANDROID_HOME:-}" ]; then
            echo "runner 无 sdkmanager，交给 AGP 自动下载"
            exit 0
          fi
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-37" "ndk;$NDK_VERSION" "cmake;3.22.1"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "--- $pkg attempt $attempt ---"
              if yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "$pkg"; then
                ok=1
                break
              fi
              case "$pkg" in
                ndk*) rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" ;;
              esac
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "$pkg 安装成功"
            else
              echo "$pkg 预装失败，交给 AGP 再试一次"
            fi
          done
          ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null || true
          exit 0

      - name: 依赖仓库连通性预检
        shell: bash
        run: |
          P=com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.4/com.google.devtools.ksp.gradle.plugin-2.3.4.pom
          for u in https://repo.maven.apache.org/maven2 https://plugins.gradle.org/m2 https://dl.google.com/dl/android/maven2; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -m 30 "$u/$P")"
          done

      - name: 编译 APK
        shell: bash
        run: |
          chmod +x gradlew
          case "$BUILD_TYPE" in
            release) TASK="assembleRelease" ;;
            *)       TASK="assembleDebug" ;;
          esac
          echo "Gradle task: $TASK"
          ./gradlew "$TASK" --stacktrace

      # ABI 拆分会产出 universal / arm64-v8a / x86_64 三个 APK
      - name: 整理产物与 SHA-256
        shell: bash
        run: |
          OUT="app/build/outputs/apk/$BUILD_TYPE"
          mkdir -p dist
          cp "$OUT"/*.apk dist/
          ( cd dist && sha256sum ./*.apk > XuanXing_Agent-sha256.txt )
          ls -lh dist/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: XuanXing_Agent-APK-${{ env.BUILD_TYPE }}
          path: |
            dist/*.apk
            dist/XuanXing_Agent-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（可选）
        if: ${{ github.event.inputs.upload_release == 'true' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: XuanXing_Agent-${{ github.run_number }}
          name: XuanXing_Agent ${{ github.run_number }}
          prerelease: true
          body: |
            自动编译（commit `${{ github.sha }}`，类型 `${{ env.BUILD_TYPE }}`）

            - `app-universal-*.apk`：通用包，所有手机都能装（推荐）
            - `app-arm64-v8a-*.apk`：仅 64 位 ARM 手机
            - `app-x86_64-*.apk`：仅 x86_64 设备 / 模拟器

            安装前请先卸载不同签名的旧版本。
          files: dist/*
