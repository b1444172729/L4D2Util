name: Build APK from sshsftp.zip

# 触发方式：
# 1. 推送 / PR（源码以 sshsftp.zip 形式放在仓库里）
# 2. 右上角 Actions → Run workflow 手动触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ---------------------------------------------------------------
      # 解压 sshsftp.zip 并定位真正的工程根目录
      # 兼容：zip 里可能多套了一层文件夹，脚本会向下查找 settings.gradle
      # ---------------------------------------------------------------
      - name: Unpack sshsftp.zip
        id: unpack
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          ZIP="$(find . -maxdepth 3 -type f -name 'sshsftp.zip' | head -n 1 || true)"
          if [ -z "${ZIP}" ]; then
            echo "::error::仓库里找不到 sshsftp.zip"
            exit 1
          fi
          echo "找到压缩包: ${ZIP}"

          rm -rf _src
          mkdir -p _src apks
          unzip -q -o "${ZIP}" -d _src

          # 自动剥掉外层目录：找 settings.gradle.kts（KTS），退化为 settings.gradle（Groovy）
          HIT="$(find _src \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1 || true)"
          if [ -z "${HIT}" ]; then
            echo "::error::解压后找不到 settings.gradle(.kts)"
            find _src -maxdepth 3 | head -n 40
            exit 1
          fi

          PROJ="$(dirname "${HIT}")"
          PROJ="${PROJ#./}"
          echo "工程根目录: ${PROJ}"
          echo "proj=${PROJ}" >> "$GITHUB_OUTPUT"

          if [ ! -d "${PROJ}/app" ]; then
            echo "::error::${PROJ}/app 不存在"
            find _src -maxdepth 3 | head -n 40
            exit 1
          fi

      # ---------------------------------------------------------------
      # 依赖仓库镜像：用 sed 直接改写 settings.gradle
      # 不走 ~/.gradle/init.d —— 那个 Groovy 脚本一旦有语法错误，
      # Gradle 启动即失败（之前踩过坑）；直接写进 settings 对
      # pluginManagement 同样有效。镜像只做加速，官方源保留在后面兜底。
      # ---------------------------------------------------------------
      - name: Inject mirror repositories
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          PROJ="${{ steps.unpack.outputs.proj }}"

          SETTINGS="${PROJ}/settings.gradle.kts"
          [ -f "$SETTINGS" ] || SETTINGS="${PROJ}/settings.gradle"
          echo "目标文件: $SETTINGS"

          if ! grep -q "maven.aliyun.com" "$SETTINGS"; then
            # 在每个 repositories { 之后插入阿里云镜像（GNU sed，\n 可换行）
            sed -i -E 's|^([[:space:]]*)repositories[[:space:]]*\{|\1repositories {\n\1    maven { setUrl("https://maven.aliyun.com/repository/google") }\n\1    maven { setUrl("https://maven.aliyun.com/repository/public") }|' "$SETTINGS"
          fi

          # 校验：确实写进去了才算成功，否则退回原样继续（官方源兜底）
          if grep -q "maven.aliyun.com" "$SETTINGS"; then
            echo "镜像注入成功"
          else
            echo "::warning::镜像注入失败，继续使用官方源"
          fi

          echo "--- 实际生效的 settings ---"
          cat "$SETTINGS"
          echo "--------------------------"

      # ---------------------------------------------------------------
      # Gradle：优先用工程自带的 Wrapper（锁定 8.7）；
      # 不可用或版本过低时下载 8.7（Gradle 4.x/7.x 搭配 JDK17 会直接崩）。
      # ---------------------------------------------------------------
      - name: Resolve Gradle
        id: gradle
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          PROJ="${{ steps.unpack.outputs.proj }}"

          # setup-java 可能只把 java 放进 PATH 而没设 JAVA_HOME，这里反推
          if [ -z "${JAVA_HOME:-}" ] && command -v java >/dev/null 2>&1; then
            JP="$(readlink -f "$(command -v java)" || true)"
            if [ -n "$JP" ]; then
              JH="$(dirname "$(dirname "$JP")")"
              [ -d "$JH" ] && export JAVA_HOME="$JH" || true
            fi
          fi
          [ -n "${JAVA_HOME:-}" ] && export PATH="$JAVA_HOME/bin:$PATH" || true
          echo "JAVA_HOME=${JAVA_HOME:-未设置}"
          java -version 2>&1 | head -n 3

          GRADLE_BIN=""
          if [ -f "${PROJ}/gradlew" ]; then
            chmod +x "${PROJ}/gradlew"
            chmod +x "${PROJ}/gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || true
            V="$(cd "$PROJ" && ./gradlew --version 2>/dev/null | grep -m1 '^Gradle' | awk '{print $2}' || true)"
            if [ -n "$V" ] && [ "${V%%.*}" -ge 8 ] 2>/dev/null; then
              GRADLE_BIN="$GITHUB_WORKSPACE/${PROJ}/gradlew"
              echo "使用工程 Wrapper: $GRADLE_BIN ($V)"
            else
              echo "Wrapper 不可用或版本过低（${V:-未知}）"
            fi
          fi

          if [ -z "$GRADLE_BIN" ]; then
            echo "准备 Gradle 8.7 ..."
            GV=8.7
            GD="$RUNNER_TEMP/gradle-$GV"
            rm -rf "$GD"
            mkdir -p "$RUNNER_TEMP/gradle-dl"
            DL="$RUNNER_TEMP/gradle-dl/gradle-$GV-bin.zip"
            rm -f "$DL"
            for URL in \
              "https://services.gradle.org/distributions/gradle-$GV-bin.zip" \
              "https://downloads.gradle.org/distributions/gradle-$GV-bin.zip" \
              "https://mirrors.tuna.tsinghua.edu.cn/gradle/gradle-$GV-bin.zip" ; do
              echo "  尝试: $URL"
              curl -fSL --retry 2 --connect-timeout 20 -o "$DL" "$URL" && [ -s "$DL" ] && break || rm -f "$DL"
            done
            if [ ! -s "$DL" ]; then
              echo "::error::Gradle 分发包下载失败"
              exit 1
            fi
            unzip -q -o "$DL" -d "$RUNNER_TEMP"
            [ -d "$GD" ] || GD="$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name "gradle-$GV*" | head -n 1)"
            GRADLE_BIN="$GD/bin/gradle"
            chmod +x "$GRADLE_BIN"
            echo "使用下载版 Gradle: $GRADLE_BIN"
          fi

          "$GRADLE_BIN" --version 2>&1 | head -n 6
          echo "bin=$GRADLE_BIN" >> "$GITHUB_OUTPUT"

      # ubuntu-latest 自带 Android SDK，通常只需补装缺失组件
      - name: Ensure Android SDK 34
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "缺 android-34，安装中 ..."
            mkdir -p "$ANDROID_HOME/licenses"
            printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
            printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --sdk_root="$ANDROID_HOME" \
              "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "已存在 android-34"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Build
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/${{ steps.unpack.outputs.proj }}"
          GRADLE_BIN="${{ steps.gradle.outputs.bin }}"
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"

          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8 -Xmx2048m"
          FLAGS="--no-daemon --stacktrace"

          set +e
          "$GRADLE_BIN" assembleRelease $FLAGS 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          echo "assembleRelease exit=$RC"

          if [ "$RC" -ne 0 ]; then
            echo "=========== What went wrong ==========="
            awk '/^FAILURE:|^What went wrong:/{p=1} p' "$LOG" | head -n 80
            echo "=========== Caused by ==========="
            grep -n "Caused by\|Could not\|Cannot\|not found\|Failed to\|error:" "$LOG" | head -n 40
            echo "=========== 日志末尾 ==========="
            tail -n 200 "$LOG"
            exit "$RC"
          fi

          set +e
          "$GRADLE_BIN" assembleDebug $FLAGS 2>&1 | tee -a "$LOG"
          echo "assembleDebug exit=${PIPESTATUS[0]}"
          set -e

      - name: Collect APKs
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p apks
          find "${{ steps.unpack.outputs.proj }}/app/build/outputs/apk" -type f -name '*.apk' \
            -exec cp {} apks/ \;
          echo "=== 产物 ==="
          ls -lh apks
          du -sh apks/*
          if [ -z "$(ls -A apks)" ]; then
            echo "::error::没有产出 APK"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 30
