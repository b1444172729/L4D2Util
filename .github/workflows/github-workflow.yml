name: Build APK from sshsftp.zip

# 触发方式：
# 1. 推送 / PR（源码以 sshsftp.zip 形式放在仓库里）
# 2. 右上角 Actions → Run workflow 手动触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        # 注意：不要加 cache: gradle —— 仓库根目录只有 sshsftp.zip，
        # 没有 gradle 文件，setup-java 的缓存探测会因找不到文件而失败。

      # ---------------------------------------------------------------
      # 解压 sshsftp.zip 并定位真正的工程根目录
      # 兼容：zip 里可能多套了一层文件夹，脚本会向下查找 settings.gradle
      # ---------------------------------------------------------------
      - name: Unpack sshsftp.zip
        id: unpack
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          ZIP="$(find . -maxdepth 3 -type f -name 'sshsftp.zip' | head -n 1 || true)"
          if [ -z "${ZIP}" ]; then
            echo "::error::仓库里找不到 sshsftp.zip"
            exit 1
          fi
          echo "找到压缩包: ${ZIP}"

          rm -rf _src
          mkdir -p _src apks
          unzip -q -o "${ZIP}" -d _src

          # 自动剥掉外层目录：找 settings.gradle.kts（KTS），退化为 settings.gradle（Groovy）
          HIT="$(find _src \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1 || true)"
          if [ -z "${HIT}" ]; then
            echo "::error::解压后找不到 settings.gradle(.kts)"
            find _src -maxdepth 3 | head -n 40
            exit 1
          fi

          PROJ="$(dirname "${HIT}")"
          PROJ="${PROJ#./}"
          echo "工程根目录: ${PROJ}"
          echo "proj=${PROJ}" >> "$GITHUB_OUTPUT"

          if [ ! -d "${PROJ}/app" ]; then
            echo "::error::${PROJ}/app 不存在"
            find _src -maxdepth 3 | head -n 40
            exit 1
          fi

      # ---------------------------------------------------------------
      # 依赖仓库镜像：用 sed 直接改写 settings.gradle
      # 不走 ~/.gradle/init.d —— 那个 Groovy 脚本一旦有语法错误，
      # Gradle 启动即失败（之前踩过坑）；直接写进 settings 对
      # pluginManagement 同样有效。镜像只做加速，官方源保留在后面兜底。
      # ---------------------------------------------------------------
      # ---------------------------------------------------------------
      # 仓库顺序：官方源优先，镜像仅作兜底。
      #
      # 教训：之前把阿里云镜像放在最前面，结果解析
      # org.jetbrains:annotations:23.0.0 时 aliyun/google 返回 502（Bad Gateway），
      # Gradle 对 5xx 不会自动回退到下一个仓库 —— 整个构建直接失败。
      #
      # GitHub Runner 直连 Google / Maven Central 又快又稳，
      # 所以这里确保官方源在最前；若源码里被注入过镜像，则移除或后置。
      # ---------------------------------------------------------------
      - name: Ensure official repositories first
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          PROJ="${{ steps.unpack.outputs.proj }}"

          SETTINGS="${PROJ}/settings.gradle.kts"
          [ -f "$SETTINGS" ] || SETTINGS="${PROJ}/settings.gradle"
          echo "目标文件: $SETTINGS"

          # 工程自带 settings 已含 google() / mavenCentral() / gradlePluginPortal()。
          # 只做一件事：把任何阿里云镜像行删掉，避免 502 中断构建。
          if grep -q "maven.aliyun.com" "$SETTINGS"; then
            sed -i -E '/maven\.aliyun\.com/d' "$SETTINGS"
            echo "已移除阿里云镜像（改用官方源，避免 502）"
          else
            echo "未检测到镜像，保持官方源"
          fi

          echo "--- 实际生效的 settings ---"
          cat "$SETTINGS"
          echo "--------------------------"

      # ---------------------------------------------------------------
      # Gradle：优先用工程自带的 Wrapper（锁定 8.7）；
      # 不可用或版本过低时下载 8.7（Gradle 4.x/7.x 搭配 JDK17 会直接崩）。
      # ---------------------------------------------------------------
      - name: Resolve Gradle
        id: gradle
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          PROJ="${{ steps.unpack.outputs.proj }}"

          # setup-java 可能只把 java 放进 PATH 而没设 JAVA_HOME，这里反推
          if [ -z "${JAVA_HOME:-}" ] && command -v java >/dev/null 2>&1; then
            JP="$(readlink -f "$(command -v java)" || true)"
            if [ -n "$JP" ]; then
              JH="$(dirname "$(dirname "$JP")")"
              [ -d "$JH" ] && export JAVA_HOME="$JH" || true
            fi
          fi
          [ -n "${JAVA_HOME:-}" ] && export PATH="$JAVA_HOME/bin:$PATH" || true
          echo "JAVA_HOME=${JAVA_HOME:-未设置}"
          java -version 2>&1 | head -n 3

          GRADLE_BIN=""
          if [ -f "${PROJ}/gradlew" ]; then
            chmod +x "${PROJ}/gradlew"
            chmod +x "${PROJ}/gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || true
            V="$(cd "$PROJ" && ./gradlew --version 2>/dev/null | grep -m1 '^Gradle' | awk '{print $2}' || true)"
            if [ -n "$V" ] && [ "${V%%.*}" -ge 8 ] 2>/dev/null; then
              GRADLE_BIN="$GITHUB_WORKSPACE/${PROJ}/gradlew"
              echo "使用工程 Wrapper: $GRADLE_BIN ($V)"
            else
              echo "Wrapper 不可用或版本过低（${V:-未知}）"
            fi
          fi

          if [ -z "$GRADLE_BIN" ]; then
            echo "准备 Gradle 8.7 ..."
            GV=8.7
            GD="$RUNNER_TEMP/gradle-$GV"
            rm -rf "$GD"
            mkdir -p "$RUNNER_TEMP/gradle-dl"
            DL="$RUNNER_TEMP/gradle-dl/gradle-$GV-bin.zip"
            rm -f "$DL"
            for URL in \
              "https://services.gradle.org/distributions/gradle-$GV-bin.zip" \
              "https://downloads.gradle.org/distributions/gradle-$GV-bin.zip" \
              "https://mirrors.tuna.tsinghua.edu.cn/gradle/gradle-$GV-bin.zip" ; do
              echo "  尝试: $URL"
              curl -fSL --retry 2 --connect-timeout 20 -o "$DL" "$URL" && [ -s "$DL" ] && break || rm -f "$DL"
            done
            if [ ! -s "$DL" ]; then
              echo "::error::Gradle 分发包下载失败"
              exit 1
            fi
            unzip -q -o "$DL" -d "$RUNNER_TEMP"
            [ -d "$GD" ] || GD="$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name "gradle-$GV*" | head -n 1)"
            GRADLE_BIN="$GD/bin/gradle"
            chmod +x "$GRADLE_BIN"
            echo "使用下载版 Gradle: $GRADLE_BIN"
          fi

          "$GRADLE_BIN" --version 2>&1 | head -n 6
          echo "bin=$GRADLE_BIN" >> "$GITHUB_OUTPUT"

      # ubuntu-latest 自带 Android SDK，通常只需补装缺失组件
      - name: Ensure Android SDK 34
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "缺 android-34，安装中 ..."
            mkdir -p "$ANDROID_HOME/licenses"
            printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
            printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --sdk_root="$ANDROID_HOME" \
              "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "已存在 android-34"
          fi
          ls "$ANDROID_HOME/platforms"

      # 关键 1：输出只重定向到文件，不用 | tee。
      # 之前 --stacktrace 产生海量输出经管道流向 GitHub 日志收集器，
      # 读端关闭后 Gradle 被 SIGPIPE 杀掉 → exit 141（掩盖了真实错误）。
      #
      # 关键 2：先编 Debug 再编 Release。
      # Debug 不开 R8 混淆/资源压缩，若它能过而 Release 挂，
      # 说明问题只在 proguard-rules.pro（R8 配置），与源码无关。
      # 两个都标 continue-on-error，保证一次运行拿到全部信息。
      - name: Build Debug
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          PROJ="${{ steps.unpack.outputs.proj }}"
          GRADLE_BIN="${{ steps.gradle.outputs.bin }}"
          LOG="$GITHUB_WORKSPACE/build-debug.log"
          : > "$LOG"

          echo "工程目录: $GITHUB_WORKSPACE/$PROJ"
          echo "Gradle: $GRADLE_BIN"
          cd "$GITHUB_WORKSPACE/$PROJ" || { echo "::error::cd 失败"; exit 1; }

          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8 -Xmx2048m"
          # runner 是 2 核，关闭并行 + Kotlin 进程内编译，降低内存峰值
          FLAGS="--no-daemon --console=plain -Dorg.gradle.parallel=false"
          FLAGS="$FLAGS -Dkotlin.compiler.execution.strategy=in-process"

          "$GRADLE_BIN" assembleDebug $FLAGS > "$LOG" 2>&1
          RC=$?
          echo "assembleDebug exit=$RC"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

          if [ "$RC" -ne 0 ]; then
            echo "########## [Debug] What went wrong ##########"
            awk '/^FAILURE:|^What went wrong:/{p=1} p' "$LOG" | head -n 60
            echo "########## [Debug] 关键错误行 ##########"
            grep -nE "Caused by|Could not|Cannot|not found|Failed to|error:|FAILED|Exception" "$LOG" | head -n 40
            echo "########## [Debug] 日志末尾 200 行 ##########"
            tail -n 200 "$LOG"
          else
            echo "Debug 构建成功"
          fi

      - name: Build Release
        id: build_release
        continue-on-error: true
        run: |
          set -o pipefail
          PROJ="${{ steps.unpack.outputs.proj }}"
          GRADLE_BIN="${{ steps.gradle.outputs.bin }}"
          LOG="$GITHUB_WORKSPACE/build-release.log"
          : > "$LOG"

          cd "$GITHUB_WORKSPACE/$PROJ" || { echo "::error::cd 失败"; exit 1; }

          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8 -Xmx2048m"
          FLAGS="--no-daemon --console=plain -Dorg.gradle.parallel=false"
          FLAGS="$FLAGS -Dkotlin.compiler.execution.strategy=in-process"

          "$GRADLE_BIN" assembleRelease $FLAGS > "$LOG" 2>&1
          RC=$?
          echo "assembleRelease exit=$RC"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

          if [ "$RC" -ne 0 ]; then
            echo "########## [Release] What went wrong ##########"
            awk '/^FAILURE:|^What went wrong:/{p=1} p' "$LOG" | head -n 60
            echo "########## [Release] 关键错误行 ##########"
            grep -nE "Caused by|Could not|Cannot|not found|Failed to|error:|FAILED|Exception|R8|ProGuard" "$LOG" | head -n 40
            echo "########## [Release] 日志末尾 200 行 ##########"
            tail -n 200 "$LOG"
          else
            echo "Release 构建成功"
          fi

      - name: Summarize
        run: |
          echo "Debug   rc = ${{ steps.build_debug.outputs.rc }}"
          echo "Release rc = ${{ steps.build_release.outputs.rc }}"
          if [ "${{ steps.build_debug.outputs.rc }}" = "0" ] && [ "${{ steps.build_release.outputs.rc }}" != "0" ]; then
            echo "########## 结论 ##########"
            echo "Debug 通过、Release 失败 ⇒ 失败原因在 R8/ProGuard 配置，源码本身可编译。"
          elif [ "${{ steps.build_debug.outputs.rc }}" != "0" ]; then
            echo "########## 结论 ##########"
            echo "Debug 也失败 ⇒ 源码/资源/依赖层面有问题，见上方 [Debug] 报错。"
          fi

      # 无论成功失败都上传完整构建日志，便于下载查看全部报错
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ github.workspace }}/build-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect APKs
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p apks
          find "${{ steps.unpack.outputs.proj }}/app/build/outputs/apk" -type f -name '*.apk' \
            -exec cp {} apks/ \; 2>/dev/null || true
          echo "=== 产物 ==="
          ls -lh apks 2>/dev/null || true
          du -sh apks/* 2>/dev/null || true
          if [ -z "$(ls -A apks 2>/dev/null)" ]; then
            echo "::error::没有产出任何 APK"
            exit 1
          fi

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/*.apk
          if-no-files-found: warn
          retention-days: 30
