name: Build NxShell (Windows x64)

# ============================================================
#  触发方式：
#   1. Actions 页面 -> Run workflow（手动，推荐）
#   2. git tag v1.0.0 && git push origin v1.0.0（自动发 Release）
#
#  仓库结构自适应，以下三种都能跑：
#    - 任意 *.zip（脚本自动解压，支持包内再套一层目录）
#    - nxshell-source/ 目录
#    - 源码平铺在仓库根
# ============================================================
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    # 必须 pin windows-2022！不能写 windows-latest。
    # windows-latest 已切到 Visual Studio 2026 (18.x)，node-gyp 12.0.x 及更早
    # 版本不认识该版本号，会报：
    #   gyp ERR! find VS unknown version "undefined"
    #   could not find a version of Visual Studio 2017 or newer
    # node-pty / serialport 是原生模块 -> 直接编译失败。
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      # 脚本解压 zip 需要 python；windows-2022 自带，此步确保版本可控
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 【关键修复】清除 NODE_OPTIONS
      # --openssl-legacy-provider 只适用于 Node 17+ (OpenSSL 3.0)。
      # Node 16 使用 OpenSSL 1.1.1，不认识该参数，会直接拒绝启动：
      #   "--openssl-legacy-provider is not allowed in NODE_OPTIONS"
      # 若环境已在别处注入该变量，此处强制清空。
      - name: Clear NODE_OPTIONS
        shell: bash
        run: |
          echo "NODE_OPTIONS=" >> $GITHUB_ENV
          echo "before: [$NODE_OPTIONS]"
          unset NODE_OPTIONS
          echo "after : [$NODE_OPTIONS]"

      - name: Show env
        shell: bash
        run: |
          echo "node: $(node -v)"
          echo "npm : $(npm -v)"
          echo "NODE_OPTIONS=[${NODE_OPTIONS:-<empty>}]"
          ls -la

      - name: Build
        shell: bash
        env:
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          # 全仓库搜 build.sh（脚本可能改名、可能在子目录、可能在 zip 里）
          SCRIPT="$(find . -maxdepth 4 -name 'build.sh' -not -path './_unz/*' | head -1)"
          if [ -z "$SCRIPT" ]; then
            echo "!! 找不到 build.sh，当前目录："
            ls -la
            exit 1
          fi
          echo "使用脚本: $SCRIPT"
          bash "$SCRIPT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxShell-win-x64-Setup
          path: out/*.exe
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
